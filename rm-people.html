<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>RM People</title>
<style>
:root {
  --brand:#4F46E5; --brand-dark:#4338CA; --brand-light:#EEF2FF; --brand-muted:#C7D2FE;
  --bg:#F7F8FB; --surface:#FFF; --border:#E4E6EB; --border-strong:#CDD0D9;
  --text-1:#111827; --text-2:#374151; --text-3:#6B7280; --text-4:#9CA3AF;
  --util-over-bg:#FEE2E2; --util-over-text:#B91C1C;
  --util-full-bg:#1E3A8A; --util-full-text:#FFF;
  --util-mid-bg:#4B7BE5; --util-mid-text:#FFF;
  --util-low-bg:#E7F6EC; --util-low-text:#166534;
  --util-zero-bg:#F3F4F6; --util-zero-text:#9CA3AF;
  --dur-line:#9CC5F0;
  --chip-bg:#74B0F0; --chip-text:#0B2E5E;
  --chip-roll-bg:#DFE3E9; --chip-roll-text:#374151;
  --hatch-c:#D5DBE3;
  --tip-bg:#111827; --tip-text:#FFF;
  --other-bg:#EFF5FE; --other-bg-hover:#E4EEFC;
  --ok-bg:#DCFCE7; --ok-line:#16A34A;
  --wip-line:#93C5FD; --wip-fill:#3B82F6;
  --col-left:340px; --col-alloc:92px; --col-week:132px;
  --radius:8px; --radius-sm:5px;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg:#0F1117; --surface:#1A1D27; --border:#2A2D3E; --border-strong:#3A3D52;
    --text-1:#F1F5F9; --text-2:#CBD5E1; --text-3:#94A3B8; --text-4:#6B7280;
    --brand-light:#1E1B4B; --brand-muted:#3730A3;
    --util-over-bg:#450A0A; --util-over-text:#FCA5A5;
    --util-full-bg:#1E3A8A; --util-full-text:#BFDBFE;
    --util-mid-bg:#2C4C8F; --util-mid-text:#DBEAFE;
    --util-low-bg:#0B2A18; --util-low-text:#86EFAC;
    --util-zero-bg:#1F2937; --util-zero-text:#4B5563;
    --dur-line:#3E6591;
    --chip-bg:#3B6FA8; --chip-text:#E3EEFA;
    --chip-roll-bg:#333A49; --chip-roll-text:#D1D5DB;
    --hatch-c:#39414F;
    --tip-bg:#F1F5F9; --tip-text:#111827;
    --other-bg:#182234; --other-bg-hover:#1E2A40;
    --ok-bg:#0B2A18; --ok-line:#4ADE80;
    --wip-line:#3E6591; --wip-fill:#60A5FA;
  }
}
:root[data-theme="dark"] {
  --bg:#0F1117; --surface:#1A1D27; --border:#2A2D3E; --border-strong:#3A3D52;
  --text-1:#F1F5F9; --text-2:#CBD5E1; --text-3:#94A3B8; --text-4:#6B7280;
  --brand-light:#1E1B4B; --brand-muted:#3730A3;
  --util-over-bg:#450A0A; --util-over-text:#FCA5A5;
  --util-full-bg:#1E3A8A; --util-full-text:#BFDBFE;
  --util-mid-bg:#2C4C8F; --util-mid-text:#DBEAFE;
  --util-low-bg:#0B2A18; --util-low-text:#86EFAC;
  --util-zero-bg:#1F2937; --util-zero-text:#4B5563;
  --dur-line:#3E6591;
  --chip-bg:#3B6FA8; --chip-text:#E3EEFA;
  --chip-roll-bg:#333A49; --chip-roll-text:#D1D5DB;
  --hatch-c:#39414F;
  --tip-bg:#F1F5F9; --tip-text:#111827;
  --other-bg:#182234; --other-bg-hover:#1E2A40;
  --ok-bg:#0B2A18; --ok-line:#4ADE80;
  --wip-line:#3E6591; --wip-fill:#60A5FA;
}

*,*::before,*::after{box-sizing:border-box;margin:0;padding:0;}
body{font-family:'Inter',-apple-system,BlinkMacSystemFont,sans-serif;font-size:13px;color:var(--text-1);background:var(--bg);height:100vh;display:flex;flex-direction:column;overflow:hidden;}

/* ── Top header ── */
.top-header{height:48px;background:var(--surface);border-bottom:1px solid var(--border);display:flex;align-items:center;padding:0 20px;gap:2px;flex-shrink:0;}
.header-icon{width:20px;height:20px;color:var(--text-2);margin-right:6px;}
.header-title{font-size:15px;font-weight:700;color:var(--text-1);margin-right:16px;}
.nav-tab{display:flex;align-items:center;gap:6px;padding:6px 12px;font-size:13px;font-weight:500;color:var(--text-3);cursor:pointer;border:none;background:none;font-family:inherit;transition:color .12s;text-decoration:none;border-bottom:2px solid transparent;margin-bottom:-1px;}
.nav-tab:hover{color:var(--text-1);}
.nav-tab.active{color:var(--brand);border-bottom-color:var(--brand);font-weight:600;}
.nav-tab svg{width:14px;height:14px;flex-shrink:0;}

/* ── Sub toolbar ── */
.sub-toolbar{height:44px;background:var(--surface);border-bottom:1px solid var(--border);display:flex;align-items:center;padding:0 16px;gap:6px;flex-shrink:0;}
.filter-chip{display:inline-flex;align-items:center;gap:5px;padding:5px 10px;border:1px solid var(--border);border-radius:var(--radius-sm);font-family:inherit;font-size:12px;font-weight:500;color:var(--text-2);background:var(--surface);cursor:pointer;}
.filter-chip svg{width:12px;height:12px;}
.filter-badge{display:inline-flex;align-items:center;gap:4px;padding:4px 8px;border-radius:var(--radius-sm);font-size:12px;font-weight:600;color:var(--brand);background:var(--brand-light);border:1px solid var(--brand-muted);}
.tb-divider{width:1px;height:20px;background:var(--border);flex-shrink:0;}
.icon-btn{width:30px;height:30px;border-radius:var(--radius-sm);background:transparent;border:none;cursor:pointer;color:var(--text-3);display:grid;place-items:center;transition:background .12s;flex-shrink:0;}
.icon-btn:hover{background:var(--bg);color:var(--text-2);}
.icon-btn svg{width:15px;height:15px;}
.find-avail-btn{display:inline-flex;align-items:center;gap:5px;padding:5px 11px;border:1px solid var(--border);border-radius:var(--radius-sm);font-family:inherit;font-size:12px;font-weight:500;color:var(--text-2);background:var(--surface);cursor:pointer;}
.find-avail-btn svg{width:13px;height:13px;}
.sub-toolbar-right{margin-left:auto;display:flex;align-items:center;gap:3px;}
.week-select,.scope-select{padding:5px 9px;border:1px solid var(--border);border-radius:var(--radius-sm);font-family:inherit;font-size:12px;font-weight:500;color:var(--text-2);background:var(--surface);cursor:pointer;outline:none;}
.scope-select{border-style:dashed;border-color:var(--border-strong);color:var(--text-3);}
.scope-select:focus{border-color:var(--brand);}
.scope-wrap{display:inline-flex;align-items:center;gap:6px;margin-left:4px;}
.scope-lbl{font-size:11px;font-weight:600;color:var(--text-4);text-transform:uppercase;letter-spacing:.04em;white-space:nowrap;}
.today-btn{padding:5px 10px;border:1px solid var(--border);border-radius:var(--radius-sm);font-family:inherit;font-size:12px;font-weight:500;color:var(--text-2);background:var(--surface);cursor:pointer;white-space:nowrap;}

/* ── Layout ── */
.page-body{flex:1;display:flex;overflow:hidden;}
.tl-scroll{flex:1;overflow:auto;}
.tl-tbl{width:100%;border-collapse:collapse;table-layout:fixed;min-width:900px;}

/* ── Table header ── */
.tl-tbl thead th{background:var(--surface);border-bottom:1px solid var(--border);font-size:11px;font-weight:600;color:var(--text-3);position:sticky;z-index:3;}
.th-left{text-align:left;width:var(--col-left);padding:6px 14px;position:sticky;left:0;z-index:5!important;background:var(--bg)!important;vertical-align:bottom;}
.th-alloc{width:var(--col-alloc);text-align:center;padding:6px 8px;border-right:1px solid var(--border);vertical-align:bottom;}
.th-month{text-align:center;padding:6px 12px;border-bottom:1px solid var(--border);top:0;background:var(--bg)!important;}
.th-week{min-width:var(--col-week);text-align:center;padding:6px 8px;top:29px;}
.th-week.today-hdr{background:#FFF7ED!important;color:#EA580C!important;border-bottom-color:#EA580C!important;}
.today-pill{display:inline-flex;align-items:center;justify-content:center;background:#EA580C;color:white;padding:1px 8px;border-radius:10px;font-size:10px;font-weight:700;}

/* ── Body rows ── */
.tl-tbl tbody td{border-bottom:1px solid var(--border);}
.td-left{position:sticky;left:0;z-index:1;background:var(--surface);width:var(--col-left);padding:0;border-right:1px solid var(--border);}
.td-alloc{width:var(--col-alloc);text-align:right;padding:9px 14px 9px 8px;font-size:12px;font-weight:500;color:var(--text-2);border-right:1px solid var(--border);background:var(--surface);font-variant-numeric:tabular-nums;white-space:nowrap;}
.td-week-cell{border-right:1px solid var(--border);background:var(--surface);padding:0;vertical-align:top;}

/* ── Tree rows: hidden until every ancestor is expanded ── */
.tree-row{display:none;}
.tree-row.visible{display:table-row;}
.tree-row:hover .td-left,.tree-row:hover .td-alloc{background:var(--bg);}
.row-cell{display:flex;align-items:center;gap:8px;}
.tw-chev{width:12px;height:12px;color:var(--text-4);flex-shrink:0;transition:transform .16s ease;}
.tw-spacer{width:12px;flex-shrink:0;}
.clickable{cursor:pointer;}

/* ── Member row ── */
.member-row{cursor:pointer;}
.member-row:hover .td-left,.member-row:hover .td-alloc{background:var(--bg);}
.member-cell{display:flex;align-items:center;gap:9px;padding:10px 14px;}
.member-avatar{width:30px;height:30px;border-radius:50%;display:grid;place-items:center;font-size:11px;font-weight:700;color:white;flex-shrink:0;}
.member-info{flex:1;min-width:0;}
.member-name{font-size:13px;font-weight:600;color:var(--text-1);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.member-role{font-size:11px;color:var(--text-3);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:1px;}
.td-alloc-total{font-weight:600;}

/* ── Utilization cells ── */
.td-util{padding:0;border-right:1px solid var(--border);}
.util-block{display:flex;flex-direction:column;align-items:center;justify-content:center;height:100%;min-height:54px;padding:8px 6px;}
.util-pct{font-size:12px;font-weight:700;font-variant-numeric:tabular-nums;line-height:1.2;}
.util-hrs{font-size:10px;font-weight:500;margin-top:2px;font-variant-numeric:tabular-nums;}
.util-over .util-block{background:var(--util-over-bg);}
.util-over .util-pct,.util-over .util-hrs{color:var(--util-over-text);}
.util-full .util-block{background:var(--util-full-bg);}
.util-full .util-pct,.util-full .util-hrs{color:var(--util-full-text);}
.util-mid .util-block{background:var(--util-mid-bg);}
.util-mid .util-pct,.util-mid .util-hrs{color:var(--util-mid-text);}
.util-low .util-block{background:var(--util-low-bg);}
.util-low .util-pct,.util-low .util-hrs{color:var(--util-low-text);}
.util-zero .util-block{background:var(--util-zero-bg);}
.util-zero .util-pct,.util-zero .util-hrs{color:var(--util-zero-text);}

/* ══ Timeline bars ══
   Each week cell is a 7-day track. The duration line runs along the top
   for the row's whole date range; below it, allocation chips cover the
   allocated working days and hatched blocks mark the weekend inside them. */
.cell-stack{display:flex;flex-direction:column;padding:5px 0 8px;min-height:46px;}
.dur-track{display:flex;height:3px;margin-bottom:9px;}
.dur-seg{border-radius:2px;}
.dur-seg.on{background:var(--dur-line);}
.alloc-track{display:flex;align-items:center;gap:2px;height:23px;}
.seg{min-width:0;border-radius:3px;}
.seg-chip{background:var(--chip-bg);color:var(--chip-text);display:flex;align-items:center;justify-content:center;height:100%;font-size:11px;font-weight:600;white-space:nowrap;overflow:hidden;font-variant-numeric:tabular-nums;}
/* Roll-up rows (a project summing its budget lines) read quieter than the
   budget lines themselves, so the leaf allocations stay the focus. */
.seg-chip.roll{background:var(--chip-roll-bg);color:var(--chip-roll-text);}
.seg-hatch{height:100%;background-image:repeating-linear-gradient(45deg,var(--hatch-c) 0 3px,transparent 3px 6px);}

/* ── Project rows ── */
.name-1{font-size:12px;color:var(--text-2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;flex:1;min-width:0;}
.row-actions{display:none;align-items:center;gap:1px;flex-shrink:0;}
.tree-row:hover .row-actions{display:flex;}
.act-btn{width:24px;height:24px;border-radius:4px;background:transparent;border:none;cursor:pointer;color:var(--text-3);display:grid;place-items:center;position:relative;}
.act-btn:hover{background:var(--brand-light);color:var(--brand);}
.act-btn svg{width:13px;height:13px;}
.act-btn::after{content:attr(data-tip);position:absolute;bottom:calc(100% + 5px);left:50%;transform:translateX(-50%);background:var(--tip-bg);color:var(--tip-text);font-size:10px;font-weight:600;padding:3px 7px;border-radius:4px;white-space:nowrap;opacity:0;pointer-events:none;transition:opacity .1s;z-index:20;}
.act-btn:hover::after{opacity:1;}

/* ── Budget rows ── */
.bud-info{flex:1;min-width:0;}
.bud-name{font-size:12px;color:var(--text-2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.bud-billing{font-size:11px;color:var(--text-4);margin-top:1px;white-space:nowrap;}

/* ── Grouping rows (0 allocation) ── */
.count-badge{padding:1px 5px;border-radius:3px;background:var(--border);color:var(--text-3);font-size:10px;font-weight:600;flex-shrink:0;}

/* ── "Other Projects" row (out of scope) ──
   Icon, label, allocated hours. No bars: the row stands for projects the
   viewer cannot see, so there is nothing to place on the timeline. */
.other-icon{width:15px;height:15px;color:var(--text-3);flex-shrink:0;}
.other-row .td-left,.other-row .td-alloc,.other-row .td-week-cell{background:var(--other-bg);}
.other-row:hover .td-left,.other-row:hover .td-alloc{background:var(--other-bg-hover);}
</style>
</head>
<body>

<div class="top-header">
  <svg class="header-icon" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="1.75"><path d="M17 21v-2a4 4 0 00-4-4H5a4 4 0 00-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M23 21v-2a4 4 0 00-3-3.87M16 3.13a4 4 0 010 7.75"/></svg>

  <a class="nav-tab active" href="#">
    <svg fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="1.75"><path d="M17 21v-2a4 4 0 00-4-4H5a4 4 0 00-4 4v2"/><circle cx="9" cy="7" r="4"/></svg>

<div class="page-body">

    <table class="tl-tbl">

<script>
/* ══════════════════════════════════════════════════════════
   Hierarchy
     Team member
       ├─ Projects with allocation          (expand → budgets)
       │    ├─ Budgets with allocation
       │    └─ Budgets with 0 allocation    (collapsed group)
       ├─ Projects with 0 allocation        (collapsed group)
       │    └─ each project (expand → its budgets, flat)
       └─ Other Projects                    (out-of-scope roll-up)

   Access scope
     A project is visible when its `tier` is at or below the viewer's
     level. Anything above it is out of scope and its allocations roll
     into the single "Other Projects" row.
       tier 0 — viewer is a participant on the project
       tier 1 — project belongs to the viewer's group
       tier 2 — org-wide visibility required
══════════════════════════════════════════════════════════ */
const SCOPE_LEVEL = { participant:0, group:1, all:2 };
let viewerScope = 'group';

const WEEKS = [
  {label:'10–16th'},{label:'17–23rd'},{label:'24–30th'},
  {label:'31st–6th',today:true},
  {label:'7–13th'},{label:'14–20th'},{label:'21–27th'},{label:'28th–4th'},
];
const MONTHS = ["Aug '26","Sep '26"];
const MONTH_COLS = [3,5];
const N = WEEKS.length;
const DAYS = N * 7;
const isWorkday = d => d % 7 < 5;   // day 0 of each week is Monday

/* Rows are described in whole days across the visible range.
     dur     — [firstDay, lastDay] the project/budget runs; the thin line
     alloc   — [firstDay, lastDay] this person is booked, or null for 0h
     hpd     — hours per working day inside `alloc`
     tier    — access tier needed to see the project
     budgets — budget lines; when present the project's hours are their sum
     billing — budget billing type, shown under the budget name
     state   — 'done' | 'wip', drives the budget status icon */
const MEMBERS = [
  {
    id:'atul', name:'Atul Dhiman', role:'Senior Digital Building Consultant · INDIA',
    initials:'AD', gradient:'linear-gradient(135deg,#4F46E5,#818CF8)', capHrs:40,
    projects:[
      {name:'BOS Deploy NC: US-East', tier:0, dur:[0,55], budgets:[
        {name:'Implementation — Core Platform', billing:'Fixed fee',        state:'wip',  dur:[0,55],  alloc:[0,55], hpd:2},
        {name:'Change Management',              billing:'Time & materials', state:'wip',  dur:[0,55],  alloc:[0,55], hpd:1},
        {name:'Training Delivery',              billing:'Fixed fee',        state:'done', dur:[35,55], alloc:null},
        {name:'Post go-live Support',           billing:'Fixed fee',        state:'done', dur:[42,55], alloc:null},
      ]},
      {name:'BOS Deploy MET: IN-Bangalore',   tier:0, dur:[10,55], alloc:[16,55], hpd:3},
      {name:'Northwind — Grid Modernisation', tier:2, dur:[0,44],  alloc:[0,41],  hpd:2},

/* ── Allocation maths ──
   A leaf (budget, or a project with no budget lines) computes its own
   hours. A project with budget lines is always the sum of them, so a
   parent row can never disagree with the rows nested under it. */
function leafWeekMins(n, w){
  if(!n.alloc) return 0;
  let days = 0;
  for(let d = w*7; d < w*7+7; d++){
    if(isWorkday(d) && d >= n.alloc[0] && d <= n.alloc[1]) days++;
  }
  return days * n.hpd * 60;
}
const hasBudgets = p => Array.isArray(p.budgets) && p.budgets.length > 0;

function projWeekMins(p, w){
  return hasBudgets(p) ? p.budgets.reduce((s,b)=>s+leafWeekMins(b,w),0) : leafWeekMins(p,w);
}
function totalMins(node, weekFn){
  let t = 0;
  for(let w=0; w<N; w++) t += weekFn(node,w);
  return t;
}
const projTotalMins = p => totalMins(p, projWeekMins);
const budTotalMins  = b => totalMins(b, leafWeekMins);

/* A project counts as allocated when anything under it is booked. */
const projIsAllocated = p => projTotalMins(p) > 0;

function fmtMins(m){
  if(!m || m<=0) return '0h';
  const h = Math.floor(m/60), mm = Math.round(m%60);
  const hs = h.toLocaleString('en-US');
  if(mm===0) return hs+'h';
  if(h===0)  return mm+'m';
  return hs+'h '+String(mm).padStart(2,'0')+'m';
}
function utilCls(pct){
  if(pct>100) return 'util-over';
  if(pct>=80) return 'util-full';
  if(pct>=40) return 'util-mid';
  if(pct>0)   return 'util-low';
  return 'util-zero';
}

const rightBorder = i => i<N-1 ? '1px solid var(--border)' : 'none';

/* ── Bar rendering ──
   Days are classified, then run-length encoded into flex segments so a
   five-day block is one chip rather than five, and the weekend inside an
   allocation reads as a single hatched gap. */
function rle(kinds){
  const out = [];
  kinds.forEach(k=>{
    const last = out[out.length-1];
    if(last && last.k===k) last.n++;
    else out.push({k, n:1});
  });
  return out;
}

function durationTrack(w, dur){
  const kinds = [];
  for(let d=w*7; d<w*7+7; d++){
    kinds.push(dur && d>=dur[0] && d<=dur[1] ? 'on' : 'off');
  }
  return rle(kinds).map(s=>`<div class="dur-seg ${s.k}" style="flex:${s.n}"></div>`).join('');
}

function allocTrack(w, covered, label, roll){
  const kinds = [];
  for(let d=w*7; d<w*7+7; d++){
    kinds.push(!covered[d] ? 'off' : (isWorkday(d) ? 'work' : 'wknd'));
  }
  const segs = rle(kinds);

  // Put the week's hours on the widest working block; skip it if too narrow.
  let labelIdx = -1, widest = 0;
  segs.forEach((s,i)=>{ if(s.k==='work' && s.n>widest){ widest=s.n; labelIdx=i; } });
  if(widest < 2) labelIdx = -1;

  return segs.map((s,i)=>{
    if(s.k==='off')  return `<div class="seg" style="flex:${s.n}"></div>`;
    if(s.k==='wknd') return `<div class="seg seg-hatch" style="flex:${s.n}"></div>`;
    const txt = (i===labelIdx && label) ? label : '';
    return `<div class="seg seg-chip${roll?' roll':''}" style="flex:${s.n}">${txt}</div>`;
  }).join('');
}

function barCells({dur, covered, weekLabel, roll}){
  return WEEKS.map((w,i)=>`
    <td class="td-week-cell" style="border-right:${rightBorder(i)}">
      <div class="cell-stack">
        <div class="dur-track">${durationTrack(i, dur)}</div>
        <div class="alloc-track">${allocTrack(i, covered, weekLabel(i), roll)}</div>
      </div>
    </td>`).join('');
}

function emptyWeeks(){
  return WEEKS.map((w,i)=>`<td class="td-week-cell" style="border-right:${rightBorder(i)}"></td>`).join('');
}

/* Union of allocated days across a set of nodes. */
function coverOf(nodes){
  const cov = new Array(DAYS).fill(false);
  nodes.forEach(n=>{
    if(!n.alloc) return;
    for(let d=n.alloc[0]; d<=n.alloc[1]; d++) if(d>=0 && d<DAYS) cov[d]=true;
  });
  return cov;
}
const projCover = p => coverOf(hasBudgets(p) ? p.budgets : [p]);

/* ── Icons ── */
const iconProj    = `<svg width="14" height="14" viewBox="0 0 14 14" fill="none" style="flex-shrink:0"><circle cx="7" cy="7" r="6" stroke="#D1D5DB" stroke-width="1.5"/><path d="M7 1 A6 6 0 0 1 13 7" stroke="#10B981" stroke-width="1.5" stroke-linecap="round"/></svg>`;
const iconProjIdle= `<svg width="14" height="14" viewBox="0 0 14 14" fill="none" style="flex-shrink:0"><circle cx="7" cy="7" r="6" stroke="#D1D5DB" stroke-width="1.5" stroke-dasharray="2.5 2"/></svg>`;
const iconBudDone = `<svg width="15" height="15" viewBox="0 0 24 24" fill="none" style="flex-shrink:0"><circle cx="12" cy="12" r="9.5" fill="var(--ok-bg)" stroke="var(--ok-line)" stroke-width="1.6"/><path d="M7.8 12.3l2.9 2.9 5.5-6.2" stroke="var(--ok-line)" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg>`;
const iconBudWip  = `<svg width="15" height="15" viewBox="0 0 24 24" fill="none" style="flex-shrink:0"><circle cx="12" cy="12" r="9.5" stroke="var(--wip-line)" stroke-width="1.6"/><path d="M12 2.5 A9.5 9.5 0 0 1 21.5 12 L12 12 Z" fill="var(--wip-fill)"/></svg>`;
/* Generic stand-in for the customer logo on out-of-scope allocations */
const iconOther   = `<svg class="other-icon" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="1.9"><rect x="3" y="3" width="7" height="7" rx="1.5"/><rect x="14" y="3" width="7" height="7" rx="1.5"/><rect x="3" y="14" width="7" height="7" rx="1.5"/><rect x="14" y="14" width="7" height="7" rx="1.5"/></svg>`;

const ACTIONS = `
  <div class="row-actions">
    <button class="act-btn" data-tip="Open project plan"><svg fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><path d="M18 13v6a2 2 0 01-2 2H5a2 2 0 01-2-2V8a2 2 0 012-2h6"/><path d="M15 3h6v6M10 14L21 3"/></svg></button>
    <button class="act-btn" data-tip="Edit allocation"><svg fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><path d="M11 4H4a2 2 0 00-2 2v14a2 2 0 002 2h14a2 2 0 002-2v-7"/><path d="M18.5 2.5a2.12 2.12 0 013 3L12 15l-4 1 1-4 9.5-9.5z"/></svg></button>
    <button class="act-btn" data-tip="Remove"><svg fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><path d="M3 6h18M8 6V4a2 2 0 012-2h4a2 2 0 012 2v2M19 6l-1 14a2 2 0 01-2 2H8a2 2 0 01-2-2L5 6"/></svg></button>
  </div>`;

/* ── Scope partitioning ── */
function partition(member){
  const level = SCOPE_LEVEL[viewerScope];
  const inScope  = member.projects.filter(p => p.tier <= level);
  const outScope = member.projects.filter(p => p.tier >  level);
  return {
    allocated: inScope.filter(projIsAllocated),
    zero:      inScope.filter(p => !projIsAllocated(p)),
    // Out-of-scope projects with no allocation in range contribute nothing
    // and are never surfaced — not even as a count.
    other:     outScope.filter(projIsAllocated),
  };
}
function budgetSplit(p){
  const bs = p.budgets || [];
  return { allocated: bs.filter(b=>budTotalMins(b)>0), zero: bs.filter(b=>budTotalMins(b)===0) };
}

/* ── Row builder ──
   `anc` is the parent's key. A row shows only when that key and every key
   above it is expanded, so nesting depth needs no special handling. */
function row({anc, cls='', indent, chevKey, body, alloc, cells}){
  const chev = chevKey
    ? `<svg class="tw-chev" data-tog="${chevKey}" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2.5"><path d="M9 18l6-6-6-6"/></svg>`
    : `<span class="tw-spacer"></span>`;
  const click = chevKey ? ` onclick="toggle('${chevKey}')"` : '';
  return `
    <tr class="tree-row ${cls}${chevKey?' clickable':''}" data-anc="${anc}"${click}>
      <td class="td-left">
        <div class="row-cell" style="padding:12px 14px 12px ${indent}px">${chev}${body}</div>
      </td>
      <td class="td-alloc">${alloc}</td>
      ${cells}
    </tr>`;
}

/* Indent ladder, in px, for each depth of the tree. */
const IND = [14, 34, 62];

/* ── Render: header ── */
function renderHeader(){
  const monthRow = MONTHS.map((m,i)=>
    `<th class="th-month" colspan="${MONTH_COLS[i]}" style="border-right:${i<MONTHS.length-1?'1px solid var(--border)':'none'}">${m}</th>`
  ).join('');
  const weekRow = WEEKS.map((w,i)=>{
    const cls   = w.today ? 'th-week today-hdr' : 'th-week';
    const inner = w.today ? `<span class="today-pill">${w.label}</span>` : w.label;
    return `<th class="${cls}" style="border-right:${rightBorder(i)}">${inner}</th>`;
  }).join('');

  document.getElementById('rm-thead').innerHTML = `
    <tr>
      <th class="th-left" rowspan="2" style="top:0;z-index:5;">
        <span style="font-size:12px;font-weight:700;color:var(--text-2)">Team members</span>
      </th>
      <th class="th-alloc" rowspan="2" style="top:0;">Allocated</th>
      ${monthRow}
    </tr>
    <tr>${weekRow}</tr>`;
}

/* ── Render: a budget leaf row ── */
function budgetRow(b, anc, indent){
  const icon = b.state === 'done' ? iconBudDone : iconBudWip;
  const body = `${icon}
    <div class="bud-info">
      <div class="bud-name">${b.name}</div>
      <div class="bud-billing">${b.billing}</div>
    </div>${ACTIONS}`;
  return row({
    anc, cls:'bud-row', indent, body,
    alloc: fmtMins(budTotalMins(b)),
    cells: barCells({
      dur: b.dur,
      covered: coverOf([b]),
      weekLabel: i => { const wm = leafWeekMins(b,i); return wm>0 ? fmtMins(wm) : ''; },
    }),
  });
}

/* ── Render: a project row plus everything under it ── */
function projectSubtree(p, key, anc, depth, {flatBudgets=false} = {}){
  const budgets = budgetSplit(p);
  const expandable = hasBudgets(p);
  const allocated = projIsAllocated(p);

  let html = row({
    anc, cls:'proj-row', indent: IND[depth],
    chevKey: expandable ? key : null,
    body: `${allocated ? iconProj : iconProjIdle}<span class="name-1">${p.name}</span>${ACTIONS}`,
    alloc: fmtMins(projTotalMins(p)),
    cells: barCells({
      dur: p.dur,
      covered: projCover(p),
      weekLabel: i => { const wm = projWeekMins(p,i); return wm>0 ? fmtMins(wm) : ''; },
      // A project with budget lines is a roll-up of them, so its chips sit back.
      roll: expandable,
    }),
  });

  if(!expandable) return html;

  // Inside a project that is itself under "Projects with 0 allocation",
  // every budget is necessarily 0h — listing them flat avoids a redundant
  // "Budgets with 0 allocation" group nested inside a 0-allocation group.
  if(flatBudgets){
    p.budgets.forEach(b=>{ html += budgetRow(b, key, IND[depth+1]); });
    return html;
  }

  budgets.allocated.forEach(b=>{ html += budgetRow(b, key, IND[depth+1]); });

  if(budgets.zero.length){
    const zbKey = `${key}|zb`;
    html += row({
      anc: key, cls:'zbud-group', indent: IND[depth+1], chevKey: zbKey,
      body: `<span class="name-1">Budgets with 0 allocation</span><span class="count-badge">${budgets.zero.length}</span>`,
      alloc: '0h',
      cells: emptyWeeks(),
    });
    // Same indent as the allocated budgets above: grouping a budget must not
    // push its name out of line with the budgets it sits alongside.
    budgets.zero.forEach(b=>{ html += budgetRow(b, zbKey, IND[depth+1]); });
  }
  return html;
}

/* ── Render: body ── */
function renderBody(){
  let html = '';

  MEMBERS.forEach(m=>{
    const { allocated, zero, other } = partition(m);
    const mKey = `m:${m.id}`;
    const capMins = m.capHrs * 60;

    // Utilisation always reflects every allocation, in scope or not, so the
    // person's true load is never understated.
    const utilCells = WEEKS.map((w,i)=>{
      const mins = m.projects.reduce((s,p)=>s+projWeekMins(p,i),0);
      const pct  = Math.round(mins/capMins*100);
      return `<td class="td-util ${utilCls(pct)}" style="border-right:${rightBorder(i)}">
                <div class="util-block"><span class="util-pct">${pct}%</span><span class="util-hrs">(${fmtMins(mins)})</span></div>
              </td>`;
    }).join('');

    const memberMins = m.projects.reduce((s,p)=>s+projTotalMins(p),0);

    html += `
      <tr class="member-row" onclick="toggle('${mKey}')">
        <td class="td-left">
          <div class="member-cell">
            <svg class="tw-chev" data-tog="${mKey}" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2.5"><path d="M9 18l6-6-6-6"/></svg>
            <div class="member-avatar" style="background:${m.gradient}">${m.initials}</div>
            <div class="member-info">
              <div class="member-name">${m.name}</div>
              <div class="member-role">${m.role}</div>
            </div>
          </div>
        </td>
        <td class="td-alloc td-alloc-total">${fmtMins(memberMins)}</td>
        ${utilCells}
      </tr>`;

    // 1 — Projects the viewer can see, with allocation
    allocated.forEach((p,idx)=>{
      html += projectSubtree(p, `${mKey}|p${idx}`, mKey, 1);
    });

    // 2 — Visible projects with no allocation, collapsed into one group.
    //     Each still draws its duration line so the project reads as real.
    if(zero.length){
      const zpKey = `${mKey}|zp`;
      html += row({
        anc: mKey, cls:'zproj-group', indent: IND[1], chevKey: zpKey,
        body: `<span class="name-1">Projects with 0 allocation</span><span class="count-badge">${zero.length}</span>`,
        alloc: '0h',
        cells: emptyWeeks(),
      });
      // Depth 1, matching the allocated projects above: grouping them must not
      // push their names out of line with the projects they sit alongside.
      zero.forEach((p,idx)=>{
        html += projectSubtree(p, `${zpKey}|p${idx}`, zpKey, 1, {flatBudgets:true});
      });
    }

    // 3 — Everything outside the viewer's scope, as one opaque row, last.
    //     Generic icon, label, total hours — nothing else. No project names,
    //     no logo, no timeline bars, no actions, no drill-in.
    if(other.length){
      const otherMins = other.reduce((s,p)=>s+projTotalMins(p),0);
      html += row({
        anc: mKey, cls:'other-row', indent: IND[1],
        body: `${iconOther}<span class="name-1">Other Projects</span>`,
        alloc: fmtMins(otherMins),
        cells: emptyWeeks(),
      });
    }
  });

  document.getElementById('rm-tbody').innerHTML = html;
  applyState();
}

/* ── Expand / collapse ──
   One flat set of expanded keys. A key encodes its own ancestry, so a row
   is visible when every prefix of its parent key is expanded. */
const expanded = new Set();

function prefixesOf(key){
  const parts = key.split('|'), out = [];
  for(let i=0; i<parts.length; i++) out.push(parts.slice(0,i+1).join('|'));
  return out;
}

function applyState(){
  document.querySelectorAll('tr.tree-row').forEach(r=>{
    const anc = r.dataset.anc;
    r.classList.toggle('visible', !anc || prefixesOf(anc).every(k=>expanded.has(k)));
  });
  document.querySelectorAll('.tw-chev').forEach(el=>{
    el.style.transform = expanded.has(el.dataset.tog) ? 'rotate(90deg)' : '';
  });
}

function toggle(key){
  if(expanded.has(key)){
    // Collapse descendants too, so reopening starts from a clean state.
    [...expanded].forEach(k=>{ if(k.startsWith(key+'|')) expanded.delete(k); });
    expanded.delete(key);
  } else {
    expanded.add(key);
  }
  applyState();
}

function setScope(scope){
  viewerScope = scope;
  renderBody();
}

/* Measure the rendered month-row height and pin the week row to it, rather
   than trusting the CSS approximation across browsers and zoom levels. */
function fixWeekTop(){
  const thead = document.getElementById('rm-thead');
  if(!thead || !thead.rows[0]) return;
  const h = Math.ceil(thead.rows[0].getBoundingClientRect().height);
  thead.querySelectorAll('.th-week').forEach(th=>{ th.style.top = h+'px'; });
}

renderHeader();
renderBody();
requestAnimationFrame(fixWeekTop);
</script>
