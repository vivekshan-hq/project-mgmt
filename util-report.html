<!-- Target utilisation gate — reads the switch set in rm-settings.html -->
<script>
(function(){
  var DEF = { enabled:false, unit:'target',
              edges:[40,70,90,110],
              colours:['#FFEDD5','#FEF3C7',null,null,'#FEE2E2'] };
  function read(){
    try{
      var raw = localStorage.getItem('rl.targetUtilisation');
      if(!raw) return DEF;
      var s = JSON.parse(raw);
      if(!Array.isArray(s.edges)) return { enabled: !!s.enabled, unit:DEF.unit,
                                           edges:DEF.edges.slice(), colours:DEF.colours.slice() };
      return { enabled: !!s.enabled,
               unit: s.unit === 'capacity' ? 'capacity' : 'target',
               edges: s.edges.slice().sort(function(a,b){return a-b;}),
               colours: (s.colours && s.colours.length === s.edges.length + 1)
                        ? s.colours.slice() : DEF.colours.slice() };
    }catch(e){ return DEF; }
  }
  window.TU = read();
  /* The band a week falls in, or null when that band is set to no highlight.
     Edges are ascending and contiguous, so exactly one band always matches. */
  window.TU.bandFor = function(planned, target){
    var c = window.TU;
    if(!c.enabled) return null;
    if(c.unit === 'target' && (target == null)) return null;
    var v = c.unit === 'capacity' ? planned : Math.round(planned / target * 100);
    var i = 0;
    for(var k = c.edges.length - 1; k >= 0; k--){ if(v >= c.edges[k]){ i = k + 1; break; } }
    var colour = c.colours[i];
    return colour ? { colour: colour, band: i } : null;
  };
  function apply(){ document.body.classList.toggle('tu-off', !window.TU.enabled); }
  if(document.body) apply(); else document.addEventListener('DOMContentLoaded', apply);
  // Reflect a change made in another tab without a manual reload.
  window.addEventListener('storage', function(e){ if(e.key === 'rl.targetUtilisation') location.reload(); });
})();
</script>

td.has-val{background:var(--cell-fill);}

.hrs{font-size:11px;color:var(--text-3);font-variant-numeric:tabular-nums;margin-top:1px;}
.dash{color:var(--text-4);}
</style>

<script>
/* The report lists everyone, so most rows are a flat 0%. Values mirror the
   product screen: a figure with its hours beneath, an em dash where the
   person has no record for the period at all. */
const AVATAR = '#EF8A8A';

/* target: the resolved weekly target, or null where none is set at either
   level. pct/mins: null means no record for the period, which renders as a
   dash on an untinted cell rather than a zero. */
const ROWS = [
  { name:'aathi',               initials:'A',  target:75,   pct:0,    mins:0   },
  { name:'aathi shankar',       initials:'AS', target:75,   pct:0,    mins:0   },
  { name:'ab',                  initials:'A',  target:80,   pct:0.91, mins:120 },
  { name:'ab',                  initials:'A',  target:null, pct:null, mins:null},
  { name:'ab',                  initials:'A',  target:80,   pct:0,    mins:0   },
  { name:'abbhinav',            initials:'A',  target:85,   pct:0,    mins:0   },
  { name:'abhishek reddy L',    initials:'AR', target:85,   pct:0,    mins:0   },
  { name:'abishna',             initials:'A',  target:75,   pct:0,    mins:0   },
  { name:'acapener',            initials:'A',  target:null, pct:0,    mins:0   },
  { name:'adhithyan manoharan', initials:'AM', target:80,   pct:0,    mins:0   },
  { name:'adhithyan1',          initials:'A',  target:80,   pct:0,    mins:0   },
  { name:'Adithya Gopi',        initials:'AG', target:85,   pct:0,    mins:0   },
  { name:'Aditya Khandelwal',   initials:'AK', target:85,   pct:0,    mins:0   },
  { name:'aditya Nagarajan',    initials:'AN', target:75,   pct:0,    mins:0   },
  { name:'aditya1',             initials:'A',  target:75,   pct:0,    mins:0   },
  { name:'aditya3 N',           initials:'AN', target:70,   pct:0,    mins:0   },
  { name:'Advaith R',           initials:'AR', target:70,   pct:0,    mins:0   },
  { name:'Akhil Nair',          initials:'AN', target:60,   pct:0,    mins:0   },
  { name:'Akilesh M',           initials:'AM', target:80,   pct:0,    mins:0   },
];

function fmtMins(m){
  if(m === null) return '';
  if(m === 0) return '0m';
  const h = Math.floor(m/60), mm = m%60;
  return h ? `${h}h ${String(mm).padStart(2,'0')}m` : `${mm}m`;
}

function render(){
  const total = ROWS.reduce((s,r)=> s + (r.pct || 0), 0) / ROWS.length;

  let html = `
    <tr class="row-total">
      <td>Total</td>
      <td class="tu-col"></td>
      <td><div class="num">${total.toFixed(2)}%</div></td>
      <td></td>
    </tr>`;

  ROWS.forEach(r => {
    const hasVal = r.pct !== null;
    const cell = hasVal
      ? `<div class="num">${r.pct.toFixed(2)}%</div><div class="hrs">(${fmtMins(r.mins)})</div>`
      : `<div class="num dash">&mdash;</div>`;

    // With target utilisation on, the configured rules decide the tint; with
    // it off the report keeps its own fixed one.
    const band = hasVal ? window.TU.bandFor(r.pct, r.target) : null;
    const tint = band ? ` style="background:${band.colour}"` : '';

    html += `
      <tr>
        <td>
          <div class="member">
            <div class="avatar" style="background:${AVATAR}">${r.initials}</div>
            <span class="member-name">${r.name}</span>
          </div>
        </td>
        <td class="tu-col">${r.target === null
              ? '<span class="target target-none">&mdash;</span>'
              : `<span class="target">${r.target}%</span>`}</td>
        <td class="${hasVal && !band ? 'has-val' : ''}"${tint}>${cell}</td>
        <td></td>
      </tr>`;
  });

  document.getElementById('tbody').innerHTML = html;
}

render();
</script>
