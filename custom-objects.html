<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Custom objects · Settings</title>

<!-- The design system, in the order the kit requires: tokens and the shadcn
     primitives first, then the Rocketlane product layer on top of them. -->
<link rel="stylesheet" href="ds/styles.css">
<link rel="stylesheet" href="ds/rocketlane.css">

<style>
/* ──────────────────────────────────────────────────────────────
   Custom objects — Settings › Advanced

   Phase 1 (create the object), Phase 3 (fields) and Phase 4
   (relationships) from the Notion specs.

   Chrome, buttons, tags, tabs, drawer and fields all come from the
   Rocketlane kit (.rl-*). What is left here is only the handful of
   things the kit has no component for: the data-type glyph, the type
   picker, the relationship map, the picklist editor and the menu.
   Two of them (.co-input, .co-table) deliberately mirror a kit spec —
   each says which, so drift is visible.
   ────────────────────────────────────────────────────────────── */

/* The kit's page chrome sets these on html/body; this page is not loading
   page-chrome.css (it would duplicate app-shell.css), so set them here. */
html, body {
  margin: 0; height: 100%; overflow: hidden;
  background: var(--background); color: var(--foreground);
  font-family: var(--font-sans); font-size: 14px;
}
*, *::before, *::after { box-sizing: border-box; }
button { font-family: inherit; border: none; background: transparent; color: inherit; cursor: pointer; padding: 0; }
a { color: inherit; text-decoration: none; }
.hidden { display: none !important; }

/* ── Native controls, styled to the FieldShell spec ──────────────
   The kit's Select builds its trigger out of .rl-field-shell, but that
   class starts with `all: unset`, which strips a native <input> of the
   behaviour we want. So this mirrors FieldShell's visual spec —
   32px min-height, 1px border, --radius-md, 14px, primary focus ring —
   for real form controls. Keep the two in step. */
.co-input {
  display: block; width: 100%;
  min-height: 32px; height: 32px; padding: 0 10px;
  background: var(--card); color: var(--foreground);
  border: 1px solid var(--border);
  border-radius: var(--radius-md);
  font-family: inherit; font-size: 14px; line-height: 1;
  outline: none;
  transition: border-color 120ms ease, background 120ms ease, box-shadow 120ms ease;
}
.co-input::placeholder { color: var(--muted-foreground); }
.co-input:hover:not(:disabled):not(:focus) { border-color: color-mix(in oklab, var(--primary) 25%, var(--border)); }
.co-input:focus {
  border-color: var(--primary);
  box-shadow: 0 0 0 3px color-mix(in oklab, var(--primary) 15%, transparent);
}
.co-input:disabled { opacity: 0.55; cursor: not-allowed; background: color-mix(in oklab, var(--muted) 40%, var(--card)); }
.co-input[aria-invalid="true"] { border-color: oklch(0.55 0.2 25); }
textarea.co-input { height: auto; min-height: 64px; padding: 7px 10px; line-height: 1.5; resize: vertical; }
select.co-input {
  cursor: pointer; appearance: none; padding-right: 30px;
  background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='%23717179' stroke-width='2'><path d='M6 9l6 6 6-6'/></svg>");
  background-repeat: no-repeat; background-position: right 9px center; background-size: 14px;
}
.co-mono { font-family: var(--font-mono); }

/* ── Table, mirroring the kit's accounts table spec ──────────────
   36px header row at 12px/500 muted, 44px body rows, first column
   padded to the 24px page gutter, --muted on row hover. */
.co-table-wrap { overflow: auto; }
.co-table { border-collapse: separate; border-spacing: 0; width: 100%; font-size: 14px; }
.co-table thead th {
  position: sticky; top: 0; z-index: 5;
  background: var(--background);
  border-bottom: 1px solid var(--border);
  padding: 0 12px; height: 36px; text-align: left;
  font-size: 12px; font-weight: 500; color: var(--muted-foreground);
  white-space: nowrap; vertical-align: middle;
}
.co-table tbody td {
  padding: 8px 12px; min-height: 44px;
  border-bottom: 1px solid color-mix(in oklab, var(--border) 60%, transparent);
  color: var(--foreground); vertical-align: middle;
}
.co-table tbody tr:last-child td { border-bottom: 0; }
.co-table thead th.col-first, .co-table tbody td.col-first { padding-left: 24px; }
.co-table thead th.col-last, .co-table tbody td.col-last { padding-right: 24px; }
.co-table tbody tr.is-clickable { cursor: pointer; }
.co-table tbody tr.is-clickable:hover td { background: var(--muted); }
.co-table .num { text-align: right; font-variant-numeric: tabular-nums; }
.co-table .is-empty { color: var(--muted-foreground); opacity: 0.55; }

.co-name { display: flex; align-items: center; gap: 10px; min-width: 0; }
.co-api { font-family: var(--font-mono); font-size: 12px; color: var(--muted-foreground); margin-top: 2px; }
.co-row-actions { display: flex; gap: 2px; justify-content: flex-end; opacity: 0; transition: opacity 100ms; }
.co-table tbody tr:hover .co-row-actions { opacity: 1; }

/* ── Data-type glyph ─────────────────────────────────────────────
   A 24px mono chip rather than an icon. Lucide swaps <i data-lucide>
   for a 24px SVG, which blows out a table cell; this cannot. */
.co-glyph {
  width: 24px; height: 24px; border-radius: var(--radius-sm);
  display: grid; place-items: center; flex-shrink: 0;
  font-family: var(--font-mono); font-size: 10.5px; font-weight: 600; letter-spacing: -0.02em;
  background: var(--tag-bg-gray); color: var(--tag-fg-gray);
}
.co-glyph.g-text   { background: var(--tag-bg-blue);   color: var(--tag-fg-blue); }
.co-glyph.g-num    { background: var(--tag-bg-green);  color: var(--tag-fg-green); }
.co-glyph.g-choice { background: var(--tag-bg-orange); color: var(--tag-fg-orange); }
.co-glyph.g-rel    { background: var(--tag-bg-purple); color: var(--tag-fg-purple); }
.co-glyph.g-calc   { background: var(--tag-bg-pink);   color: var(--tag-fg-pink); }
.co-glyph.g-sys    { background: var(--tag-bg-gray);   color: var(--tag-fg-gray); }
.co-glyph.lg { width: 30px; height: 30px; font-size: 12px; border-radius: var(--radius-md); }

/* ── Page body padding ───────────────────────────────────────── */
.co-body { padding: 20px 24px 40px; }
/* The product's pages run full-bleed inside the 24px page gutter rather
   than centring a column, so tables fill the main card. Prose blocks cap
   their own width where reading length matters. */
.co-inner { max-width: none; }

/* ── Section label ───────────────────────────────────────────── */
.co-sec { display: flex; align-items: center; gap: 10px; margin: 22px 0 10px; }
.co-sec:first-child { margin-top: 0; }
.co-sec-t { font-size: 11px; font-weight: 600; letter-spacing: 0.06em; text-transform: uppercase; color: var(--muted-foreground); }
.co-sec-line { flex: 1; height: 1px; background: var(--border); }

/* ── Empty state ─────────────────────────────────────────────── */
.co-empty {
  border: 1px dashed var(--border); border-radius: var(--radius-lg);
  padding: 48px 28px; text-align: center;
  background: color-mix(in oklab, var(--muted) 35%, var(--background));
}
.co-empty-t { font-size: 15px; font-weight: 600; margin-bottom: 6px; }
.co-empty-d { font-size: 14px; color: var(--muted-foreground); line-height: 1.55; max-width: 460px; margin: 0 auto 18px; }

/* ── Callouts ────────────────────────────────────────────────── */
.co-note {
  display: flex; gap: 10px; padding: 11px 13px;
  border-radius: var(--radius-md); font-size: 13px; line-height: 1.55;
  border: 1px solid var(--border); background: color-mix(in oklab, var(--muted) 40%, var(--background));
  color: var(--muted-foreground); margin-bottom: 16px;
}
.co-note b { color: var(--foreground); font-weight: 600; }
.co-note { max-width: 940px; }
.co-note.warn {
  background: var(--tag-bg-yellow); border-color: color-mix(in oklab, var(--tag-fg-yellow) 25%, transparent);
  color: var(--tag-fg-yellow);
}
.co-note.warn b { color: var(--tag-fg-yellow); }
.co-note-ico { flex-shrink: 0; width: 16px; height: 16px; margin-top: 1px; }
.co-note-ico svg { width: 16px; height: 16px; display: block; }

/* ── Form layout inside the drawer ───────────────────────────── */
.co-f { margin-bottom: 16px; }
.co-f-row { display: flex; gap: 12px; }
.co-f-row > .co-f { flex: 1; min-width: 0; }
.rl-field-hint { margin-top: 5px; }
.co-err { font-size: 11px; color: oklch(0.55 0.2 25); line-height: 1.35; margin-top: 5px; display: flex; align-items: center; gap: 4px; }
.co-err svg { width: 12px; height: 12px; flex-shrink: 0; }

/* Radio cards */
.co-cards { display: flex; gap: 10px; }
.co-card {
  flex: 1; text-align: left; font-family: inherit; cursor: pointer;
  border: 1px solid var(--border); border-radius: var(--radius-md);
  padding: 10px 12px; background: var(--card);
  transition: border-color 120ms ease, background 120ms ease, box-shadow 120ms ease;
}
.co-card:hover:not(:disabled) { border-color: color-mix(in oklab, var(--primary) 25%, var(--border)); background: color-mix(in oklab, var(--muted) 30%, var(--card)); }
.co-card.sel { border-color: var(--primary); box-shadow: 0 0 0 3px color-mix(in oklab, var(--primary) 15%, transparent); background: var(--card); }
.co-card:disabled { cursor: not-allowed; opacity: 0.7; background: color-mix(in oklab, var(--muted) 45%, var(--card)); }
.co-card-t { font-size: 14px; font-weight: 500; display: flex; align-items: center; gap: 6px; flex-wrap: wrap; }
.co-card-d { font-size: 12px; color: var(--muted-foreground); line-height: 1.5; margin-top: 4px; }

/* Segmented control — mirrors the kit's .view-switcher */
.co-seg { display: inline-flex; align-items: center; background: var(--muted); border-radius: var(--radius-md); padding: 2px; }
.co-seg button { height: 26px; padding: 0 12px; border-radius: calc(var(--radius-md) - 2px); font-size: 13px; font-weight: 500; color: var(--muted-foreground); }
.co-seg button:hover { color: var(--foreground); }
.co-seg button.active { background: var(--background); color: var(--foreground); box-shadow: var(--shadow-xs); }

/* Checkbox / switch rows */
.co-check { display: flex; align-items: flex-start; gap: 9px; padding: 9px 0; cursor: pointer; }
.co-check + .co-check, .co-sw + .co-sw, .co-check + .co-sw, .co-sw + .co-check { border-top: 1px solid var(--border); }
.co-check .sc-check { margin-top: 1px; flex-shrink: 0; }
.co-sw { display: flex; align-items: flex-start; gap: 12px; padding: 10px 0; }
.co-sw .sc-switch { flex-shrink: 0; margin-top: 1px; }
.co-ctl-t { font-size: 14px; font-weight: 500; display: flex; align-items: center; gap: 6px; flex-wrap: wrap; }
.co-ctl-d { font-size: 12px; color: var(--muted-foreground); line-height: 1.5; margin-top: 3px; }
.co-check.locked { cursor: default; }

/* Inline preview strip */
.co-prev {
  display: flex; align-items: center; gap: 10px;
  background: color-mix(in oklab, var(--muted) 40%, var(--background));
  border: 1px solid var(--border); border-radius: var(--radius-md);
  padding: 9px 11px; font-size: 12.5px; color: var(--muted-foreground);
}
.co-prev-val {
  font-family: var(--font-mono); font-size: 13px; color: var(--foreground);
  background: var(--background); border: 1px solid var(--border);
  border-radius: var(--radius-sm); padding: 2px 7px;
}

/* Type picker */
.co-tp-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 7px; }
.co-tp {
  display: flex; align-items: flex-start; gap: 9px; text-align: left; font-family: inherit;
  padding: 9px 10px; border: 1px solid var(--border); border-radius: var(--radius-md);
  background: var(--card); cursor: pointer;
  transition: border-color 120ms ease, background 120ms ease;
}
.co-tp:hover:not(:disabled) { border-color: color-mix(in oklab, var(--primary) 25%, var(--border)); background: color-mix(in oklab, var(--muted) 30%, var(--card)); }
.co-tp:disabled { cursor: not-allowed; opacity: 0.6; background: color-mix(in oklab, var(--muted) 40%, var(--card)); }
.co-tp-t { font-size: 13.5px; font-weight: 500; display: flex; align-items: center; gap: 5px; flex-wrap: wrap; }
.co-tp-d { font-size: 11.5px; color: var(--muted-foreground); line-height: 1.45; margin-top: 2px; }

/* Picklist editor */
.co-pl { display: flex; align-items: center; gap: 8px; margin-bottom: 6px; }
.co-pl-grip { color: var(--muted-foreground); font-size: 13px; width: 12px; text-align: center; flex-shrink: 0; cursor: grab; }
.co-pl-sw { width: 28px; height: 28px; border-radius: var(--radius-sm); border: 1px solid color-mix(in oklab, var(--foreground) 10%, transparent); flex-shrink: 0; cursor: pointer; }

/* Relationship map */
.co-map { display: flex; flex-direction: column; }
.co-map-row { display: flex; align-items: center; gap: 10px; padding: 7px 0; flex-wrap: wrap; }
.co-node {
  display: inline-flex; align-items: center; gap: 8px;
  border: 1px solid var(--border); border-radius: var(--radius-md);
  padding: 6px 11px; background: var(--card); font-size: 13.5px; font-weight: 500;
  box-shadow: var(--shadow-xs);
}
.co-node.me { border-color: color-mix(in oklab, var(--primary) 35%, var(--border)); background: var(--accent); }
.co-node.sys { background: color-mix(in oklab, var(--muted) 50%, var(--card)); color: var(--muted-foreground); font-weight: 400; box-shadow: none; }
.co-conn { display: inline-flex; align-items: center; gap: 7px; font-size: 11.5px; color: var(--muted-foreground); font-family: var(--font-mono); }
.co-line { width: 26px; height: 1px; background: var(--border); position: relative; }
.co-line::after { content: ''; position: absolute; right: 0; top: -3px; border-left: 5px solid var(--border); border-top: 3.5px solid transparent; border-bottom: 3.5px solid transparent; }

/* Relationship cards use the kit's SectionCard shell */
.rl-section + .rl-section { margin-top: 9px; }
.co-rel-head { display: flex; align-items: center; gap: 9px; }
.co-rel-t { flex: 1; min-width: 0; font-size: 14px; font-weight: 500; }
.co-rel-meta { font-size: 12.5px; color: var(--muted-foreground); line-height: 1.65; }
.co-rel-empty { font-size: 13.5px; color: var(--muted-foreground); padding: 14px 0; }

/* Menu — mirrors the kit's rail flyout chrome */
.co-menu {
  position: absolute; min-width: 200px; padding: 6px;
  background: var(--popover); color: var(--popover-foreground);
  border: 1px solid var(--border); border-radius: var(--radius-lg);
  box-shadow: 0 10px 32px rgba(0,0,0,0.08), 0 2px 6px rgba(0,0,0,0.04);
  z-index: 300;
}
.co-menu-i {
  display: flex; align-items: center; gap: 10px; width: 100%;
  height: 32px; padding: 0 10px; border-radius: var(--radius-md);
  font-size: 14px; text-align: left; white-space: nowrap;
}
.co-menu-i:hover:not(:disabled) { background: var(--accent); }
.co-menu-i.danger { color: oklch(0.55 0.2 25); }
.co-menu-i.danger:hover { background: var(--tag-bg-red); }
.co-menu-i:disabled { color: var(--muted-foreground); cursor: not-allowed; }
.co-menu-sep { height: 1px; background: var(--border); margin: 4px 2px; }

/* Icon button — the kit's outline icon button at a tighter 28px */
.co-icon-btn {
  width: 28px; height: 28px; border-radius: var(--radius-md);
  display: grid; place-items: center; color: var(--muted-foreground);
}
.co-icon-btn:hover { background: var(--accent); color: var(--accent-foreground); }
.co-icon-btn svg { width: 15px; height: 15px; }
.co-icon-btn.danger:hover { background: var(--tag-bg-red); color: var(--tag-fg-red); }

/* Toast */
.co-toast {
  position: fixed; bottom: 22px; left: 50%;
  transform: translateX(-50%) translateY(10px);
  background: var(--foreground); color: var(--background);
  font-size: 13.5px; padding: 10px 16px; border-radius: var(--radius-md);
  box-shadow: 0 8px 24px rgba(0,0,0,.25);
  opacity: 0; pointer-events: none; transition: opacity .16s, transform .16s;
  z-index: 500; max-width: 460px;
}
.co-toast.on { opacity: 1; transform: translateX(-50%) translateY(0); }

/* The shadcn dialog ships z-index:50, below the kit's drawer at 100. */
.sc-dialog-overlay { z-index: 400; }
.sc-dialog { max-width: 460px; }
</style>
</head>
<body>

<div class="rl-app">

  <!-- ══ Rail ══════════════════════════════════════════════════════
       The kit's collapsed rail: transparent over the tinted canvas,
       40px items, active item is a white card. Settings lives at the
       bottom and opens a flyout — there is no second sidebar in this
       product, so the settings sections are that flyout's contents. -->
  <aside class="rl-sidebar">
    <div class="rl-rail-brand"><img src="ds/assets/rocketlane-mark.svg" alt="Rocketlane"></div>

    <div class="rl-rail-group">
      <button class="rl-rail-item" data-tooltip="Search"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="M21 21l-4.3-4.3"/></svg></button>
      <button class="rl-rail-item" data-tooltip="Notifications"><span class="rl-rail-badge">5</span><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M18 8A6 6 0 006 8c0 7-3 9-3 9h18s-3-2-3-9"/><path d="M13.7 21a2 2 0 01-3.4 0"/></svg></button>
      <button class="rl-rail-item" data-tooltip="Home"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M3 10.5L12 3l9 7.5V20a1 1 0 01-1 1h-5v-6H9v6H4a1 1 0 01-1-1z"/></svg></button>
    </div>
    <div class="rl-rail-divider"></div>
    <div class="rl-rail-group">
      <button class="rl-rail-item" data-tooltip="Accounts"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 21V5a2 2 0 012-2h7a2 2 0 012 2v16"/><path d="M15 9h3a2 2 0 012 2v10"/><path d="M2 21h20"/><path d="M8 7h2M8 11h2M8 15h2"/></svg></button>
      <button class="rl-rail-item" data-tooltip="Projects"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M3 7a2 2 0 012-2h4l2 2h8a2 2 0 012 2v9a2 2 0 01-2 2H5a2 2 0 01-2-2z"/></svg></button>
      <button class="rl-rail-item" data-tooltip="Tasks"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M8.5 12.5l2.5 2.5 4.5-5"/></svg></button>
      <button class="rl-rail-item" data-tooltip="Financials"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M3 21h18M4 10h16M5 10L12 4l7 6M6 10v11M10 10v11M14 10v11M18 10v11"/></svg></button>
    </div>
    <div class="rl-rail-divider"></div>
    <div class="rl-rail-group">
      <button class="rl-rail-item" data-tooltip="Templates"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="18" height="7" rx="1.5"/><rect x="3" y="14" width="8" height="7" rx="1.5"/><rect x="15" y="14" width="6" height="7" rx="1.5"/></svg></button>
      <button class="rl-rail-item" data-tooltip="Agents"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3l1.6 4.4L18 9l-4.4 1.6L12 15l-1.6-4.4L6 9l4.4-1.6z"/><path d="M18 15l.8 2.2L21 18l-2.2.8L18 21l-.8-2.2L15 18l2.2-.8z"/></svg></button>
    </div>

    <div class="rl-rail-group bottom">
      <div class="rl-rail-item active has-flyout">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 00.33 1.82l.06.06a2 2 0 11-2.83 2.83l-.06-.06a1.65 1.65 0 00-1.82-.33 1.65 1.65 0 00-1 1.51V21a2 2 0 11-4 0v-.09A1.65 1.65 0 008 19.4a1.65 1.65 0 00-1.82.33l-.06.06a2 2 0 11-2.83-2.83l.06-.06A1.65 1.65 0 004.6 15a1.65 1.65 0 00-1.51-1H3a2 2 0 110-4h.09A1.65 1.65 0 004.6 9a1.65 1.65 0 00-.33-1.82l-.06-.06a2 2 0 112.83-2.83l.06.06A1.65 1.65 0 009 4.6V4.5a2 2 0 114 0v.09A1.65 1.65 0 0015 4.6a1.65 1.65 0 001.82.33l.06-.06a2 2 0 112.83 2.83l-.06.06A1.65 1.65 0 0019.4 9V9a2 2 0 110 4h-.09a1.65 1.65 0 00-1.51 1z"/></svg>
        <div class="rl-rail-flyout">
          <div class="rl-rail-flyout-title">Settings</div>
          <button class="rl-flyout-item"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="12" cy="8" r="4"/><path d="M4 21a8 8 0 0116 0"/></svg><span>Profile</span></button>
          <button class="rl-flyout-item"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M17 21v-2a4 4 0 00-4-4H6a4 4 0 00-4 4v2"/><circle cx="9.5" cy="7" r="4"/></svg><span>Team &amp; roles</span></button>
          <button class="rl-flyout-item"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M9 2v6M15 2v6M7 8h10v5a5 5 0 01-10 0z"/><path d="M12 18v4"/></svg><span>Integrations</span></button>

   between objects is a LOOKUP. There is no master-detail, so "the child
   cannot exist without a parent" is expressed as a required lookup, and

/* ── State ────────────────────────────────────────────────────────── */
let state = load();
let route = {view:'list', id:null, tab:'fields'};

function load(){
  try{
    const raw = localStorage.getItem(STORE_KEY);
    if(!raw) return seed();
    const s = JSON.parse(raw);
    return (s && Array.isArray(s.objects)) ? s : seed();
  }catch(e){ return seed(); }
}
function save(){ try{ localStorage.setItem(STORE_KEY, JSON.stringify(state)); }catch(e){} }
function resetData(){ state = seed(); save(); route = {view:'list', id:null, tab:'fields'}; render(); toast('Sample data restored.'); }
function clearData(){ state = {objects:[]}; save(); route = {view:'list', id:null, tab:'fields'}; render(); toast('All custom objects removed.'); }

/* ── Helpers ──────────────────────────────────────────────────────── */
const esc = s => String(s==null?'':s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const obj = id => state.objects.find(o => o.id === id);
const uid = p => p + '_' + Math.random().toString(36).slice(2,8);

/* snake_case API name. Derived from the label, then frozen: renaming the
   label later must not break reports, automations or integrations. */
function apiFromLabel(l){
  return String(l||'').toLowerCase().replace(/[^a-z0-9]+/g,'_').replace(/^_+|_+$/g,'').slice(0,40) || 'field';
}
function pluralise(l){
  const s = String(l||'').trim(); if(!s) return '';
  if(/(s|x|z|ch|sh)$/i.test(s)) return s + 'es';
  if(/[^aeiou]y$/i.test(s)) return s.slice(0,-1) + 'ies';
  return s + 's';
}
/* SO-{0000000} + 1043 → SO-0001043. The token's zeros set the minimum
   width; the number is free to grow past it. */
function autoPreview(fmt, n){
  const m = String(fmt||'').match(/\{(0+)\}/);
  if(!m) return null;
  const digits = m[1].length;
  return String(fmt).replace(m[0], String(n).padStart(digits,'0'));
}
function toast(msg){
  const t = document.getElementById('toast');
  t.textContent = msg; t.classList.add('on');
  clearTimeout(toast._t); toast._t = setTimeout(()=>t.classList.remove('on'), 2600);
}
function typeMeta(t){ return TYPES[t] || {label:t, glyph:'?', cls:'g-sys'}; }
function glyph(t, lg){ const m = typeMeta(t); return `<span class="co-glyph ${m.cls}${lg?' lg':''}">${esc(m.glyph)}</span>`; }

/* Tag helper — the kit's atom, so every pill on the page is one component. */
function tag(text, hue, size, title){
  return `<span class="rl-tag ${size||'s-sm'} c-${hue||'gray'}"${title?` title="${esc(title)}"`:''}>${text}</span>`;
}

/* Lookup targets can be another custom object or a default object. */
function targetLabel(t){
  if(t === 'ACCOUNT') return 'Account';
  if(t === 'PROJECT') return 'Project';
  const o = obj(t); return o ? o.label : t;
}
function targetPlural(t){
  if(t === 'ACCOUNT') return 'Accounts';
  if(t === 'PROJECT') return 'Projects';
  const o = obj(t); return o ? o.plural : t;
}
/* Every lookup on any object that points at `id` — i.e. the related lists
   that appear on this object, and what blocks its deletion. */
function incoming(id){
  const out = [];
  state.objects.forEach(o => o.fields.forEach(f => {
    if(f.type === 'LOOKUP' && f.settings.target === id) out.push({obj:o, field:f});
  }));
  return out;
}
/* Where a field is referenced, so a delete can say what it would break. */
function usages(o, f){
  const out = [];
  o.fields.forEach(g => {
    if(g.id === f.id) return;
    if(g.type === 'FORMULA' && g.settings.expr && g.settings.expr.includes(f.api)) out.push(`Formula field "${g.label}"`);
    if(g.type === 'ROLLUP' && g.settings.childLookup === f.id) out.push(`Roll-up field "${g.label}"`);
  });
  state.objects.forEach(p => p.fields.forEach(g => {
    if(g.type === 'ROLLUP' && g.settings.child === o.id && (g.settings.aggField === f.id || g.settings.filterField === f.id))
      out.push(`Roll-up "${g.label}" on ${p.label}`);
  }));
  return out;
}
function systemFields(o){
  const parent = o.level === 'GLOBAL' ? null
    : {label:o.level === 'ACCOUNT' ? 'Account' : 'Project', api:o.level.toLowerCase(), type:'LOOKUP',
       note:'Required lookup, created from the object’s level.'};
  const rows = [
    {label:o.recordNameLabel, api:'name', type:o.recordNameType === 'AUTONUMBER' ? 'AUTONUMBER' : 'TEXT',
     note:'Record Name. Always present and cannot be deleted.'},
  ];
  if(parent) rows.push(parent);
  rows.push(
    {label:'Record ID', api:'id', type:'TEXT', note:'System ID. Used by lookups, the API and integrations.'},
    {label:'Created by', api:'created_by', type:'USER', note:''},
    {label:'Created at', api:'created_at', type:'DATETIME', note:''},
    {label:'Updated by', api:'updated_by', type:'USER', note:''},
    {label:'Updated at', api:'updated_at', type:'DATETIME', note:''},
  );
  return rows;
}

function crumbs(parts){

    const sep = i ? '<span class="rl-crumb-sep">›</span>' : '';
    return sep + (p.go
      ? `<a class="rl-crumb link" onclick="${p.go}">${esc(p.label)}</a>`
      : `<span class="rl-crumb${i === parts.length-1 ? ' current' : ''}">${esc(p.label)}</span>`);

}

          between the account and the project, a change request inside a project, a product catalogue.
        </div>
        <button class="rl-btn v-primary sz-md" onclick="openObjectDrawer()">${ICO.plus}<span class="rl-btn-label">New custom object</span></button>
      </div>
    </div></div></div>`;
  }

  const rows = os.map(o => {
    const lv = LEVELS[o.level];
    const nLookups = o.fields.filter(f => f.type === 'LOOKUP').length;
    return `<tr class="is-clickable" onclick="go('object','${o.id}','fields')">
      <td class="col-first">
        <div class="co-name">${glyph(o.recordNameType === 'AUTONUMBER' ? 'AUTONUMBER' : 'TEXT')}
          <div style="min-width:0">
            <div style="font-weight:500">${esc(o.label)}</div>
            <div class="co-api">${esc(apiFromLabel(o.label))}</div>
          </div></div>
      </td>
      <td>${tag(lv.label, lv.hue)}${o.levelOpen ? ' ' + openChip('Product has no account or project parent. Four options are open: account-level and duplicated per account; a picklist, which cannot hold a price; an existing global list such as rate cards; or allowing global objects for reference lists only.') : ''}</td>
      <td style="color:var(--muted-foreground)">${esc(o.recordNameLabel)}
        ${o.recordNameType === 'AUTONUMBER' ? tag(`<span class="co-mono">${esc(o.autoFormat)}</span>`) : ''}</td>
      <td class="num" style="color:var(--muted-foreground)">${o.fields.length}${nLookups ? ' ' + tag(`${nLookups}&nbsp;↗`, 'purple', 's-sm', `${nLookups} lookup field${nLookups>1?'s':''}`) : ''}</td>
      <td class="num" style="color:var(--muted-foreground)">${o.records.toLocaleString()}</td>
      <td style="color:var(--muted-foreground)">${esc(o.updated)}</td>
      <td class="col-last" style="width:44px"><div class="co-row-actions">
        <button class="co-icon-btn" onclick="event.stopPropagation();objectMenu(event,'${o.id}')" aria-label="More">${ICO.dots}</button>
      </div></td>
    </tr>`;
  }).join('');

  return head + `<div class="rl-page-body"><div class="co-body"><div class="co-inner">
    <div class="rl-section" style="margin-bottom:16px">
      <div class="co-table-wrap"><table class="co-table">
        <thead><tr>
          <th class="col-first">Object</th><th>Level</th><th>Record name</th>
          <th class="num">Fields</th><th class="num">Records</th><th>Last updated</th>
          <th class="col-last"></th>
        </tr></thead>
        <tbody>${rows}</tbody>
      </table></div>
    </div>
    <div class="co-note">
      <span class="co-note-ico">${ICO.info}</span>
      <div><b>Every link between objects is a lookup.</b> Master-detail relationships are not part of
      this release, so a child that must have a parent uses a <b>required</b> lookup, and cascade delete
      is replaced by <b>block the delete</b>. Totals come from roll-up fields that ride on the lookup.</div>
    </div>
  </div></div></div>`;
}

/* ── Object detail ────────────────────────────────────────────────── */
function viewObject(){
  const o = obj(route.id);
  if(!o){ route.view = 'list'; return viewList(); }
  const lv = LEVELS[o.level];
  const tabs = [
    ['fields','Fields', o.fields.length],
    ['rel','Relationships', o.fields.filter(f=>f.type==='LOOKUP').length + incoming(o.id).length],
    ['details','Details', null],
  ];
  const later = [['Validation rules','Phase 6'],['Record types','Phase 7'],['Page layouts','Phase 8'],['Access','Phase 10'],['Automations','Phase 12']];

  const head = `
    <div class="rl-page-header">
      ${crumbs([{label:'Settings'},{label:'Custom objects', go:"go('list')"},{label:o.label}])}
      <div class="rl-title-block">
        <div class="rl-title-text">
          <h1 style="display:flex;align-items:center;gap:10px">
            ${glyph(o.recordNameType === 'AUTONUMBER' ? 'AUTONUMBER' : 'TEXT', true)}
            ${esc(o.label)}
            ${tag(lv.label + ' level', lv.hue, 's-md')}
            ${o.levelOpen ? openChip('Product has no account or project parent — where a global reference list lives is still open.') : ''}
          </h1>
          <p class="rl-page-desc">${esc(o.description) || 'No description'}</p>
        </div>
        <div class="rl-title-actions">
          <button class="rl-btn v-outline sz-md is-icon" onclick="objectMenu(event,'${o.id}')" aria-label="More">${ICO.dots}</button>
          <button class="rl-btn v-outline sz-md" onclick="openObjectDrawer('${o.id}')"><span class="rl-btn-label">Edit object</span></button>
          ${route.tab === 'fields' ? `<button class="rl-btn v-primary sz-md" onclick="openFieldDrawer('${o.id}')">${ICO.plus}<span class="rl-btn-label">Add field</span></button>` : ''}
        </div>
      </div>
      <div class="rl-tabs">
        ${tabs.map(([k,t,n]) => `<button class="rl-tab${route.tab===k?' active':''}" onclick="go('object','${o.id}','${k}')">${t}${n!==null?` ${tag(String(n))}`:''}</button>`).join('')}
        ${later.map(([t,p]) => `<button class="rl-tab" disabled style="opacity:.45;cursor:not-allowed" title="${p} — not in this prototype yet">${t}</button>`).join('')}
      </div>
    </div>`;

  const body = route.tab === 'fields' ? tabFields(o) : route.tab === 'rel' ? tabRel(o) : tabDetails(o);
  return head + `<div class="rl-page-body"><div class="co-body"><div class="co-inner">${body}</div></div></div>`;
}

/* ── Tab: fields ──────────────────────────────────────────────────── */

    <tr><td class="col-first" colspan="5" style="color:var(--muted-foreground);padding:22px 24px">
      No fields yet. Every object starts with its Record Name, its parent and the system fields below.
    </td></tr>`;

  const sys = systemFields(o).map(f => `
    <tr>
      <td class="col-first">
        <div class="co-name">${glyph(f.type)}

            <div class="co-api">${esc(f.api)}</div>
          </div></div>
      </td>
      <td style="color:var(--muted-foreground)">${esc(typeMeta(f.type).label)}</td>

  return `

    <div class="rl-section">
      <div class="co-table-wrap"><table class="co-table">

function fieldRow(o, f){
  const m = typeMeta(f.type);
  const bits = [];
  if(f.required) bits.push(tag('Required'));
  if(f.unique) bits.push(tag('Unique'));
  if(f.extId) bits.push(tag('External ID'));
  if(f.showInReports === false) bits.push(tag('Not in reports', 'gray', 's-sm', 'Hidden from the report builder. Clutter control, not security.'));
  if(f.type === 'LOOKUP'){
    bits.push(tag('→ ' + esc(targetLabel(f.settings.target)), 'purple'));
    bits.push(f.settings.onDelete === 'BLOCK'
      ? tag('Block delete', 'orange', 's-sm', 'The linked record cannot be deleted while records point at it.')
      : tag('Clear on delete', 'gray', 's-sm', 'Deleting the linked record clears this value.'));
  }
  if(f.type === 'ROLLUP'){
    const c = obj(f.settings.child);
    bits.push(tag(esc(f.settings.fn) + (f.settings.fn !== 'COUNT' && f.settings.aggField ? ' ' + esc(fieldLabel(f.settings.child, f.settings.aggField)) : ''), 'pink'));
    bits.push(tag('of ' + esc(c ? c.plural : f.settings.child)));
    bits.push(tag('Read-only', 'gray', 's-sm', 'Roll-up fields cannot be edited by users.'));
  }
  if(f.type === 'FORMULA'){
    const e = String(f.settings.expr || '');
    bits.push(tag(`<span class="co-mono">${esc(e.slice(0,24))}${e.length>24?'…':''}</span>`, 'pink', 's-sm', e));
    bits.push(tag('Read-only'));
  }
  if(f.type === 'SELECT' || f.type === 'MULTISELECT') bits.push(tag(`${(f.settings.options||[]).length} values`));
  if(f.def) bits.push(tag('Default ' + esc(f.def)));

  return `<tr class="is-clickable" onclick="openFieldDrawer('${o.id}','${f.id}')">
    <td class="col-first">
      <div class="co-name">${glyph(f.type)}
        <div style="min-width:0">
          <div style="font-weight:500">${esc(f.label)}</div>
          <div class="co-api">${esc(f.api)}</div>
        </div></div>
    </td>
    <td style="color:var(--muted-foreground)">${esc(m.label)}${m.isNew ? ' ' + tag('New', 'purple') : ''}</td>
    <td><div style="display:flex;gap:4px;flex-wrap:wrap;max-width:300px">${bits.join('')}</div></td>
    <td style="color:var(--muted-foreground);font-size:12.5px;max-width:230px;white-space:normal">${esc(f.description||'')}</td>
    <td class="col-last" style="width:44px"><div class="co-row-actions">
      <button class="co-icon-btn" onclick="event.stopPropagation();openFieldDrawer('${o.id}','${f.id}')" aria-label="Edit">${ICO.pencil}</button>
      <button class="co-icon-btn danger" onclick="event.stopPropagation();confirmDeleteField('${o.id}','${f.id}')" aria-label="Delete">${ICO.trash}</button>
    </div></td>
  </tr>`;
}
function fieldLabel(objId, fieldId){
  const o = obj(objId); if(!o) return fieldId;
  const f = o.fields.find(x => x.id === fieldId);
  return f ? f.label : fieldId;
}

/* ── Tab: relationships ───────────────────────────────────────────── */
function tabRel(o){
  const out = o.fields.filter(f => f.type === 'LOOKUP');
  const inc = incoming(o.id);
  const rollups = o.fields.filter(f => f.type === 'ROLLUP');

  const relCard = (glyphType, title, action, meta) => `
    <div class="rl-section is-open">
      <div class="rl-section-header" style="cursor:default">
        <div class="co-rel-head" style="flex:1">
          ${glyph(glyphType)}<span class="co-rel-t">${title}</span>
        </div>
        ${action}
      </div>
      <div class="rl-section-body rl-section-body-padded">
        <div class="co-rel-meta">${meta}</div>
      </div>
    </div>`;

  const map = `
    <div class="rl-section is-open">
      <div class="rl-section-header" style="cursor:default">
        <span class="rl-section-title">How ${esc(o.label)} sits in the model</span>
      </div>
      <div class="rl-section-body rl-section-body-padded">
        <div style="font-size:12.5px;color:var(--muted-foreground);margin-bottom:6px">Arrows are lookups, and each one stores the target's system ID.</div>
        <div class="co-map">
          ${o.level !== 'GLOBAL' ? `<div class="co-map-row">
            <span class="co-node sys">${LEVELS[o.level].label}</span>
            <span class="co-conn"><span class="co-line"></span>parent · required</span>
            <span class="co-node me">${esc(o.label)}</span>
          </div>` : `<div class="co-map-row">
            <span class="co-node me">${esc(o.label)}</span>
            <span class="co-conn">no parent — </span>${openChip('Where a global reference list lives is still open.')}
          </div>`}
          ${out.map(f => `<div class="co-map-row">
            <span class="co-node me">${esc(o.label)}</span>
            <span class="co-conn"><span class="co-line"></span>${esc(f.label)}${f.required?' · required':''}</span>
            <span class="co-node">${esc(targetLabel(f.settings.target))}</span>
          </div>`).join('')}
          ${inc.map(({obj:p, field:f}) => `<div class="co-map-row">
            <span class="co-node">${esc(p.label)}</span>
            <span class="co-conn"><span class="co-line"></span>${esc(f.label)}${f.required?' · required':''}</span>
            <span class="co-node me">${esc(o.label)}</span>
          </div>`).join('')}
        </div>
      </div>
    </div>`;

  const outHtml = out.length ? out.map(f => relCard('LOOKUP',
    `${esc(f.label)} <span style="color:var(--muted-foreground)">→</span> ${esc(targetLabel(f.settings.target))}`,
    `<button class="rl-btn v-outline sz-sm" onclick="openFieldDrawer('${o.id}','${f.id}')"><span class="rl-btn-label">Edit</span></button>`,
    `${f.required ? '<b>Required</b> — a record cannot save without one.' : 'Optional — the value can be empty.'}<br>
     On the ${esc(targetLabel(f.settings.target))} record this appears as the related list
     <b>${esc(f.settings.relatedListLabel)}</b>.<br>
     If the ${esc(targetLabel(f.settings.target))} is deleted:
     <b>${f.settings.onDelete === 'BLOCK' ? 'the delete is blocked while ' + esc(o.plural.toLowerCase()) + ' point at it' : 'this value is cleared'}</b>.
     ${(f.settings.pickerFields||[]).length ? `<br>Picker shows: ${(f.settings.pickerFields||[]).map(x => tag(esc(x))).join(' ')}` : ''}`
  )).join('') : `<div class="co-rel-empty">${esc(o.label)} does not point at any other object yet.</div>`;

  const incHtml = inc.length ? inc.map(({obj:p, field:f}) => relCard('LOOKUP',
    `${esc(f.settings.relatedListLabel)} <span style="color:var(--muted-foreground)">·</span> ${esc(p.label)} records`,
    `<button class="rl-btn v-outline sz-sm" onclick="go('object','${p.id}','fields')"><span class="rl-btn-label">Open ${esc(p.label)}</span></button>`,
    `Shown on every ${esc(o.label)} record, listing the ${esc(p.plural.toLowerCase())} whose
     <b>${esc(f.label)}</b> points here. “Add new” creates one with the lookup already set.<br>
     ${f.settings.onDelete === 'BLOCK'
       ? `<b>Blocks deletion</b> — a ${esc(o.label)} with ${esc(p.plural.toLowerCase())} cannot be deleted.`
       : `Deleting a ${esc(o.label)} clears <b>${esc(f.label)}</b> on its ${esc(p.plural.toLowerCase())}.`}`
  )).join('') : `<div class="co-rel-empty">No other object points at ${esc(o.label)} yet.</div>`;

  const rollHtml = rollups.length ? rollups.map(f => {
    const c = obj(f.settings.child);
    return relCard('ROLLUP', esc(f.label),
      `<button class="rl-btn v-outline sz-sm" onclick="openFieldDrawer('${o.id}','${f.id}')"><span class="rl-btn-label">Edit</span></button>`,
      `<b>${esc(f.settings.fn)}</b>${f.settings.fn !== 'COUNT' ? ' of <b>' + esc(fieldLabel(f.settings.child, f.settings.aggField)) + '</b>' : ''}
       across ${esc(c ? c.plural : f.settings.child)} linked through
       <b>${esc(c ? fieldLabel(c.id, f.settings.childLookup) : f.settings.childLookup)}</b>.
       ${f.settings.filterField ? `<br>Only where <b>${esc(fieldLabel(f.settings.child, f.settings.filterField))}</b> ${f.settings.filterOp === 'neq' ? 'is not' : 'is'} <b>${esc(f.settings.filterValue)}</b>.` : ''}
       <br>Recalculates when a child is created, changed or deleted — and on both sides when a child
       is moved to another ${esc(o.label)}.`);
  }).join('') : `<div class="co-rel-empty">No roll-ups on ${esc(o.label)} yet.</div>`;

  return map + `
    <div class="co-sec" style="margin-top:20px"><span class="co-sec-t">Points at (lookups on ${esc(o.label)})</span><span class="co-sec-line"></span></div>
    ${outHtml}
    <div class="co-sec"><span class="co-sec-t">Referenced by (related lists on ${esc(o.label)})</span><span class="co-sec-line"></span></div>
    ${incHtml}
    <div class="co-sec"><span class="co-sec-t">Roll-ups</span><span class="co-sec-line"></span>${openChip('A native roll-up on lookups is the recommendation, not a decision. The alternatives were automation-built totals, or totals that live only in reports.')}</div>
    ${rollHtml}
    <div class="co-note warn" style="margin-top:18px">
      <span class="co-note-ico">${ICO.warn}</span>
      <div><b>Reparenting is the case to watch.</b> Move a line to another order and both orders have to
      be recalculated — the old one without it, the new one with it. If the old parent keeps its number,
      the same amount is counted twice across two records, and every report and validation rule that
      reads the total is wrong.</div>
    </div>`;
}

    <div class="rl-section"><div class="co-table-wrap"><table class="co-table"><tbody>

      ${row('Description', esc(o.description) || '<span style="color:var(--muted-foreground)">—</span>')}
      ${row('Record Name', esc(o.recordNameLabel), 'The human label for a record, shown in lists, lookups, search and notifications. It is not the unique identifier — the system ID is.')}
      ${row('Record Name type', typeMeta(o.recordNameType === 'AUTONUMBER' ? 'AUTONUMBER' : 'TEXT').label,

    <div class="co-sec"><span class="co-sec-t">Behaviour</span><span class="co-sec-line"></span></div>
    <div class="rl-section"><div class="co-table-wrap"><table class="co-table"><tbody>
      ${row('Reports', tag('Always on', 'green'), 'The object and its fields are available in the report builder. An object with no reports has little value, so there is no switch.')}
      ${row('Field history', o.fieldHistory ? tag('On', 'green') : tag('Off'), 'Every field change — old value, new value, who and when — is written to the global audit log.')}
      ${row('Search', tag('Always on', 'green'), 'Records are found in global search by Record Name. Searching other text fields comes later.')}
    </tbody></table></div></div>

    <div class="co-sec"><span class="co-sec-t">Danger zone</span><span class="co-sec-line"></span></div>
    <div class="rl-section is-open">
      <div class="rl-section-header" style="cursor:default">
        <div style="flex:1">
          <div class="rl-section-title">Delete ${esc(o.label)}</div>
        </div>
        <button class="rl-btn v-danger sz-sm" onclick="confirmDeleteObject('${o.id}')"><span class="rl-btn-label">Delete</span></button>
      </div>
      <div class="rl-section-body rl-section-body-padded">
        <div style="font-size:12.5px;color:var(--muted-foreground);line-height:1.55">
          Removes the object, its ${o.records.toLocaleString()} records and every field on it.
          ${incoming(o.id).length ? `Blocked while ${incoming(o.id).map(x=>esc(x.obj.label)).join(' and ')} point at it.` : ''}
        </div>
      </div>
