/* ══ Drawer plumbing — the kit's right-side sheet ═══════════════════ */
let drawerKey = null;

function showDrawer(inner, width, key){
  const host = document.getElementById('drawer-host');
  const panel = host.querySelector('.rl-drawer-panel');
  /* Re-rendering the same drawer swaps only the panel's contents: the
     entrance animation stays a first-open event, and the reader keeps
     their scroll position instead of being thrown back to the top by a
     segmented control half way down the form. */
  if(key && key === drawerKey && panel){
    const prevTop = (host.querySelector('.rl-drawer-body') || {}).scrollTop || 0;
    panel.style.width = (width || 560) + 'px';
    panel.innerHTML = inner;
    const b = host.querySelector('.rl-drawer-body');
    if(b) b.scrollTop = prevTop;
    return;
  }
  drawerKey = key || null;
  host.innerHTML = `
    <div class="rl-drawer-root side-right" role="dialog" aria-modal="true">
      <div class="rl-drawer-scrim" onclick="closeDrawer()"></div>
      <div class="rl-drawer-panel" style="width:${width || 560}px">${inner}</div>
    </div>`;
}
function closeDrawer(){
  document.getElementById('drawer-host').innerHTML = '';
  od = null; fd = null; drawerKey = null;
}
document.addEventListener('keydown', e => { if(e.key === 'Escape'){ closeMenu(); closeDrawer(); } });

function drawerHead(title, desc, backFn){
  return `<div class="rl-drawer-header">
    ${backFn ? `<button class="rl-drawer-close" onclick="${backFn}" aria-label="Back" style="margin-left:-4px">${ICO.back}</button>` : ''}
    <div class="rl-drawer-titles">
      <h2 class="rl-drawer-title">${title}</h2>
      <p class="rl-drawer-description">${desc}</p>
    </div>
    <button class="rl-drawer-close" onclick="closeDrawer()" aria-label="Close">${ICO.x}</button>
  </div>`;
}
function drawerFoot(note, confirmLabel, onConfirm){
  return `<div class="rl-drawer-footer">
    <span class="rl-drawer-footer-spacer" style="font-size:11.5px;color:var(--muted-foreground);line-height:1.4;max-width:260px">${note}</span>
    <button class="rl-btn v-outline sz-md" onclick="closeDrawer()"><span class="rl-btn-label">Cancel</span></button>
    <button class="rl-btn v-primary sz-md" onclick="${onConfirm}"><span class="rl-btn-label">${confirmLabel}</span></button>
  </div>`;
}
/* Label + control + hint, using the kit's Field atom. */
function field(label, required, control, hint, err){
  return `<div class="co-f"><div class="rl-field">
    <label class="rl-field-label">${label}${required?' <span class="rl-field-required">*</span>':''}</label>
    ${control}
    ${hint ? `<div class="rl-field-hint">${hint}</div>` : ''}
    ${err || ''}
  </div></div>`;
}
function fErr(key, store){
  return store[key] ? `<div class="co-err">${ICO.warn} ${esc(store[key])}</div>` : '';
}
function secLabel(t, extra){
  return `<div class="co-sec"><span class="co-sec-t">${t}</span><span class="co-sec-line"></span>${extra||''}</div>`;
}

/* ══ Object drawer — Phase 1 ════════════════════════════════════════ */
let od = null;

function openObjectDrawer(id){
  const o = id ? obj(id) : null;
  od = {
    id: id || null, err: {},
    touchedPlural: !!o, touchedRecName: !!o,
    d: o ? JSON.parse(JSON.stringify({
        label:o.label, plural:o.plural, level:o.level, description:o.description,
        recordNameLabel:o.recordNameLabel, recordNameType:o.recordNameType,
        autoFormat:o.autoFormat, autoStart:o.autoStart, fieldHistory:o.fieldHistory,
      }))
      : {label:'', plural:'', level:'ACCOUNT', description:'', recordNameLabel:'',
         recordNameType:'TEXT', autoFormat:'', autoStart:1, fieldHistory:true},
  };
  odRender();
}

function odRender(){
  const editing = !!od.id;
  const o = editing ? obj(od.id) : null;
  const d = od.d;
  const hasRecords = editing && o.records > 0;
  const recNamePlaceholder = d.label ? `${d.label} Name` : 'Sales Order Name';

  const levelCard = (key, title, desc) => `
    <button class="co-card${d.level===key?' sel':''}" type="button" onclick="odLevel('${key}')">
      <div class="co-card-t">${title}</div>
      <div class="co-card-d">${desc}</div>
    </button>`;

  showDrawer(
    drawerHead(
      editing ? 'Edit ' + esc(o.label) : 'New custom object',
      editing ? 'The level and, once records exist, the Record Name type are fixed — everything else can change.'
              : 'Define the object itself. Fields and relationships come next, on the object’s own page.'
    ) + `
    <div class="rl-drawer-body">
      ${field('Label', true,
        `<input class="co-input" id="od-label" value="${esc(d.label)}" placeholder="Sales Order" oninput="odSet('label', this.value)">`,
        'What users see in navigation, page titles, lookups, reports and automations. Must be unique across every object, including the ones Rocketlane ships with.',
        fErr('label', od.err))}

      ${field('Plural label', true,
        `<input class="co-input" id="od-plural" value="${esc(d.plural)}" placeholder="${esc(pluralise(d.label)||'Sales Orders')}" oninput="odSet('plural', this.value); od.touchedPlural = true">`,
        'Used for list views and as the default title of the related list this object creates on whatever points at it.')}

      <div class="co-f"><div class="rl-field">
        <label class="rl-field-label">Level <span class="rl-field-required">*</span>
          ${editing ? tag('Fixed after save', 'gray', 's-sm', 'Records depend on the level') : ''}</label>
        ${editing ? `
          <div class="co-prev">${tag(LEVELS[d.level].label, LEVELS[d.level].hue, 's-md')}
            <span>Records depend on the level, so it cannot be changed. Create a new object to move levels.</span></div>
        ` : `
          <div class="co-cards">
            ${levelCard('ACCOUNT','Account','Lives on the account and can outlive any one project. Commercial data: orders, contracts, assets.')}
            ${levelCard('PROJECT','Project','Lives inside the project and ends with it. Delivery data: change requests, risks, environments.')}
          </div>
          <button class="co-card" style="margin-top:8px;width:100%" disabled type="button">
            <div class="co-card-t">Global ${openChip('A product catalogue has no account or project parent. Options: account-level and duplicated per account; a picklist, which cannot hold a price; an existing global list such as rate cards; or allowing global objects for reference lists only.')}</div>
            <div class="co-card-d">A reference list with no parent, such as a product catalogue. Not decided — the seeded Product object uses it so the question stays visible.</div>
          </button>
          <div class="rl-field-hint">This cannot be changed later.</div>
        `}
      </div></div>

      ${field('Description', false,
        `<textarea class="co-input" rows="2" placeholder="Holds sales orders from Salesforce. One order can create one or more projects." oninput="odSet('description', this.value)">${esc(d.description)}</textarea>`,
        'A note for other admins. Users never see it.')}

      ${secLabel('Record name')}
      <div class="co-note">
        <span class="co-note-ico">${ICO.info}</span>
        <div>The Record Name is how people recognise a record — in lists, lookups, search and
        notifications. It is <b>not</b> the identifier: every record also gets a system ID, and that is
        what lookups, the API and integrations store.</div>
      </div>

      ${field('Record Name label', true,
        `<input class="co-input" id="od-recname" value="${esc(d.recordNameLabel)}" placeholder="${esc(recNamePlaceholder)}" oninput="odSet('recordNameLabel', this.value); od.touchedRecName = true">`,
        'Example: “Order Number”. The field is always present and cannot be deleted.',
        fErr('recordNameLabel', od.err))}

      <div class="co-f"><div class="rl-field">
        <label class="rl-field-label">Record Name type <span class="rl-field-required">*</span>
          ${hasRecords ? tag(o.records.toLocaleString() + ' records exist', 'gray', 's-sm') : ''}</label>
        ${hasRecords ? `
          <div class="co-prev"><span class="co-prev-val">${esc(typeMeta(d.recordNameType==='AUTONUMBER'?'AUTONUMBER':'TEXT').label)}</span>
            <span>Changing this once records exist would renumber or blank every one of them.</span></div>
        ` : `
          <div class="co-seg">
            <button class="${d.recordNameType==='TEXT'?'active':''}" onclick="odNameType('TEXT')" type="button">Text</button>
            <button class="${d.recordNameType==='AUTONUMBER'?'active':''}" onclick="odNameType('AUTONUMBER')" type="button">Auto Number</button>
          </div>
          <div class="rl-field-hint">${d.recordNameType === 'TEXT'
            ? 'The user types a name — up to 80 characters, and not necessarily unique. Good when records have a natural name: “H&amp;M Europe Q3 Rollout”.'
            : 'Rocketlane numbers each record. Good when there is no natural name: “LI-000231”.'}</div>
        `}
      </div></div>

      ${d.recordNameType === 'AUTONUMBER' ? `
        <div class="co-f-row">
          ${field('Format', true,
            `<input class="co-input co-mono" value="${esc(d.autoFormat)}" placeholder="SO-{0000000}" oninput="odSet('autoFormat', this.value); odPreview()">`,
            'Prefix plus a number token. The zeros set the minimum width; the number grows past it when it has to.',
            fErr('autoFormat', od.err))}
          <div class="co-f" style="max-width:150px"><div class="rl-field">
            <label class="rl-field-label">Starting number</label>
            <input class="co-input co-mono" type="number" min="1" value="${esc(d.autoStart)}"
                   oninput="odSet('autoStart', parseInt(this.value||'1',10)); odPreview()">
            <div class="rl-field-hint">${editing ? 'Can only move up.' : 'Start at 10000 to carry on from an older system.'}</div>
            ${fErr('autoStart', od.err)}
          </div></div>
        </div>
        <div class="co-prev" style="margin-bottom:16px">
          <span>First record</span><span class="co-prev-val" id="od-preview">${esc(autoPreview(d.autoFormat, d.autoStart) || '—')}</span>
          <span style="margin-left:auto">Gaps are allowed — a deleted record’s number is never reused.</span>
        </div>
      ` : ''}

      ${secLabel('Behaviour')}
      <div class="co-sw">
        <button class="sc-switch sc-switch--on" disabled style="opacity:.55;cursor:default"><span class="sc-switch-thumb"></span></button>
        <div style="flex:1">
          <div class="co-ctl-t">Reports ${tag('Always on', 'green')}</div>
          <div class="co-ctl-d">The object and its fields show up in the report builder. An object you cannot
            report on has little value, so there is no switch to turn off.</div>
        </div>
      </div>
      <div class="co-sw">
        <button class="sc-switch${d.fieldHistory?' sc-switch--on':''}" onclick="odSet('fieldHistory', !od.d.fieldHistory); odRender()"
                role="switch" aria-checked="${d.fieldHistory}"><span class="sc-switch-thumb"></span></button>
        <div style="flex:1">
          <div class="co-ctl-t">Field history</div>
          <div class="co-ctl-d">Record every field change — old value, new value, who and when — in the global
            audit log. ${openChip('Track every field, or only the ones an admin selects? All fields is simpler for customers but costs storage; Salesforce tracks a selected subset with a per-object limit.')}</div>
        </div>
      </div>
      <div class="co-sw">
        <button class="sc-switch sc-switch--on" disabled style="opacity:.55;cursor:default"><span class="sc-switch-thumb"></span></button>
        <div style="flex:1">
          <div class="co-ctl-t">Search ${tag('Always on', 'green')}</div>
          <div class="co-ctl-d">Records are found in global search by Record Name. Searching other text fields comes later.</div>
        </div>
      </div>

      ${editing ? '' : `
        ${secLabel('What Rocketlane creates on save')}
        <div class="rl-section"><div class="rl-section-body rl-section-body-padded">
          <div style="font-size:13px;color:var(--muted-foreground);line-height:1.9">
            <b style="color:var(--foreground)">System ID</b> on every record, hidden from users and used by lookups and the API<br>
            <b style="color:var(--foreground)">${esc(d.recordNameLabel || recNamePlaceholder)}</b> as the Record Name field<br>
            <b style="color:var(--foreground)">${LEVELS[d.level].label}</b> — a required lookup to the parent<br>
            <b style="color:var(--foreground)">Created by / at, Updated by / at</b><br>
            A default <b style="color:var(--foreground)">detail view</b> and <b style="color:var(--foreground)">list view</b><br>
            A navigation entry, visible to <b style="color:var(--foreground)">admins only</b> until access is set
          </div>
        </div></div>
      `}
    </div>` +
    drawerFoot(
      editing ? 'Renaming is safe — the API name does not change.' : 'You can add fields straight after saving.',
      editing ? 'Save changes' : 'Create object', 'odSave()'),
    560, 'obj:' + (od.id || 'new'));

  const el = document.getElementById('od-label');
  if(el && !od.id && !od.focused){ od.focused = true; setTimeout(()=>el.focus(), 60); }
}

/* ══ Field drawer — Phases 3 and 4 ══════════════════════════════════ */
let fd = null;

/* ── Step 1: pick the data type ───────────────────────────────────── */
function fdRenderType(){
  const o = obj(fd.objId);
  const q = (fd.q||'').toLowerCase();
  const groups = TYPE_GROUPS.map(g => {
    const items = Object.entries(TYPES)
      .filter(([k,t]) => t.group === g.key)
      .filter(([k,t]) => !q || t.label.toLowerCase().includes(q) || t.desc.toLowerCase().includes(q));
    if(!items.length) return '';
    const later = g.key === 'later';
    return `<div style="margin-bottom:18px">
      ${secLabel(g.title)}
      <div class="co-tp-grid">
        ${items.map(([k,t]) => `
          <button class="co-tp" type="button" ${later?'disabled title="Not in release 1"':`onclick="fdPickType('${k}')"`}>
            ${glyph(k)}
            <div style="min-width:0">
              <div class="co-tp-t">${esc(t.label)}
                ${t.isNew?tag('New','purple'):''}
                ${t.proposal?openChip('A native roll-up field on lookups is the recommendation. The alternatives were automation-built totals, or totals that live only in reports.'):''}
                ${later?tag('Later'):''}</div>
              <div class="co-tp-d">${esc(t.desc)}</div>
            </div>
          </button>`).join('')}
      </div>
    </div>`;
  }).join('');

  showDrawer(
    drawerHead(`Add a field to ${esc(o.label)}`, 'Start with the data type — it cannot be changed after the field is saved.') + `
    <div class="rl-drawer-body">
      <input class="co-input" placeholder="Search data types" value="${esc(fd.q)}" style="margin-bottom:16px"
             oninput="fd.q = this.value; fdRenderType()">
      ${groups || '<div class="co-rel-empty">No data type matches that.</div>'}
    </div>`,
    680, 'field:type');
}

/* ── Step 2: the field form ───────────────────────────────────────── */
function fdRenderForm(){
  const o = obj(fd.objId);
  const d = fd.d;
  const m = typeMeta(d.type);
  const editing = !!fd.fieldId;
  const canUnique = !!m.unique;
  const calculated = d.type === 'FORMULA' || d.type === 'ROLLUP';

  showDrawer(
    drawerHead(
      editing ? 'Edit field' : 'New ' + esc(m.label.toLowerCase()) + ' field',
      `On ${esc(o.label)} · ${esc(m.label)}${editing ? ' · the data type cannot change' : ''}`,
      editing ? null : "fd.step='type';fdRender()"
    ) + `
    <div class="rl-drawer-body">
      <div class="co-prev" style="margin-bottom:16px">
        ${glyph(d.type, true)}
        <div style="flex:1;min-width:0">
          <div style="font-size:13.5px;font-weight:600;color:var(--foreground)">${esc(m.label)}</div>
          <div style="font-size:12px;margin-top:2px">${esc(m.desc)}</div>
        </div>
        ${editing ? tag('Fixed', 'gray', 's-sm', 'A field’s data type cannot change after save. Create a new field and move the data.')
                  : `<button class="rl-btn v-outline sz-sm" onclick="fd.step='type';fdRender()"><span class="rl-btn-label">Change</span></button>`}
      </div>

      ${field('Label', true,
        `<input class="co-input" id="fd-label" value="${esc(d.label)}" placeholder="Order Date" oninput="fdSetLabel(this.value)">`,
        '', fErr('label', fd.err))}

      ${field('API name', false,
        `<input class="co-input co-mono" id="fd-api" value="${esc(d.api)}" placeholder="order_date" oninput="fd.d.api = this.value; fd.touchedApi = true" ${editing?'disabled':''}>`,
        editing ? 'Frozen after save. Renaming the label is safe precisely because reports, automations and integrations hold on to this.'
                : 'Derived from the label. Reports, automations and the API use it, so it never changes again once saved.')}

      <div class="co-f-row">
        ${field('Description', false, `<input class="co-input" value="${esc(d.description)}" placeholder="A note for admins" oninput="fd.d.description = this.value">`)}
        ${field('Help text', false, `<input class="co-input" value="${esc(d.help)}" placeholder="Shown to users on an info icon" oninput="fd.d.help = this.value">`)}
      </div>

      ${fdTypeSettings(o, d)}

      ${secLabel('Behaviour')}
      ${calculated ? `
        <div class="co-note">
          <span class="co-note-ico">${ICO.info}</span>
          <div>${d.type === 'ROLLUP'
            ? 'Roll-ups are read-only and always recalculated, so they cannot be required and cannot carry a default.'
            : 'Formula fields are read-only and derived on read, so they cannot be required and cannot carry a default.'}</div>
        </div>
      ` : `
        <div class="co-check" onclick="fd.d.required = !fd.d.required; fdRender()">
          <span class="sc-check${d.required?' sc-check--on':''}">${d.required?ICO.check:''}</span>
          <div><div class="co-ctl-t">Required</div>
            <div class="co-ctl-d">The record cannot save without a value — on the form, on import, through the
              API and on sync alike.${editing?' Records that already have no value stay as they are until someone next edits them.':''}</div></div>
        </div>
        ${canUnique ? `
          <div class="co-check" onclick="fd.d.unique = !fd.d.unique; fdRender()">
            <span class="sc-check${d.unique?' sc-check--on':''}">${d.unique?ICO.check:''}</span>
            <div><div class="co-ctl-t">Unique</div>
              <div class="co-ctl-d">No two records can hold the same value. This is a field setting rather than a
                validation rule, because it has to look across every record, not just the one being saved.</div></div>
          </div>
          <div class="co-check" onclick="fd.d.extId = !fd.d.extId; fdRender()">
            <span class="sc-check${d.extId?' sc-check--on':''}">${d.extId?ICO.check:''}</span>
            <div><div class="co-ctl-t">External ID</div>
              <div class="co-ctl-d">Marks this as an identifier from another system, so imports and sync can find
                and update the right record. It is indexed, but it does not block duplicates on its own —
                tick Unique as well for a sync key.</div></div>
          </div>
        ` : `
          <div class="co-check locked">
            <span class="sc-check" style="opacity:.4"></span>
            <div><div class="co-ctl-t" style="color:var(--muted-foreground)">Unique and External ID</div>
              <div class="co-ctl-d">Available on Text and Number only${editing?'':' — and on Email, when that type arrives'}.</div></div>
          </div>
        `}
        ${fdDefaultValue(d)}
      `}
      <div class="co-sw" style="border-top:1px solid var(--border)">
        <button class="sc-switch${d.showInReports!==false?' sc-switch--on':''}"
                onclick="fd.d.showInReports = fd.d.showInReports === false; fdRender()"
                role="switch" aria-checked="${d.showInReports!==false}"><span class="sc-switch-thumb"></span></button>
        <div style="flex:1">
          <div class="co-ctl-t">Show in reports</div>
          <div class="co-ctl-d">Keeps the report builder uncluttered — turn it off for sync keys and fields only
            formulas use. It is <b>not</b> security: hiding sensitive data is an access rule.</div>
        </div>
      </div>
    </div>` +
    drawerFoot(
      editing ? 'Changes apply to new and existing records.' : 'The field is live in records, list views, reports, automations and the API as soon as you save.',
      editing ? 'Save field' : 'Create field', 'fdSave()'),
    560, 'field:' + (fd.fieldId || 'new'));

  const el = document.getElementById('fd-label');
  if(el && !editing && !fd.focused){ fd.focused = true; setTimeout(()=>el.focus(), 60); }
}

/* Default value, for the types where a generic control makes sense.
   Date, checkbox and user carry theirs in the type-specific block. */
function fdDefaultValue(d){
  const t = d.type;
  if(['DATE','CHECKBOX','USER','LOOKUP','MULTISELECT'].includes(t)) return '';
  let control;
  if(t === 'SELECT'){
    const opts = (d.settings.options||[]).filter(o => o.label);
    control = `<select class="co-input" onchange="fd.d.def = this.value">
      <option value="">No default</option>
      ${opts.map(o => `<option ${d.def===o.label?'selected':''}>${esc(o.label)}</option>`).join('')}
    </select>`;
  }else if(NUMERIC.includes(t)){
    control = `<input class="co-input" type="number" value="${esc(d.def)}" placeholder="No default" oninput="fd.d.def = this.value">`;
  }else{
    control = `<input class="co-input" value="${esc(d.def)}" placeholder="No default" oninput="fd.d.def = this.value">`;
  }
  return `<div style="padding-top:14px;border-top:1px solid var(--border);margin-top:4px">
    ${field('Default value', false, control, 'Applied to new records only. Existing records are left alone.')}
  </div>`;
}

/* ── Type-specific settings ───────────────────────────────────────── */
function fdTypeSettings(o, d){
  const s = d.settings;
  const dec = (max, hint) => `<div class="co-f" style="max-width:190px"><div class="rl-field">
      <label class="rl-field-label">Decimal places</label>
      <select class="co-input" onchange="fd.d.settings.decimals = parseInt(this.value,10)">
        ${Array.from({length:max+1},(_,i)=>`<option value="${i}" ${s.decimals===i?'selected':''}>${i}</option>`).join('')}
      </select>
      ${hint ? `<div class="rl-field-hint">${hint}</div>` : ''}
    </div></div>`;

  switch(d.type){
    case 'TEXT': return secLabel('Text settings') + `<div class="co-f" style="max-width:190px">${field('Maximum length', false,
      `<input class="co-input" type="number" min="1" max="255" value="${esc(s.maxLength)}" oninput="fd.d.settings.maxLength = parseInt(this.value||'255',10)">`,
      'Up to 255 characters.')}</div>`;

    case 'MULTILINE': return secLabel('Text settings') + `<div class="co-f" style="max-width:190px">${field('Maximum length', false,
      `<input class="co-input" type="number" min="1" max="32000" value="${esc(s.maxLength)}" oninput="fd.d.settings.maxLength = parseInt(this.value||'32000',10)">`,
      'Up to 32,000 characters. Reports can show it as a column but cannot filter or group on it.')}</div>`;

    case 'NUMBER': return secLabel('Number settings') + dec(6, 'A blank value stays blank. It is not 0.');

    case 'CURRENCY': return secLabel('Currency settings') + dec(4) + `
      <div class="co-note warn">
        <span class="co-note-ico">${ICO.warn}</span>
        <div><b>Which currency?</b> ${openChip('Three options: one workspace currency for every currency field; a Currency field on the record that all its currency fields follow; or a currency code stored on each value.')}
        The proposal is a Currency field on the record that every currency field on it follows — it matches
        “currency is required before handoff”, and budgets and invoices can inherit it.</div>
      </div>`;

    case 'PERCENT': return secLabel('Percent settings') + dec(4, 'Stored as a number — 15% is 15, not 0.15.');

    case 'DATE': return secLabel('Date settings') + `<div class="co-f"><div class="rl-field">
        <label class="rl-field-label">Default value</label>
        <div class="co-seg">
          <button class="${s.dateDefault!=='today'?'active':''}" type="button" onclick="fd.d.settings.dateDefault='blank';fdRender()">Blank</button>
          <button class="${s.dateDefault==='today'?'active':''}" type="button" onclick="fd.d.settings.dateDefault='today';fdRender()">Today</button>
        </div>
      </div></div>`;

    case 'CHECKBOX': return secLabel('Checkbox settings') + `<div class="co-f"><div class="rl-field">
        <label class="rl-field-label">Default value</label>
        <div class="co-seg">
          <button class="${!s.checkDefault?'active':''}" type="button" onclick="fd.d.settings.checkDefault=false;fdRender()">Unchecked</button>
          <button class="${s.checkDefault?'active':''}" type="button" onclick="fd.d.settings.checkDefault=true;fdRender()">Checked</button>
        </div>
        <div class="rl-field-hint">A checkbox is never blank — it is true or false.</div>
      </div></div>`;

    case 'SELECT':
    case 'MULTISELECT': return secLabel('Values') + `
      <div class="co-f">
        ${(s.options||[]).map((opt,i) => `
          <div class="co-pl">
            <span class="co-pl-grip">⠿</span>
            <button class="co-pl-sw" style="background:${esc(opt.color)}" type="button" title="Change colour" onclick="fdCycleColour(${i})"></button>
            <input class="co-input" value="${esc(opt.label)}" placeholder="Value ${i+1}" oninput="fd.d.settings.options[${i}].label = this.value">
            <button class="co-icon-btn danger" onclick="fdRemoveOption(${i})" aria-label="Remove">${ICO.trash}</button>
          </div>`).join('')}
        <button class="rl-btn v-outline sz-sm" style="margin-top:4px" onclick="fdAddOption()">${ICO.plus}<span class="rl-btn-label">Add value</span></button>
        ${fErr('options', fd.err)}
      </div>
      <div class="co-f-row">
        ${field('Sort order', false, `<select class="co-input" onchange="fd.d.settings.sort = this.value">
          <option value="entered" ${s.sort==='entered'?'selected':''}>As entered</option>
          <option value="alpha" ${s.sort==='alpha'?'selected':''}>Alphabetical</option>
        </select>`)}
        <div class="co-f"></div>
      </div>
      <div class="co-note">
        <span class="co-note-ico">${ICO.info}</span>
        <div><b>Restricted to this list, always.</b> Imports and the API cannot introduce a value that is not
        here. Renaming a value updates every record; deleting one asks you what the records holding it should
        say instead; deactivating one hides it from new records but leaves the old ones — and reports — intact.
        ${d.type==='MULTISELECT'?'<br>In reports a multi select filters with “includes”, not “equals”.':''}</div>
      </div>`;

    case 'USER': return secLabel('User settings') + `
      <div class="co-f"><div class="rl-field">
        <label class="rl-field-label">How many</label>
        <div class="co-seg">
          <button class="${s.userMode!=='multiple'?'active':''}" type="button" onclick="fd.d.settings.userMode='single';fdRender()">One user</button>
          <button class="${s.userMode==='multiple'?'active':''}" type="button" onclick="fd.d.settings.userMode='multiple';fdRender()">Several users</button>
        </div>
      </div></div>
      <div class="co-f"><div class="rl-field">
        <label class="rl-field-label">Default value</label>
        <div class="co-seg">
          <button class="${s.userDefault!=='current'?'active':''}" type="button" onclick="fd.d.settings.userDefault='blank';fdRender()">Blank</button>
          <button class="${s.userDefault==='current'?'active':''}" type="button" onclick="fd.d.settings.userDefault='current';fdRender()">The current user</button>
        </div>
      </div></div>`;

    case 'LOOKUP': return fdLookupSettings(o, d);
    case 'FORMULA': return fdFormulaSettings(o, d);
    case 'ROLLUP': return fdRollupSettings(o, d);
    default: return '';
  }
}

/* ── Lookup ───────────────────────────────────────────────────────── */
function fdLookupSettings(o, d){
  const s = d.settings;
  const customs = state.objects.filter(x => x.id !== o.id);
  const picks = targetFieldLabels(s.target);
  const chosen = s.pickerFields || [];

  return secLabel('What it points at') + `
    <div class="co-f"><div class="rl-field">
      <label class="rl-field-label">Related object <span class="rl-field-required">*</span>
        ${fd.fieldId ? tag('Fixed after save') : ''}</label>
      <select class="co-input" ${fd.fieldId?'disabled':''} onchange="fdSetTarget(this.value)">
        <option value="">Select an object…</option>
        <optgroup label="Custom objects">
          ${customs.map(c => `<option value="${c.id}" ${s.target===c.id?'selected':''}>${esc(c.label)}</option>`).join('')}
        </optgroup>
        <optgroup label="Rocketlane objects">
          <option value="ACCOUNT" ${s.target==='ACCOUNT'?'selected':''}>Account</option>
          <option value="PROJECT" ${s.target==='PROJECT'?'selected':''}>Project</option>
        </optgroup>
        <optgroup label="Still to decide — not in this release">
          <option disabled>Budget</option><option disabled>Task</option>
          <option disabled>Phase</option><option disabled>${esc(o.label)} (itself)</option>
        </optgroup>
      </select>
      <div class="rl-field-hint">The lookup stores the target's <b>system ID</b>, never its name — so renaming the
        linked record never breaks the link. For a user, use the User data type instead.</div>
      ${fErr('target', fd.err)}
    </div></div>

    ${s.target ? `
      ${field('Related list label', true,
        `<input class="co-input" value="${esc(s.relatedListLabel)}" placeholder="${esc(o.plural)}" oninput="fd.d.settings.relatedListLabel = this.value; fd.touchedRLL = true">`,
        `The title of the list this creates on the ${esc(targetLabel(s.target))} record — where its ${esc(o.plural.toLowerCase())} are shown, with an “Add new” that pre-fills this lookup.`)}

      <div class="co-f"><div class="rl-field">
        <label class="rl-field-label">When the ${esc(targetLabel(s.target))} is deleted <span class="rl-field-required">*</span></label>
        <div class="co-cards">
          <button class="co-card${s.onDelete!=='BLOCK'?' sel':''}" type="button" onclick="fd.d.settings.onDelete='CLEAR';fdRender()">
            <div class="co-card-t">Clear the value</div>
            <div class="co-card-d">The ${esc(o.label)} survives with an empty ${esc(d.label||'lookup')}.</div>
          </button>
          <button class="co-card${s.onDelete==='BLOCK'?' sel':''}" type="button" onclick="fd.d.settings.onDelete='BLOCK';fdRender()">
            <div class="co-card-t">Block the delete</div>
            <div class="co-card-d">The ${esc(targetLabel(s.target))} cannot be deleted while any ${esc(o.label)} points at it.</div>
          </button>
        </div>
        <div class="rl-field-hint">There is no cascade delete — it belongs to master-detail, which is not in this
          release. “Block the delete”, paired with a required lookup, covers what cascade was protecting.</div>
      </div></div>

      ${secLabel('The picker users see')}
      <div class="co-f"><div class="rl-field">
        <label class="rl-field-label">Extra fields under the name ${tag(chosen.length + '/3')}</label>
        <div class="rl-field-hint" style="margin:0 0 8px">Record names repeat — two orders can both be “H&amp;M Europe”.
          Up to three extra fields help a user pick the right one. Search is by Record Name.</div>
        ${picks.length ? picks.map(p => {
          const on = chosen.includes(p);
          const full = !on && chosen.length >= 3;
          return `<div class="co-check${full?' locked':''}" ${full?'':`onclick="fdTogglePicker('${esc(p).replace(/'/g,"\\'")}')"`}>
            <span class="sc-check${on?' sc-check--on':''}" style="${full?'opacity:.4':''}">${on?ICO.check:''}</span>
            <div><div class="co-ctl-t" style="${full?'color:var(--muted-foreground)':''}">${esc(p)}</div></div>
          </div>`;
        }).join('') : '<div class="co-rel-empty">That object has no fields to show yet.</div>'}
      </div></div>
      <div class="co-note">
        <span class="co-note-ico">${ICO.info}</span>
        <div><b>Lookup filters come later.</b> In this release the picker shows every record the user can
        access. Until filters arrive, a rule like “the line and its order must share an account” is a
        validation rule, not a filter.</div>
      </div>
    ` : ''}`;
}

/* ── Formula (Phase 5 — enough of it to model a line's net extension) ── */
function fdFormulaSettings(o, d){
  const s = d.settings;
  const usable = o.fields.filter(f => f.id !== fd.fieldId && !['FORMULA','ROLLUP','MULTISELECT'].includes(f.type));
  return secLabel('Formula', tag('Phase 5')) + `
    ${field('Returns', false, `<select class="co-input" style="max-width:220px" onchange="fd.d.settings.returns = this.value; fdRender()">
      ${['NUMBER','CURRENCY','PERCENT','TEXT','DATE','CHECKBOX'].map(t =>
        `<option value="${t}" ${s.returns===t?'selected':''}>${esc(typeMeta(t).label)}</option>`).join('')}
    </select>`)}
    <div class="co-f"><div class="rl-field">
      <label class="rl-field-label">Expression <span class="rl-field-required">*</span></label>
      <textarea class="co-input co-mono" rows="2" placeholder="quantity * unit_price" oninput="fd.d.settings.expr = this.value">${esc(s.expr)}</textarea>
      ${fErr('expr', fd.err)}
      <div class="rl-field-hint" style="margin-top:8px">Insert a field:</div>
      <div style="display:flex;gap:5px;flex-wrap:wrap;margin-top:6px">
        ${usable.map(f => `<button class="rl-tag s-sm c-gray interactive" type="button" onclick="fdInsertToken('${f.api}')"><span class="co-mono">${esc(f.api)}</span></button>`).join('')
          || '<span class="co-rel-empty">No other fields yet.</span>'}
      </div>
    </div></div>`;
}

/* ── Roll-up (Part C) ─────────────────────────────────────────────── */
function fdRollupSettings(o, d){
  const s = d.settings;
  /* Only objects that already point at this one can be rolled up — the
     lookup is what the roll-up walks. */
  const children = state.objects.filter(c => c.fields.some(f => f.type === 'LOOKUP' && f.settings.target === o.id));
  const child = obj(s.child);
  const lookups = child ? child.fields.filter(f => f.type === 'LOOKUP' && f.settings.target === o.id) : [];
  const numericIsh = f => NUMERIC.includes(f.type) || (f.type === 'FORMULA' && NUMERIC.includes(f.settings.returns));
  const aggCandidates = child ? child.fields.filter(f =>
      s.fn === 'MIN' || s.fn === 'MAX' ? (numericIsh(f) || f.type === 'DATE') : numericIsh(f)) : [];
  const filterCandidates = child ? child.fields.filter(f => ['SELECT','CHECKBOX','TEXT'].includes(f.type)) : [];
  const filterField = child && s.filterField ? child.fields.find(f => f.id === s.filterField) : null;

  if(!children.length){
    return secLabel('Roll-up') + `
      <div class="co-note warn">
        <span class="co-note-ico">${ICO.warn}</span>
        <div>Nothing points at ${esc(o.label)} yet. A roll-up walks a lookup, so first add a lookup to
        ${esc(o.label)} on the object you want to aggregate.</div>
      </div>`;
  }

  return secLabel('What it aggregates') + `
    <div class="co-f"><div class="rl-field">
      <label class="rl-field-label">Child object <span class="rl-field-required">*</span>
        ${fd.fieldId ? tag('Fixed after save') : ''}</label>
      <select class="co-input" ${fd.fieldId?'disabled':''} onchange="fdSetRollupChild(this.value)">
        <option value="">Select an object…</option>
        ${children.map(c => `<option value="${c.id}" ${s.child===c.id?'selected':''}>${esc(c.plural)}</option>`).join('')}
      </select>
      ${fErr('child', fd.err)}
    </div></div>

    ${child ? `
      ${lookups.length > 1 ? field('Follow which lookup', true,
        `<select class="co-input" onchange="fd.d.settings.childLookup = this.value; fdRender()">
          ${lookups.map(f => `<option value="${f.id}" ${s.childLookup===f.id?'selected':''}>${esc(f.label)}</option>`).join('')}
        </select>`,
        `${esc(child.label)} points at ${esc(o.label)} ${lookups.length} different ways, and they mean different
         things. Rocketlane cannot guess which one you mean — a contract's “customer account” and “partner
         account” give two different, equally correct counts.`)
      : `<div class="co-prev" style="margin-bottom:16px">
          <span>Follows</span><span class="co-prev-val">${esc(lookups[0] ? lookups[0].label : '—')}</span>
          <span>the only lookup from ${esc(child.label)} to ${esc(o.label)}, so there is nothing to choose.</span>
        </div>`}

      <div class="co-f-row">
        ${field('Function', true, `<select class="co-input" onchange="fd.d.settings.fn = this.value; fdRender()">
          ${['COUNT','SUM','MIN','MAX'].map(fn => `<option value="${fn}" ${s.fn===fn?'selected':''}>${fn}</option>`).join('')}
          <option disabled>AVERAGE — still to decide</option>
        </select>`)}
        ${field(s.fn === 'COUNT' ? 'Field' : 'Field to aggregate', s.fn !== 'COUNT',
          s.fn === 'COUNT'
            ? `<input class="co-input" value="Not needed — COUNT counts records" disabled>`
            : `<select class="co-input" onchange="fd.d.settings.aggField = this.value">
                 <option value="">Select a field…</option>
                 ${aggCandidates.map(f => `<option value="${f.id}" ${s.aggField===f.id?'selected':''}>${esc(f.label)}</option>`).join('')}
               </select>`,
          '', fErr('aggField', fd.err))}
      </div>

      <div class="co-f"><div class="rl-field">
        <label class="rl-field-label">Only include children where <span style="font-weight:400;text-transform:none">(optional)</span></label>
        <div style="display:flex;gap:8px">
          <select class="co-input" style="flex:1.2" onchange="fd.d.settings.filterField = this.value; fd.d.settings.filterValue=''; fdRender()">
            <option value="">No filter — include every child</option>
            ${filterCandidates.map(f => `<option value="${f.id}" ${s.filterField===f.id?'selected':''}>${esc(f.label)}</option>`).join('')}
          </select>
          ${s.filterField ? `
            <select class="co-input" style="flex:0 0 94px" onchange="fd.d.settings.filterOp = this.value">
              <option value="eq" ${s.filterOp==='eq'?'selected':''}>is</option>
              <option value="neq" ${s.filterOp==='neq'?'selected':''}>is not</option>
            </select>
            ${filterField && filterField.type === 'SELECT'
              ? `<select class="co-input" style="flex:1" onchange="fd.d.settings.filterValue = this.value">
                   <option value="">Select…</option>
                   ${(filterField.settings.options||[]).map(opt => `<option ${s.filterValue===opt.label?'selected':''}>${esc(opt.label)}</option>`).join('')}
                 </select>`
              : `<input class="co-input" style="flex:1" value="${esc(s.filterValue)}" placeholder="Value" oninput="fd.d.settings.filterValue = this.value">`}
          ` : ''}
        </div>
      </div></div>

      <div class="co-note">
        <span class="co-note-ico">${ICO.info}</span>
        <div><b>Counts every child, including ones the viewer cannot see</b> — otherwise two people open the
        same record and read two different totals. Blanks are skipped by SUM, MIN and MAX; no children at all
        gives 0 for COUNT and SUM, and blank for MIN and MAX. The value is read-only and recalculated before
        the parent's validation rules run, so a rule never reads a stale total.</div>
      </div>
    ` : ''}`;
}

/* ══ Field + object logic (unchanged from the first build) ═════════ */
function odSet(k, v){
  od.d[k] = v;
  delete od.err[k];
  if(k === 'label'){
    if(!od.touchedPlural) od.d.plural = pluralise(v);
    if(!od.touchedRecName) od.d.recordNameLabel = v ? v + ' Name' : '';
    const p = document.getElementById('od-plural');
    if(p && !od.touchedPlural){ p.value = od.d.plural; p.placeholder = pluralise(v) || 'Sales Orders'; }
    const r = document.getElementById('od-recname');
    if(r && !od.touchedRecName){ r.value = od.d.recordNameLabel; r.placeholder = (v||'Sales Order') + ' Name'; }
  }
}

function odLevel(l){ od.d.level = l; odRender(); }
function odNameType(t){
  od.d.recordNameType = t;
  if(t === 'AUTONUMBER' && !od.d.autoFormat){
    const prefix = (od.d.label || 'OB').split(/\s+/).map(w => w[0]||'').join('').toUpperCase().slice(0,3) || 'OB';
    od.d.autoFormat = prefix + '-{000000}';
  }
  odRender();
}

function odPreview(){
  const el = document.getElementById('od-preview');
  if(el) el.textContent = autoPreview(od.d.autoFormat, od.d.autoStart) || '—';
}

function odSave(){
  const d = od.d; od.err = {};
  const label = (d.label||'').trim();
  if(!label) od.err.label = 'Give the object a label.';
  else if(RESERVED.includes(label.toLowerCase()))
    od.err.label = `“${label}” is a Rocketlane object. Pick a label that is not already taken.`;
  else if(state.objects.some(o => o.id !== od.id && o.label.toLowerCase() === label.toLowerCase()))
    od.err.label = `There is already a custom object called “${label}”.`;
  if(!(d.recordNameLabel||'').trim()) od.err.recordNameLabel = 'Give the Record Name a label.';
  if(d.recordNameType === 'AUTONUMBER'){
    if(!/\{0+\}/.test(d.autoFormat||'')) od.err.autoFormat = 'Include a number token, for example {000000}.';
    const o = od.id ? obj(od.id) : null;
    if(o && o.recordNameType === 'AUTONUMBER' && d.autoStart < o.autoStart)
      od.err.autoStart = `Cannot go below ${o.autoStart} — numbers already issued would repeat.`;
  }
  if(Object.keys(od.err).length){ odRender(); return; }

  if(od.id){
    const o = obj(od.id);
    Object.assign(o, {
      label, plural:(d.plural||pluralise(label)).trim(), description:d.description,
      recordNameLabel:d.recordNameLabel.trim(), recordNameType:d.recordNameType,
      autoFormat:d.autoFormat, autoStart:d.autoStart, fieldHistory:d.fieldHistory,
      updated:'Just now',
    });
    if(d.recordNameType === 'AUTONUMBER' && o.autoNext < d.autoStart) o.autoNext = d.autoStart;
    save(); closeDrawer(); render(); toast(`${label} updated.`);
  }else{
    const o = {
      id: uid('o'), label, plural:(d.plural||pluralise(label)).trim(), level:d.level,
      description:d.description, recordNameLabel:d.recordNameLabel.trim(),
      recordNameType:d.recordNameType, autoFormat:d.autoFormat, autoStart:d.autoStart,
      autoNext:d.autoStart, fieldHistory:d.fieldHistory, records:0, updated:'Just now', fields:[],
    };
    state.objects.push(o); save(); closeDrawer(); go('object', o.id, 'fields');
    toast(`${label} created. Record Name, parent and system fields are in place — add your own fields next.`);
  }
}

function fdSetLabel(v){
  fd.d.label = v; delete fd.err.label;
  if(!fd.touchedApi){
    fd.d.api = apiFromLabel(v);
    const el = document.getElementById('fd-api');
    if(el){ el.value = fd.d.api; el.placeholder = apiFromLabel(v) || 'order_date'; }
  }
}

/* Default settings per type. These are the proposals in A4, not invented
   numbers: 255 for text, 32,000 for multi-line, 2 decimals for currency. */
function defaultSettings(type){
  switch(type){
    case 'TEXT':        return {maxLength:255};
    case 'MULTILINE':   return {maxLength:32000};
    case 'NUMBER':      return {decimals:0};
    case 'CURRENCY':    return {decimals:2};
    case 'PERCENT':     return {decimals:2};
    case 'DATE':        return {dateDefault:'blank'};
    case 'CHECKBOX':    return {checkDefault:false};
    case 'SELECT':
    case 'MULTISELECT': return {options:[{label:'',color:PALETTE[0]}], sort:'entered'};
    case 'USER':        return {userMode:'single', userDefault:'blank'};
    case 'LOOKUP':      return {target:'', relatedListLabel:'', onDelete:'CLEAR', pickerFields:[]};
    case 'FORMULA':     return {returns:'NUMBER', expr:''};
    case 'ROLLUP':      return {child:'', childLookup:'', fn:'SUM', aggField:'', filterField:'', filterOp:'eq', filterValue:''};
    default:            return {};
  }
}

function openFieldDrawer(objId, fieldId){
  const o = obj(objId);
  const f = fieldId ? o.fields.find(x => x.id === fieldId) : null;
  fd = {
    objId, fieldId: fieldId || null, q:'',
    step: f ? 'form' : 'type',
    touchedApi: !!f, touchedRLL: !!f,
    err:{},
    d: f ? JSON.parse(JSON.stringify(f))
         : {label:'', api:'', type:'', description:'', help:'', required:false, unique:false,
            extId:false, def:'', showInReports:true, settings:{}},
  };
  fdRender();
}

function fdRender(){ fd.step === 'type' ? fdRenderType() : fdRenderForm(); }


function fdPickType(t){
  fd.d.type = t;
  fd.d.settings = defaultSettings(t);
  if(t === 'LOOKUP') fd.d.settings.relatedListLabel = obj(fd.objId).plural;
  fd.step = 'form';
  fdRender();
}

function fdAddOption(){ fd.d.settings.options.push({label:'', color:PALETTE[fd.d.settings.options.length % PALETTE.length]}); delete fd.err.options; fdRender(); }
function fdRemoveOption(i){
  const opts = fd.d.settings.options;
  if(fd.d.def === opts[i].label) fd.d.def = '';
  opts.splice(i,1); if(!opts.length) opts.push({label:'', color:PALETTE[0]});
  fdRender();
}

function fdCycleColour(i){
  const opt = fd.d.settings.options[i];
  opt.color = PALETTE[(PALETTE.indexOf(opt.color) + 1) % PALETTE.length];
  fdRender();
}

/* ── Lookup ───────────────────────────────────────────────────────── */
function targetFieldLabels(target){
  if(target === 'ACCOUNT') return ['Account Owner','Region','Industry','Created at'];
  if(target === 'PROJECT') return ['Customer','Project Owner','Status','Start date','Created at'];
  const t = obj(target); if(!t) return [];
  const parent = t.level === 'GLOBAL' ? null : (t.level === 'ACCOUNT' ? 'Account' : 'Project');
  return [parent, ...t.fields.filter(f => f.type !== 'ROLLUP').map(f => f.label), 'Created at'].filter(Boolean);
}

function fdSetTarget(v){
  fd.d.settings.target = v;
  fd.d.settings.pickerFields = v
    ? targetFieldLabels(v).filter(x => ['Account','Project','Customer','Created at'].includes(x)).slice(0,2)
    : [];
  if(!fd.touchedRLL) fd.d.settings.relatedListLabel = obj(fd.objId).plural;
  delete fd.err.target;
  fdRender();
}

function fdTogglePicker(label){
  const arr = fd.d.settings.pickerFields || (fd.d.settings.pickerFields = []);
  const i = arr.indexOf(label);
  if(i >= 0) arr.splice(i,1); else if(arr.length < 3) arr.push(label);
  fdRender();
}

function fdInsertToken(api){
  fd.d.settings.expr = (fd.d.settings.expr ? fd.d.settings.expr.trimEnd() + ' ' : '') + api;
  fdRender();
}

function fdSetRollupChild(v){
  const s = fd.d.settings;
  s.child = v; s.aggField = ''; s.filterField = ''; s.filterValue = '';
  const c = obj(v);
  const lookups = c ? c.fields.filter(f => f.type === 'LOOKUP' && f.settings.target === fd.objId) : [];
  s.childLookup = lookups.length ? lookups[0].id : '';
  delete fd.err.child;
  fdRender();
}

/* ── Save a field ─────────────────────────────────────────────────── */
function fdSave(){
  const o = obj(fd.objId), d = fd.d; fd.err = {};
  const label = (d.label||'').trim();
  if(!label) fd.err.label = 'Give the field a label.';
  else if(o.fields.some(f => f.id !== fd.fieldId && f.label.toLowerCase() === label.toLowerCase()))
    fd.err.label = `${o.label} already has a field called “${label}”.`;
  else if(label.toLowerCase() === o.recordNameLabel.toLowerCase())
    fd.err.label = `“${label}” is the Record Name field on ${o.label}.`;

  if(d.type === 'LOOKUP' && !d.settings.target) fd.err.target = 'Choose what this points at.';
  if(d.type === 'ROLLUP'){
    if(!d.settings.child) fd.err.child = 'Choose the object to aggregate.';
    else if(d.settings.fn !== 'COUNT' && !d.settings.aggField) fd.err.aggField = 'Choose the field to aggregate.';
  }
  if(d.type === 'FORMULA' && !(d.settings.expr||'').trim()) fd.err.expr = 'Write the expression.';
  if((d.type === 'SELECT' || d.type === 'MULTISELECT') && !(d.settings.options||[]).some(x => x.label.trim()))
    fd.err.options = 'Add at least one value.';

  if(Object.keys(fd.err).length){ fdRender(); return; }

  if(d.type === 'SELECT' || d.type === 'MULTISELECT')
    d.settings.options = d.settings.options.filter(x => x.label.trim());
  d.label = label;
  d.api = (d.api || apiFromLabel(label)).trim();

  if(fd.fieldId){
    const i = o.fields.findIndex(f => f.id === fd.fieldId);
    o.fields[i] = Object.assign({}, o.fields[i], d);
    toast(`${label} updated.`);
  }else{
    d.id = uid('f');
    o.fields.push(d);
    toast(d.type === 'LOOKUP'
      ? `${label} created. ${targetLabel(d.settings.target)} records now show a “${d.settings.relatedListLabel}” related list.`
      : `${label} created and available in records, reports, automations and the API.`);
  }
  o.updated = 'Just now';
  save(); closeDrawer(); render();
}

/* ══ Menus ══════════════════════════════════════════════════════════ */
let menuEl = null;
function closeMenu(){ if(menuEl){ menuEl.remove(); menuEl = null; } }
document.addEventListener('click', e => { if(menuEl && !menuEl.contains(e.target)) closeMenu(); }, true);

function showMenu(ev, items){
  ev.stopPropagation(); closeMenu();
  const el = document.createElement('div');
  el.className = 'co-menu';
  el.innerHTML = items.map(i => i === '-' ? '<div class="co-menu-sep"></div>'
    : `<button class="co-menu-i${i.danger?' danger':''}" ${i.disabled?'disabled':''} ${i.title?`title="${esc(i.title)}"`:''}>${esc(i.label)}</button>`).join('');
  document.body.appendChild(el);
  const r = ev.currentTarget.getBoundingClientRect();
  el.style.top = Math.min(r.bottom + 4, window.innerHeight - el.offsetHeight - 10) + 'px';
  el.style.left = Math.max(10, r.right - el.offsetWidth) + 'px';
  let n = 0;
  items.forEach(i => { if(i === '-') return;
    const btn = el.querySelectorAll('.co-menu-i')[n++];
    if(!i.disabled) btn.onclick = () => { closeMenu(); i.fn(); };
  });
  menuEl = el;
}
function pageMenu(ev){
  showMenu(ev, [
    {label:'Restore sample data', fn:resetData},
    {label:'Remove every object', danger:true, fn:clearData},
  ]);
}
function objectMenu(ev, id){
  const blockers = incoming(id);
  showMenu(ev, [
    {label:'Open', fn:()=>go('object', id, 'fields')},
    {label:'Add field', fn:()=>{ go('object', id, 'fields'); openFieldDrawer(id); }},
    {label:'Edit object', fn:()=>openObjectDrawer(id)},
    '-',
    {label: blockers.length ? `Delete — blocked by ${blockers.length} lookup${blockers.length>1?'s':''}` : 'Delete object',
     danger:true, disabled:!!blockers.length,
     title: blockers.length ? blockers.map(b => `${b.obj.label}.${b.field.label}`).join(', ') : '',
     fn:()=>confirmDeleteObject(id)},
  ]);
}

/* ══ Confirm dialogs ════════════════════════════════════════════════ */
function dialog({title, body, confirm, danger, onConfirm, blocked}){
  document.getElementById('dialog-host').innerHTML = `
    <div class="sc-dialog-overlay" onclick="if(event.target===this) closeDialog()">
      <div class="sc-dialog" role="dialog" aria-modal="true">
        <div class="sc-dialog-header">
          <div class="sc-dialog-title">${title}</div>
          <div class="sc-dialog-desc">${body}</div>
        </div>
        <div class="sc-dialog-footer">
          <button class="rl-btn v-outline sz-md" onclick="closeDialog()"><span class="rl-btn-label">${blocked ? 'Close' : 'Cancel'}</span></button>
          ${blocked ? '' : `<button class="rl-btn ${danger?'v-danger':'v-primary'} sz-md" id="dlg-ok"><span class="rl-btn-label">${confirm}</span></button>`}
        </div>
      </div>
    </div>`;
  const ok = document.getElementById('dlg-ok');
  if(ok) ok.onclick = () => { closeDialog(); onConfirm(); };
}
function closeDialog(){ document.getElementById('dialog-host').innerHTML = ''; }

/* A field delete has to say what it would break first. Formulas and
   roll-ups that read the field block it outright. */
function confirmDeleteField(objId, fieldId){
  const o = obj(objId), f = o.fields.find(x => x.id === fieldId);
  const used = usages(o, f);
  if(used.length){
    dialog({
      title:`“${esc(f.label)}” is in use`,
      body:`Something is reading this field, so deleting it would break:<br><br>
        ${used.map(u => `• ${esc(u)}`).join('<br>')}<br><br>
        Remove those first, then delete the field.`,
      blocked:true,
    });
    return;
  }
  const inbound = f.type === 'LOOKUP' ? `<br><br>The <b>${esc(f.settings.relatedListLabel)}</b> related list on
    ${esc(targetLabel(f.settings.target))} records goes with it.` : '';
  dialog({
    title:`Delete “${esc(f.label)}”?`,
    body:`The field and its values on all ${o.records.toLocaleString()} ${esc(o.plural.toLowerCase())} are removed.
      Check first whether reports, automations, layouts or validation rules use it.${inbound}`,
    confirm:'Delete field', danger:true,
    onConfirm(){
      o.fields = o.fields.filter(x => x.id !== fieldId);
      o.updated = 'Just now'; save(); render(); toast(`${f.label} deleted.`);
    },
  });
}

function confirmDeleteObject(id){
  const o = obj(id), blockers = incoming(id);
  if(blockers.length){
    dialog({
      title:`${esc(o.label)} cannot be deleted yet`,
      body:`These lookups point at it:<br><br>
        ${blockers.map(b => `• <b>${esc(b.field.label)}</b> on ${esc(b.obj.label)}${b.field.required?' (required)':''}`).join('<br>')}<br><br>
        Remove them first. This is the same protection “block the delete” gives a single record, applied to the object.`,
      blocked:true,
    });
    return;
  }
  dialog({
    title:`Delete ${esc(o.label)}?`,
    body:`${o.records.toLocaleString()} records, ${o.fields.length} fields and every view, report column and
      automation that refers to them are removed. This cannot be undone.`,
    confirm:`Delete ${esc(o.label)}`, danger:true,
    onConfirm(){
      state.objects = state.objects.filter(x => x.id !== id);
      save(); go('list'); toast(`${o.label} deleted.`);
    },
  });
}

/* ══ Go ═════════════════════════════════════════════════════════════ */
render();
</script>
