/* Default value, for the types where a generic control makes sense.
   Date, checkbox and user carry theirs in the type-specific block. */
function fdDefaultValue(d){
  const t = d.type;
  if(['DATE','CHECKBOX','USER','LOOKUP','MULTISELECT'].includes(t)) return '';
  let control;
  if(t === 'SELECT'){
    const opts = (d.settings.options||[]).filter(o => o.label);
    control = `<select class="co-input" onchange="fd.d.def = this.value">
      <option value="">No default</option>
      ${opts.map(o => `<option ${d.def===o.label?'selected':''}>${esc(o.label)}</option>`).join('')}
    </select>`;
  }else if(NUMERIC.includes(t)){
    control = `<input class="co-input" type="number" value="${esc(d.def)}" placeholder="No default" oninput="fd.d.def = this.value">`;
  }else{
    control = `<input class="co-input" value="${esc(d.def)}" placeholder="No default" oninput="fd.d.def = this.value">`;
  }
  return `<div style="padding-top:14px;border-top:1px solid var(--border);margin-top:4px">
    ${field('Default value', false, control, 'New records only.')}
  </div>`;
}

/* ── Type-specific settings ───────────────────────────────────────── */
function fdTypeSettings(o, d){
  const s = d.settings;
  const dec = (max, hint) => `<div class="co-f" style="max-width:190px"><div class="rl-field">
      <label class="rl-field-label">Decimal places</label>
      <select class="co-input" onchange="fd.d.settings.decimals = parseInt(this.value,10)">
        ${Array.from({length:max+1},(_,i)=>`<option value="${i}" ${s.decimals===i?'selected':''}>${i}</option>`).join('')}
      </select>
      ${hint ? `<div class="rl-field-hint">${hint}</div>` : ''}
    </div></div>`;

  switch(d.type){
    case 'TEXT': return `<div class="co-f" style="max-width:190px">${field('Maximum length', false,
      `<input class="co-input" type="number" min="1" max="255" value="${esc(s.maxLength)}" oninput="fd.d.settings.maxLength = parseInt(this.value||'255',10)">`,
      'Up to 255 characters.')}</div>`;

    case 'MULTILINE': return `<div class="co-f" style="max-width:190px">${field('Maximum length', false,
      `<input class="co-input" type="number" min="1" max="32000" value="${esc(s.maxLength)}" oninput="fd.d.settings.maxLength = parseInt(this.value||'32000',10)">`,
      'Up to 32,000 characters.')}</div>`;

    case 'NUMBER': return dec(6, 'Blank is not 0.');

    case 'CURRENCY': return dec(4, 'Which currency a value is in is undecided. ' +
      openChip('One workspace currency, a Currency field on the record, or a code per value? Proposal: a Currency field on the record.'));

    case 'PERCENT': return dec(4, '15% is stored as 15.');

    case 'DATE': return `<div class="co-f"><div class="rl-field">
        <label class="rl-field-label">Default value</label>
        <div class="co-seg">
          <button class="${s.dateDefault!=='today'?'active':''}" type="button" onclick="fd.d.settings.dateDefault='blank';fdRender()">Blank</button>
          <button class="${s.dateDefault==='today'?'active':''}" type="button" onclick="fd.d.settings.dateDefault='today';fdRender()">Today</button>
        </div>
      </div></div>`;

    case 'CHECKBOX': return `<div class="co-f"><div class="rl-field">
        <label class="rl-field-label">Default value</label>
        <div class="co-seg">
          <button class="${!s.checkDefault?'active':''}" type="button" onclick="fd.d.settings.checkDefault=false;fdRender()">Unchecked</button>
          <button class="${s.checkDefault?'active':''}" type="button" onclick="fd.d.settings.checkDefault=true;fdRender()">Checked</button>
        </div>
      </div></div>`;

    case 'SELECT':
    case 'MULTISELECT': return `
      <div class="co-f">
        ${(s.options||[]).map((opt,i) => `
          <div class="co-pl">
            <span class="co-pl-grip">⠿</span>
            <button class="co-pl-sw" style="background:${esc(opt.color)}" type="button" title="Change colour" onclick="fdCycleColour(${i})"></button>
            <input class="co-input" value="${esc(opt.label)}" placeholder="Value ${i+1}" oninput="fd.d.settings.options[${i}].label = this.value">
            <button class="co-icon-btn danger" onclick="fdRemoveOption(${i})" aria-label="Remove">${ICO.trash}</button>
          </div>`).join('')}
        <button class="rl-btn v-outline sz-sm" style="margin-top:4px" onclick="fdAddOption()">${ICO.plus}<span class="rl-btn-label">Add value</span></button>
        ${fErr('options', fd.err)}
      </div>
      <div class="co-f-row">
        ${field('Sort order', false, `<select class="co-input" onchange="fd.d.settings.sort = this.value">
          <option value="entered" ${s.sort==='entered'?'selected':''}>As entered</option>
          <option value="alpha" ${s.sort==='alpha'?'selected':''}>Alphabetical</option>
        </select>`)}
        <div class="co-f"></div>
      </div>
      <div style="font-size:12px;color:var(--muted-foreground)">Values are restricted to this list. Deleting one asks what replaces it.</div>`;

    case 'USER': return `
      <div class="co-f"><div class="rl-field">
        <label class="rl-field-label">How many</label>
        <div class="co-seg">
          <button class="${s.userMode!=='multiple'?'active':''}" type="button" onclick="fd.d.settings.userMode='single';fdRender()">One user</button>
          <button class="${s.userMode==='multiple'?'active':''}" type="button" onclick="fd.d.settings.userMode='multiple';fdRender()">Several users</button>
        </div>
      </div></div>
      <div class="co-f"><div class="rl-field">
        <label class="rl-field-label">Default value</label>
        <div class="co-seg">
          <button class="${s.userDefault!=='current'?'active':''}" type="button" onclick="fd.d.settings.userDefault='blank';fdRender()">Blank</button>
          <button class="${s.userDefault==='current'?'active':''}" type="button" onclick="fd.d.settings.userDefault='current';fdRender()">The current user</button>
        </div>
      </div></div>`;

    case 'LOOKUP': return fdLookupSettings(o, d);
    case 'FORMULA': return fdFormulaSettings(o, d);
    case 'ROLLUP': return fdRollupSettings(o, d);
    default: return '';
  }
}

/* ── Lookup ───────────────────────────────────────────────────────── */
function fdLookupSettings(o, d){
  const s = d.settings;
  const customs = state.objects.filter(x => x.id !== o.id);
  const picks = targetFieldLabels(s.target);
  const chosen = s.pickerFields || [];

  return `
    <div class="co-f"><div class="rl-field">
      <label class="rl-field-label">Related object <span class="rl-field-required">*</span>
        ${fd.fieldId ? tag('Fixed after save') : ''}</label>
      <select class="co-input" ${fd.fieldId?'disabled':''} onchange="fdSetTarget(this.value)">
        <option value="">Select an object…</option>
        <optgroup label="Custom objects">
          ${customs.map(c => `<option value="${c.id}" ${s.target===c.id?'selected':''}>${esc(c.label)}</option>`).join('')}
        </optgroup>
        <optgroup label="Rocketlane objects">
          <option value="ACCOUNT" ${s.target==='ACCOUNT'?'selected':''}>Account</option>
          <option value="PROJECT" ${s.target==='PROJECT'?'selected':''}>Project</option>
        </optgroup>
        <optgroup label="Still to decide — not in this release">
          <option disabled>Budget</option><option disabled>Task</option>
          <option disabled>Phase</option><option disabled>${esc(o.label)} (itself)</option>
        </optgroup>
      </select>
      ${fErr('target', fd.err)}
    </div></div>

    ${s.target ? `
      ${field('Related list label', true,
        `<input class="co-input" value="${esc(s.relatedListLabel)}" placeholder="${esc(o.plural)}" oninput="fd.d.settings.relatedListLabel = this.value; fd.touchedRLL = true">`,
        `Shown on the ${esc(targetLabel(s.target))} record.`)}

      ${field(`When the ${esc(targetLabel(s.target))} is deleted`, true,
        `<select class="co-input" onchange="fd.d.settings.onDelete = this.value; fdRender()">
          <option value="CLEAR" ${s.onDelete!=='BLOCK'?'selected':''}>Clear the value</option>
          <option value="BLOCK" ${s.onDelete==='BLOCK'?'selected':''}>Block the delete</option>
        </select>`,
        s.onDelete === 'BLOCK'
          ? `The ${esc(targetLabel(s.target))} cannot be deleted while ${esc(o.plural.toLowerCase())} point at it.`
          : `The ${esc(o.label)} is kept and this field is emptied.`)}
      <div class="co-f"><div class="rl-field">
        <label class="rl-field-label">Extra fields under the name ${tag(chosen.length + '/3')}</label>
        <div class="rl-field-hint" style="margin:0 0 8px">Record names repeat. Up to three extra fields help tell them apart.</div>
        ${picks.length ? picks.map(p => {
          const on = chosen.includes(p);
          const full = !on && chosen.length >= 3;
          return `<div class="co-check${full?' locked':''}" ${full?'':`onclick="fdTogglePicker('${esc(p).replace(/'/g,"\\'")}')"`}>
            <span class="sc-check${on?' sc-check--on':''}" style="${full?'opacity:.4':''}">${on?ICO.check:''}</span>
            <div><div class="co-ctl-t" style="${full?'color:var(--muted-foreground)':''}">${esc(p)}</div></div>
          </div>`;
        }).join('') : '<div class="co-rel-empty">That object has no fields to show yet.</div>'}
      </div></div>
    ` : ''}`;
}

/* ── Formula ──────────────────────────────────────────────────────
   Building an expression means alternating between fields and
   operators, so both are offered the same way: a palette under the box
   that inserts at the cursor. Nothing here requires knowing the syntax
   in advance, which the bare textarea did.

   Tokens go through an array rather than inline onclick strings — field
   labels and operators both carry characters that would need escaping
   twice over. ──────────────────────────────────────────────────────── */
let FD_TOKENS = [];
/* Which expression box the palette is driving. The formula editor and the
   validation rule editor both use it, so it cannot read `fd` directly. */
let EXPR = {target:'fd-expr', objId:null, excludeId:null};

const FD_OPS = [
  {t:'+', hint:'Add'}, {t:'-', hint:'Subtract'}, {t:'*', hint:'Multiply'},
  {t:'/', hint:'Divide'}, {t:'(', hint:'Open bracket'}, {t:')', hint:'Close bracket'},
];
const FD_COMPARE = [
  {t:'=', hint:'Equals'}, {t:'!=', hint:'Does not equal'}, {t:'>', hint:'Greater than'},
  {t:'<', hint:'Less than'}, {t:'>=', hint:'At least'}, {t:'<=', hint:'At most'},
  /* Rocketlane already has these as operators, so they belong here
     rather than as borrowed Salesforce functions. */
  {t:'isempty', hint:'Has no value'}, {t:'isnotempty', hint:'Has a value'},
  {t:'contains', hint:'A multi select holds this value'},
];
const FD_LOGIC = [{t:'AND', hint:'Both are true'}, {t:'OR', hint:'Either is true'}, {t:'NOT', hint:'Is not true'}];
/* Functions worth offering depend on what the formula returns. */
function fdFunctions(returns){
  if(returns === 'TEXT')     return [{t:'CONCAT(', hint:'Join text'}, {t:'UPPER(', hint:'Upper case'}, {t:'LOWER(', hint:'Lower case'}];
  if(returns === 'DATE')     return [{t:'TODAY()', hint:'Today’s date'}, {t:'DATE_ADD(', hint:'Add days to a date'}];
  if(returns === 'CHECKBOX') return [{t:'IF(', hint:'If this, then that'}];
  return [{t:'ROUND(', hint:'Round to decimals'}, {t:'ABS(', hint:'Drop the minus sign'},
          {t:'MIN(', hint:'Smallest of'}, {t:'MAX(', hint:'Largest of'}];
}

/* Fields one hop away. A formula on Line Item can read the product it
   points at — {Product.Default Price} — which is how the line gets its
   default price without an automation.

   One hop only. The spec asks for a documented depth limit, and one hop
   covers the cases in it while keeping the token readable; Line Item →
   Sales Order → Account would not be. */
function relatedFieldSources(o){
  return o.fields.filter(f => f.type === 'LOOKUP' && f.settings.target).map(f => {
    const t = f.settings.target;
    const target = obj(t);
    const fields = target
      ? target.fields.filter(x => x.type !== 'MULTISELECT').map(x => ({label:x.label, type:x.type}))
      : targetFieldLabels(t).map(l => ({label:l, type:null}));
    return {lookup:f.label, target:targetLabel(t), fields};
  }).filter(x => x.fields.length);
}

/* The palette, shared by the formula editor and the validation rule
   editor. `opts.fns` chooses the function set, `opts.bool` adds the
   comparison and logic rows a boolean expression needs. */
function exprPalette(targetId, objId, opts){
  const o = obj(objId);
  EXPR = {target:targetId, objId, excludeId:opts.excludeId || null, onChange:opts.onChange};
  const own = o.fields.filter(f => f.id !== EXPR.excludeId && !['MULTISELECT'].includes(f.type));
  const related = relatedFieldSources(o);
  FD_TOKENS = [];

  const CHIP_CAP = 12;
  const shown = own.slice(0, CHIP_CAP);
  const hidden = own.length - shown.length;
  const relatedCount = related.reduce((n, r) => n + r.fields.length, 0);

  const chip = (text, kind, title) => {
    const i = FD_TOKENS.push({text, kind}) - 1;
    return `<button class="co-tok${kind === 'op' ? ' op' : ''}" type="button"
              onclick="insertToken(${i})"${title ? ` title="${esc(title)}"` : ''}>${esc(text)}</button>`;
  };
  const group = (label, chips) => `
    <div class="co-tokrow"><span class="co-toklabel">${label}</span><div class="co-toks">${chips}</div></div>`;
  const searchLabel = hidden || relatedCount ? `Search ${own.length + relatedCount} fields` : 'Search fields';

  return `<div class="co-palette">
    ${group('Fields',
      (shown.length
        ? shown.map(f => chip('{' + f.label + '}', 'field', typeMeta(f.type).label)).join('')
        : '<span style="font-size:12px;color:var(--muted-foreground);padding-top:4px">No fields yet.</span>')
      + `<button class="co-tok find" type="button" onclick="openFieldPicker(event)">
           ${ICO.search}${esc(searchLabel)}${hidden ? ` <span style="opacity:.6">+${hidden} more</span>` : ''}</button>`)}
    ${group('Operators', FD_OPS.map(x => chip(x.t, 'op', x.hint)).join('')
      + (opts.bool ? FD_COMPARE.map(x => chip(x.t, 'op', x.hint)).join('') : ''))}
    ${opts.bool ? group('Logic', FD_LOGIC.map(x => chip(x.t, 'op', x.hint)).join('')) : ''}
    ${group('Functions', opts.fns.map(x => chip(x.t, 'fn', x.hint)).join(''))}
  </div>`;
}

function fdFormulaSettings(o, d){
  const s = d.settings;
  const bool = s.returns === 'CHECKBOX';

  const expr = s.expr || '';
  return `
    ${field('Returns', false, `<select class="co-input" style="max-width:220px" onchange="fd.d.settings.returns = this.value; fdRender()">
      ${['NUMBER','CURRENCY','PERCENT','TEXT','DATE','CHECKBOX'].map(t =>
        `<option value="${t}" ${s.returns===t?'selected':''}>${esc(typeMeta(t).label)}</option>`).join('')}
    </select>`)}
    <div class="co-f"><div class="rl-field">
      <label class="rl-field-label">Expression <span class="rl-field-required">*</span></label>
      <textarea class="co-input co-mono" id="fd-expr" rows="2" placeholder="{Quantity} * {Unit Price}"
                oninput="fd.d.settings.expr = this.value; fdExprCheck()">${esc(expr)}</textarea>
      ${fErr('expr', fd.err)}
      <div id="fd-expr-warn">${exprWarning(expr)}</div>
      ${exprPalette('fd-expr', o.id, {
        excludeId: fd.fieldId, bool,
        fns: fdFunctions(s.returns),
        onChange: v => { fd.d.settings.expr = v; },
      })}
      <div class="rl-field-hint">Click to insert at the cursor. Fields are wrapped in braces, and a field on a
        linked record is written as <span class="co-mono">{Lookup.Field}</span> — one hop.</div>
    </div></div>`;
}

/* ── Field picker ─────────────────────────────────────────────────
   One searchable list for every field the formula can reach: this
   object's own, then one group per lookup. It is the only part of the
   palette that has to survive a hundred fields. ──────────────────── */
let FP = null;

function fieldPickerGroups(){
  const o = obj(EXPR.objId);
  const own = o.fields.filter(f => f.id !== EXPR.excludeId && !['MULTISELECT'].includes(f.type));
  const groups = [{label:o.label, items:own.map(f => ({label:f.label, type:f.type, token:`{${f.label}}`}))}];
  /* The lookup's own label names the group. It reads as the object it
     points at — Account, Product — and stays unambiguous when an object
     points at the same one twice, as Customer Account and Partner
     Account would. */
  relatedFieldSources(o).forEach(src => groups.push({
    label: src.lookup,
    items: src.fields.map(x => ({label:x.label, type:x.type, token:`{${src.lookup}.${x.label}}`})),
  }));
  return groups.filter(g => g.items.length);
}

function openFieldPicker(ev){
  ev.stopPropagation();
  closeMenu();
  const groups = fieldPickerGroups();
  /* Own fields open, linked objects folded — the list opens on what you
     are most likely to want, and the rest is one click away rather than
     a scroll. */
  const collapsed = {};
  groups.forEach((g, i) => { collapsed[g.label] = i > 0; });
  FP = {q:'', groups, collapsed, rect:ev.currentTarget.getBoundingClientRect()};
  renderFieldPicker();
}
function closeFieldPicker(){
  FP = null;
  const el = document.getElementById('fp');
  if(el) el.remove();
}
function fpSearch(q){ FP.q = q; renderFieldPicker(true); }
function fpToggle(label){ FP.collapsed[label] = !FP.collapsed[label]; renderFieldPicker(); }

function renderFieldPicker(keepFocus){
  if(!FP) return;
  let el = document.getElementById('fp');
  const opening = !el;
  if(opening){
    el = document.createElement('div');
    el.id = 'fp'; el.className = 'co-fp';
    document.body.appendChild(el);
  }
  const q = FP.q.toLowerCase();
  const groups = FP.groups
    .map(g => ({label:g.label, items:g.items.filter(x => !q || x.label.toLowerCase().includes(q))}))
    .filter(g => g.items.length);
  const total = groups.reduce((n, g) => n + g.items.length, 0);

  el.innerHTML = `
    <div class="co-fp-search">
      <input class="co-input" placeholder="Search fields" value="${esc(FP.q)}" oninput="fpSearch(this.value)">
    </div>
    <div class="co-fp-list">
      ${total ? groups.map(g => {
        /* A search ignores the folds — hiding a match behind one would
           make the search look broken. */
        const folded = !q && FP.collapsed[g.label];
        return `
        <button class="co-fp-group" onclick="fpToggle('${esc(g.label).replace(/'/g, "&#39;")}')">
          <span class="co-fp-chev${folded ? ' folded' : ''}">${ICO.chevDown}</span>
          <span>${esc(g.label)}</span>
          <span class="co-fp-n">${g.items.length}</span>
        </button>
        ${folded ? '' : g.items.map(x => `
          <button class="co-fp-i" onclick="pickField('${esc(x.token).replace(/'/g, "&#39;")}')">
            ${x.type ? typeIcon(x.type) : '<span class="co-type-ico"></span>'}
            <span class="co-fp-l">${esc(x.label)}</span>
          </button>`).join('')}`;
      }).join('')
      : `<div class="co-fp-empty">No field matches “${esc(FP.q)}”.</div>`}
    </div>`;
  /* Reposition on every render, not only on open: expanding a group
     makes the panel taller, and one anchored near the bottom would grow
     straight off the screen. */
  setTimeout(() => {
    if(!FP || !document.getElementById('fp')) return;
    const r = FP.rect;
    el.style.left = Math.max(10, Math.min(r.left, window.innerWidth - el.offsetWidth - 10)) + 'px';
    el.style.top  = Math.max(10, Math.min(r.bottom + 6, window.innerHeight - el.offsetHeight - 10)) + 'px';
    if(opening){ const i = el.querySelector('input'); if(i) i.focus(); }
  }, 0);

  if(keepFocus){
    const i = el.querySelector('input');
    if(i){ i.focus(); i.setSelectionRange(i.value.length, i.value.length); }
  }
}
function pickField(token){
  closeFieldPicker();
  insertText(token, 'field');
}
document.addEventListener('click', e => {
  const el = document.getElementById('fp');
  if(FP && el && !el.contains(e.target)) closeFieldPicker();
}, true);

/* Unbalanced brackets are the mistake this box invites, so say so — and
   say it while typing, since inserting a token deliberately skips the
   re-render to keep the caret where it is. */
function exprWarning(expr){
  const open = (String(expr||'').match(/\(/g) || []).length;
  const close = (String(expr||'').match(/\)/g) || []).length;
  if(open === close) return '';
  return `<div class="co-err">${ICO.warn} ${open > close
    ? 'A bracket is not closed.' : 'There is a closing bracket with nothing to close.'}</div>`;
}
function exprCheck(value){
  const el = document.getElementById(EXPR.target + '-warn');
  if(el) el.innerHTML = exprWarning(value);
}
function fdExprCheck(){ exprCheck(fd.d.settings.expr); }

/* Insert at the caret and leave it after the token, so a field, an
   operator and a second field can be clicked in sequence without
   touching the keyboard. Spacing is added where it is missing. */
function insertToken(i){
  const tok = FD_TOKENS[i];
  if(tok) insertText(tok.text, tok.kind);
}
function insertText(text, kind){
  const el = document.getElementById(EXPR.target);
  if(!el) return;

  const start = el.selectionStart, end = el.selectionEnd, v = el.value;
  const before = v.slice(0, start), after = v.slice(end);
  const prev = before.slice(-1), next = after.slice(0, 1);

  /* No space right after an opening bracket, or before a closing one. */
  const lead  = (!before || prev === ' ' || prev === '(' || text === ')') ? '' : ' ';
  const trail = (kind === 'fn' || text === '(') ? ''
              : (!after || next === ' ' || next === ')') ? '' : ' ';

  const piece = lead + text + trail;
  const value = (before + piece + after).replace(/ {2,}/g, ' ');
  el.value = value;
  EXPR.onChange(value);

  const caret = (before + piece).replace(/ {2,}/g, ' ').length;
  el.focus();
  el.setSelectionRange(caret, caret);
  exprCheck(value);
}

/* ── Roll-up (Part C) ─────────────────────────────────────────────── */
function fdRollupSettings(o, d){
  const s = d.settings;
  /* Only objects that already point at this one can be rolled up — the
     lookup is what the roll-up walks. */
  const children = state.objects.filter(c => c.fields.some(f => f.type === 'LOOKUP' && f.settings.target === o.id));
  const child = obj(s.child);
  const lookups = child ? child.fields.filter(f => f.type === 'LOOKUP' && f.settings.target === o.id) : [];
  const numericIsh = f => NUMERIC.includes(f.type) || (f.type === 'FORMULA' && NUMERIC.includes(f.settings.returns));
  const aggCandidates = child ? child.fields.filter(f =>
      s.fn === 'MIN' || s.fn === 'MAX' ? (numericIsh(f) || f.type === 'DATE') : numericIsh(f)) : [];
  const filterCandidates = child ? child.fields.filter(f => ['SELECT','CHECKBOX','TEXT'].includes(f.type)) : [];
  const filterField = child && s.filterField ? child.fields.find(f => f.id === s.filterField) : null;

  if(!children.length){
    return `
      <div class="co-note warn">
        <span class="co-note-ico">${ICO.warn}</span>
        <div>Nothing points at ${esc(o.label)} yet. Add a lookup on the object you want to aggregate first.</div>
      </div>`;
  }

  return `
    <div class="co-f"><div class="rl-field">
      <label class="rl-field-label">Child object <span class="rl-field-required">*</span>
        ${fd.fieldId ? tag('Fixed after save') : ''}</label>
      <select class="co-input" ${fd.fieldId?'disabled':''} onchange="fdSetRollupChild(this.value)">
        <option value="">Select an object…</option>
        ${children.map(c => `<option value="${c.id}" ${s.child===c.id?'selected':''}>${esc(c.plural)}</option>`).join('')}
      </select>
      ${fErr('child', fd.err)}
    </div></div>

    ${child ? `
      ${lookups.length > 1 ? field('Follow which lookup', true,
        `<select class="co-input" onchange="fd.d.settings.childLookup = this.value; fdRender()">
          ${lookups.map(f => `<option value="${f.id}" ${s.childLookup===f.id?'selected':''}>${esc(f.label)}</option>`).join('')}
        </select>`,
        `${esc(child.label)} points at ${esc(o.label)} ${lookups.length} ways, and they mean different things.`)
      : `<div class="co-prev" style="margin-bottom:16px">
          <span>Follows</span><span class="co-prev-val">${esc(lookups[0] ? lookups[0].label : '—')}</span>
          <span>the only lookup to ${esc(o.label)}.</span>
        </div>`}

      <div class="co-f-row">
        ${field('Function', true, `<select class="co-input" onchange="fd.d.settings.fn = this.value; fdRender()">
          ${['COUNT','SUM','MIN','MAX'].map(fn => `<option value="${fn}" ${s.fn===fn?'selected':''}>${fn}</option>`).join('')}
          <option disabled>AVERAGE — still to decide</option>
        </select>`)}
        ${field(s.fn === 'COUNT' ? 'Field' : 'Field to aggregate', s.fn !== 'COUNT',
          s.fn === 'COUNT'
            ? `<input class="co-input" value="Not needed — COUNT counts records" disabled>`
            : `<select class="co-input" onchange="fd.d.settings.aggField = this.value">
                 <option value="">Select a field…</option>
                 ${aggCandidates.map(f => `<option value="${f.id}" ${s.aggField===f.id?'selected':''}>${esc(f.label)}</option>`).join('')}
               </select>`,
          '', fErr('aggField', fd.err))}
      </div>

      <div class="co-f"><div class="rl-field">
        <label class="rl-field-label">Condition <span style="font-weight:400;text-transform:none">(optional)</span></label>
        <div style="display:flex;gap:8px">
          <select class="co-input" style="flex:1.2" onchange="fd.d.settings.filterField = this.value; fd.d.settings.filterValue=''; fdRender()">
            <option value="">No filter — include every child</option>
            ${filterCandidates.map(f => `<option value="${f.id}" ${s.filterField===f.id?'selected':''}>${esc(f.label)}</option>`).join('')}
          </select>
          ${s.filterField ? `
            <select class="co-input" style="flex:0 0 94px" onchange="fd.d.settings.filterOp = this.value">
              <option value="eq" ${s.filterOp==='eq'?'selected':''}>is</option>
              <option value="neq" ${s.filterOp==='neq'?'selected':''}>is not</option>
            </select>
            ${filterField && filterField.type === 'SELECT'
              ? `<select class="co-input" style="flex:1" onchange="fd.d.settings.filterValue = this.value">
                   <option value="">Select…</option>
                   ${(filterField.settings.options||[]).map(opt => `<option ${s.filterValue===opt.label?'selected':''}>${esc(opt.label)}</option>`).join('')}
                 </select>`
              : `<input class="co-input" style="flex:1" value="${esc(s.filterValue)}" placeholder="Value" oninput="fd.d.settings.filterValue = this.value">`}
          ` : ''}
        </div>
      </div></div>

      <div style="font-size:12px;color:var(--muted-foreground);margin-top:-4px">
        Counts every child, including ones the viewer cannot see. Blanks are skipped.
      </div>
    ` : ''}`;
}

/* ══ Field + object logic (unchanged from the first build) ═════════ */
function odSet(k, v){
  od.d[k] = v;
  delete od.err[k];
  if(k === 'label'){
    /* Plural is no longer a field — it is derived from the label and used
       for list views and as the default related-list title. */
    od.d.plural = pluralise(v);
    if(!od.touchedRecName) od.d.recordNameLabel = v ? v + ' Name' : '';
    const r = document.getElementById('od-recname');
    if(r && !od.touchedRecName){ r.value = od.d.recordNameLabel; r.placeholder = (v||'Sales Order') + ' Name'; }
  }
}

function odNameType(t){
  od.d.recordNameType = t;
  if(t === 'AUTONUMBER' && !od.d.autoFormat){
    const prefix = (od.d.label || 'OB').split(/\s+/).map(w => w[0]||'').join('').toUpperCase().slice(0,3) || 'OB';
    od.d.autoFormat = prefix + '-{000000}';
  }
  odRender();
}

function odPreview(){
  const el = document.getElementById('od-preview');
  if(el) el.textContent = autoPreview(od.d.autoFormat, od.d.autoStart) || '—';
}

function odSave(){
  const d = od.d; od.err = {};
  const label = (d.label||'').trim();
  if(!label) od.err.label = 'Give the object a label.';
  else if(RESERVED.includes(label.toLowerCase()))
    od.err.label = `“${label}” is a Rocketlane object. Pick a label that is not already taken.`;
  else if(state.objects.some(o => o.id !== od.id && o.label.toLowerCase() === label.toLowerCase()))
    od.err.label = `There is already a custom object called “${label}”.`;
  if(!(d.recordNameLabel||'').trim()) od.err.recordNameLabel = 'Give the Record Name a label.';
  if(d.recordNameType === 'AUTONUMBER'){
    if(!/\{0+\}/.test(d.autoFormat||'')) od.err.autoFormat = 'Include a number token, for example {000000}.';
    const o = od.id ? obj(od.id) : null;
    if(o && o.recordNameType === 'AUTONUMBER' && d.autoStart < o.autoStart)
      od.err.autoStart = `Cannot go below ${o.autoStart} — numbers already issued would repeat.`;
  }
  if(Object.keys(od.err).length){ odRender(); return; }

  if(od.id){
    const o = obj(od.id);
    Object.assign(o, {
      label, plural:(d.plural||pluralise(label)).trim(), description:d.description,
      recordNameLabel:d.recordNameLabel.trim(), recordNameType:d.recordNameType,
      autoFormat:d.autoFormat, autoStart:d.autoStart,
      reports:d.reports, fieldHistory:d.fieldHistory, search:d.search,
      updated:'Just now',
    });
    if(d.recordNameType === 'AUTONUMBER' && o.autoNext < d.autoStart) o.autoNext = d.autoStart;
    save(); closeDrawer(); render(); toast(`${label} updated.`);
  }else{
    const o = {
      id: uid('o'), label, plural:(d.plural||pluralise(label)).trim(),
      description:d.description, recordNameLabel:d.recordNameLabel.trim(),
      recordNameType:d.recordNameType, autoFormat:d.autoFormat, autoStart:d.autoStart,
      autoNext:d.autoStart, reports:d.reports, fieldHistory:d.fieldHistory, search:d.search,
      records:0, updated:'Just now', fields:[], rules:[],
    };
    state.objects.push(o);
    seedObjectPermissions(o.id);
    save(); closeDrawer(); go('object', o.id, 'fields');
    toast(`${label} created. Record Name, parent and system fields are in place — add your own fields next.`);
  }
}

function fdSetLabel(v){ fd.d.label = v; delete fd.err.label; }

/* Default settings per type. These are the proposals in A4, not invented
   numbers: 255 for text, 32,000 for multi-line, 2 decimals for currency. */
function defaultSettings(type){
  switch(type){
    case 'TEXT':        return {maxLength:255};
    case 'MULTILINE':   return {maxLength:32000};
    case 'NUMBER':      return {decimals:0};
    case 'CURRENCY':    return {decimals:2};
    case 'PERCENT':     return {decimals:2};
    case 'DATE':        return {dateDefault:'blank'};
    case 'CHECKBOX':    return {checkDefault:false};
    case 'SELECT':
    case 'MULTISELECT': return {options:[{label:'',color:PALETTE[0]}], sort:'entered'};
    case 'USER':        return {userMode:'single', userDefault:'blank'};
    case 'LOOKUP':      return {target:'', relatedListLabel:'', onDelete:'CLEAR', pickerFields:[]};
    case 'FORMULA':     return {returns:'NUMBER', expr:''};
    case 'ROLLUP':      return {child:'', childLookup:'', fn:'SUM', aggField:'', filterField:'', filterOp:'eq', filterValue:''};
    default:            return {};
  }
}

/* presetType opens the drawer on a type the user cannot change — how a
   lookup is created now that relationships have their own entry point. */
function openFieldDrawer(objId, fieldId, presetType){
  const o = obj(objId);
  const f = fieldId ? o.fields.find(x => x.id === fieldId) : null;
  const type = f ? f.type : (presetType || 'TEXT');
  fd = {
    objId, fieldId: fieldId || null,
    preset: !f && presetType ? presetType : null,
    touchedRLL: !!f,
    err:{},
    d: f ? JSON.parse(JSON.stringify(f))
         : {label:'', type, description:'', help:'', required:false, unique:false,
            extId:false, def:'', showInReports:true, settings:defaultSettings(type)},
  };
  if(!f && type === 'LOOKUP') fd.d.settings.relatedListLabel = o.plural;
  fdRender();
}

/* Field type, as a dropdown beside the name — the form every other
   custom field in Rocketlane uses. Lookup is absent on purpose: a
   relationship is created from the Relationships tab. */
function fdTypeOptions(){
  return Object.entries(TYPES).filter(([k, t]) =>
    (t.group !== 'later' && k !== 'LOOKUP') || k === fd.d.type);
}
function openTypeMenu(ev){
  ev.stopPropagation();
  closeMenu(); closeFieldPicker(); closeTypeMenu();
  const r = ev.currentTarget.getBoundingClientRect();
  const el = document.createElement('div');
  el.id = 'tp-menu'; el.className = 'co-dd';
  el.innerHTML = fdTypeOptions().map(([k, t]) => `
    <button class="co-dd-i${fd.d.type === k ? ' on' : ''}" onclick="pickType('${k}')">
      ${typeIcon(k)}<span class="co-dd-l">${esc(t.label)}</span>
      ${fd.d.type === k ? `<span class="co-dd-check">${ICO.check}</span>` : ''}
    </button>`).join('');
  document.body.appendChild(el);
  el.style.width = Math.max(r.width, 240) + 'px';
  el.style.left = r.left + 'px';
  el.style.top = Math.min(r.bottom + 4, window.innerHeight - el.offsetHeight - 10) + 'px';
}
function closeTypeMenu(){ const el = document.getElementById('tp-menu'); if(el) el.remove(); }
document.addEventListener('click', e => {
  const el = document.getElementById('tp-menu');
  if(el && !el.contains(e.target)) closeTypeMenu();
}, true);
function pickType(k){
  closeTypeMenu();
  if(fd.d.type === k) return;
  fd.d.type = k;
  fd.d.settings = defaultSettings(k);
  fd.d.def = '';
  fdRender();
}

function fdRender(){ fdRenderForm(); }



function fdAddOption(){ fd.d.settings.options.push({label:'', color:PALETTE[fd.d.settings.options.length % PALETTE.length]}); delete fd.err.options; fdRender(); }
function fdRemoveOption(i){
  const opts = fd.d.settings.options;
  if(fd.d.def === opts[i].label) fd.d.def = '';
  opts.splice(i,1); if(!opts.length) opts.push({label:'', color:PALETTE[0]});
  fdRender();
}

function fdCycleColour(i){
  const opt = fd.d.settings.options[i];
  opt.color = PALETTE[(PALETTE.indexOf(opt.color) + 1) % PALETTE.length];
  fdRender();
}

/* ── Lookup ───────────────────────────────────────────────────────── */
function targetFieldLabels(target){
  if(target === 'ACCOUNT') return ['Account Owner','Region','Industry','Created at'];
  if(target === 'PROJECT') return ['Customer','Project Owner','Status','Start date','Created at'];
  const t = obj(target); if(!t) return [];
  return [...t.fields.filter(f => f.type !== 'ROLLUP').map(f => f.label), 'Created at'];
}

function fdSetTarget(v){
  fd.d.settings.target = v;
  fd.d.settings.pickerFields = v
    ? targetFieldLabels(v).filter(x => ['Account','Project','Customer','Created at'].includes(x)).slice(0,2)
    : [];
  if(!fd.touchedRLL) fd.d.settings.relatedListLabel = obj(fd.objId).plural;
  delete fd.err.target;
  fdRender();
}

function fdTogglePicker(label){
  const arr = fd.d.settings.pickerFields || (fd.d.settings.pickerFields = []);
  const i = arr.indexOf(label);
  if(i >= 0) arr.splice(i,1); else if(arr.length < 3) arr.push(label);
  fdRender();
}


function fdSetRollupChild(v){
  const s = fd.d.settings;
  s.child = v; s.aggField = ''; s.filterField = ''; s.filterValue = '';
  const c = obj(v);
  const lookups = c ? c.fields.filter(f => f.type === 'LOOKUP' && f.settings.target === fd.objId) : [];
  s.childLookup = lookups.length ? lookups[0].id : '';
  delete fd.err.child;
  fdRender();
}

/* ── Save a field ─────────────────────────────────────────────────── */
function fdSave(){
  const o = obj(fd.objId), d = fd.d; fd.err = {};
  const label = (d.label||'').trim();
  if(!label) fd.err.label = 'Give the field a label.';
  else if(o.fields.some(f => f.id !== fd.fieldId && f.label.toLowerCase() === label.toLowerCase()))
    fd.err.label = `${o.label} already has a field called “${label}”.`;
  else if(label.toLowerCase() === o.recordNameLabel.toLowerCase())
    fd.err.label = `“${label}” is the Record Name field on ${o.label}.`;

  if(d.type === 'LOOKUP' && !d.settings.target) fd.err.target = 'Choose what this points at.';
  if(d.type === 'ROLLUP'){
    if(!d.settings.child) fd.err.child = 'Choose the object to aggregate.';
    else if(d.settings.fn !== 'COUNT' && !d.settings.aggField) fd.err.aggField = 'Choose the field to aggregate.';
  }
  if(d.type === 'FORMULA' && !(d.settings.expr||'').trim()) fd.err.expr = 'Write the expression.';
  if((d.type === 'SELECT' || d.type === 'MULTISELECT') && !(d.settings.options||[]).some(x => x.label.trim()))
    fd.err.options = 'Add at least one value.';

  if(Object.keys(fd.err).length){ fdRender(); return; }

  if(d.type === 'SELECT' || d.type === 'MULTISELECT')
    d.settings.options = d.settings.options.filter(x => x.label.trim());
  d.label = label;

  if(fd.fieldId){
    const i = o.fields.findIndex(f => f.id === fd.fieldId);
    o.fields[i] = Object.assign({}, o.fields[i], d);
    toast(`${label} updated.`);
  }else{
    d.id = uid('f');
    o.fields.push(d);
    if(d.type === 'LOOKUP'){
      /* The lookup is a field, so Fields is where it appears. Land there
         rather than leaving the Relationships tab showing nothing new. */
      route.tab = 'fields';
      toast(`${label} created. ${targetLabel(d.settings.target)} records now show a “${d.settings.relatedListLabel}” related list.`);
    }else{
      toast(`${label} created and available in records, reports, automations and the API.`);
    }
  }
  o.updated = 'Just now';
  save(); closeDrawer(); render();
}

/* ══ Menus ══════════════════════════════════════════════════════════ */
let menuEl = null;
function closeMenu(){ if(menuEl){ menuEl.remove(); menuEl = null; } }
document.addEventListener('click', e => { if(menuEl && !menuEl.contains(e.target)) closeMenu(); }, true);

function showMenu(ev, items){
  ev.stopPropagation(); closeMenu();
  const el = document.createElement('div');
  el.className = 'co-menu';
  el.innerHTML = items.map(i => i === '-' ? '<div class="co-menu-sep"></div>'
    : `<button class="co-menu-i${i.danger?' danger':''}" ${i.disabled?'disabled':''} ${i.title?`title="${esc(i.title)}"`:''}>${esc(i.label)}</button>`).join('');
  document.body.appendChild(el);
  const r = ev.currentTarget.getBoundingClientRect();
  el.style.top = Math.min(r.bottom + 4, window.innerHeight - el.offsetHeight - 10) + 'px';
  el.style.left = Math.max(10, r.right - el.offsetWidth) + 'px';
  let n = 0;
  items.forEach(i => { if(i === '-') return;
    const btn = el.querySelectorAll('.co-menu-i')[n++];
    if(!i.disabled) btn.onclick = () => { closeMenu(); i.fn(); };
  });
  menuEl = el;
}
function fieldMenu(ev, objId, fieldId){
  showMenu(ev, [
    {label:'Edit field', fn:()=>openFieldDrawer(objId, fieldId)},
    '-',
    {label:'Delete field', danger:true, fn:()=>confirmDeleteField(objId, fieldId)},
  ]);
}
function pageMenu(ev){
  showMenu(ev, [
    {label:'Restore sample data', fn:resetData},
    {label:'Remove every object', danger:true, fn:clearData},
  ]);
}
function objectMenu(ev, id){
  const blockers = incoming(id);
  showMenu(ev, [
    {label:'Open', fn:()=>go('object', id, 'fields')},
    {label:'Add field', fn:()=>{ go('object', id, 'fields'); openFieldDrawer(id); }},
    {label:'Edit object', fn:()=>openObjectDrawer(id)},
    '-',
    {label: blockers.length ? `Delete — blocked by ${blockers.length} lookup${blockers.length>1?'s':''}` : 'Delete object',
     danger:true, disabled:!!blockers.length,
     title: blockers.length ? blockers.map(b => `${b.obj.label}.${b.field.label}`).join(', ') : '',
     fn:()=>confirmDeleteObject(id)},
  ]);
}

/* ══ Confirm dialogs ════════════════════════════════════════════════ */
function dialog({title, body, confirm, danger, onConfirm, blocked}){
  document.getElementById('dialog-host').innerHTML = `
    <div class="sc-dialog-overlay" onclick="if(event.target===this) closeDialog()">
      <div class="sc-dialog" role="dialog" aria-modal="true">
        <div class="sc-dialog-header">
          <div class="sc-dialog-title">${title}</div>
          <div class="sc-dialog-desc">${body}</div>
        </div>
        <div class="sc-dialog-footer">
          <button class="rl-btn v-outline sz-md" onclick="closeDialog()"><span class="rl-btn-label">${blocked ? 'Close' : 'Cancel'}</span></button>
          ${blocked ? '' : `<button class="rl-btn ${danger?'v-danger':'v-primary'} sz-md" id="dlg-ok"><span class="rl-btn-label">${confirm}</span></button>`}
        </div>
      </div>
    </div>`;
  const ok = document.getElementById('dlg-ok');
  if(ok) ok.onclick = () => { closeDialog(); onConfirm(); };
}
function closeDialog(){ document.getElementById('dialog-host').innerHTML = ''; }

/* A field delete has to say what it would break first. Formulas and
   roll-ups that read the field block it outright. */
function confirmDeleteField(objId, fieldId){
  const o = obj(objId), f = o.fields.find(x => x.id === fieldId);
  const used = usages(o, f);
  if(used.length){
    dialog({
      title:`“${esc(f.label)}” is in use`,
      body:`Something is reading this field, so deleting it would break:<br><br>
        ${used.map(u => `• ${esc(u)}`).join('<br>')}<br><br>
        Remove those first, then delete the field.`,
      blocked:true,
    });
    return;
  }
  const inbound = f.type === 'LOOKUP' ? `<br><br>The <b>${esc(f.settings.relatedListLabel)}</b> related list on
    ${esc(targetLabel(f.settings.target))} records goes with it.` : '';
  dialog({
    title:`Delete “${esc(f.label)}”?`,
    body:`The field and its values on all ${o.records.toLocaleString()} ${esc(o.plural.toLowerCase())} are removed.
      Check first whether reports, automations, layouts or validation rules use it.${inbound}`,
    confirm:'Delete field', danger:true,
    onConfirm(){
      o.fields = o.fields.filter(x => x.id !== fieldId);
      o.updated = 'Just now'; save(); render(); toast(`${f.label} deleted.`);
    },
  });
}

function confirmDeleteObject(id){
  const o = obj(id), blockers = incoming(id);
  if(blockers.length){
    dialog({
      title:`${esc(o.label)} cannot be deleted yet`,
      body:`These lookups point at it:<br><br>
        ${blockers.map(b => `• <b>${esc(b.field.label)}</b> on ${esc(b.obj.label)}${b.field.required?' (required)':''}`).join('<br>')}<br><br>
        Remove them first. This is the same protection “block the delete” gives a single record, applied to the object.`,
      blocked:true,
    });
    return;
  }
  dialog({
    title:`Delete ${esc(o.label)}?`,
    body:`${o.records.toLocaleString()} records, ${o.fields.length} fields and every view, report column and
      automation that refers to them are removed. This cannot be undone.`,
    confirm:`Delete ${esc(o.label)}`, danger:true,
    onConfirm(){
      state.objects = state.objects.filter(x => x.id !== id);
      state.permSets.forEach(ps => { delete ps.objects[id]; });
      save(); go('list'); toast(`${o.label} deleted.`);
    },
  });
}

/* ══ Go ═════════════════════════════════════════════════════════════ */
render();
</script>
