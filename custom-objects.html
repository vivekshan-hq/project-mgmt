<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Custom objects · Settings</title>

<!-- The design system, in the order the kit requires: tokens and the shadcn
     primitives first, then the Rocketlane product layer on top of them. -->
<link rel="stylesheet" href="ds/styles.css">
<link rel="stylesheet" href="ds/rocketlane.css">

<style>
/* ──────────────────────────────────────────────────────────────
   Custom objects — Settings › Advanced

   Built to match the real Settings screen (the "Time entry fields"
   page), not the design system's app-shell: the shipping product's
   Settings has a 56px rail, a ~300px settings sidebar and a plain
   white content area. The kit models a different shell — a 60px rail
   on a tinted canvas with the page as a floating card — and has no
   settings sidebar at all, so that part is built here.

   Everything the kit DOES cover is still the kit: tokens, .rl-btn,
   .rl-drawer-*, .rl-field, .rl-section, .sc-check, and the tag colour
   palette. Page-local names are --co-* / .co-* so they can never
   shadow a design system token.
   ────────────────────────────────────────────────────────────── */
:root{
  --co-blue:#0F62FE;             /* the product's accent — toggles, active nav, links */
  --co-nav-active:#EDF2F9;
  --co-rail-hover:#F1F3F7;
  --co-border:#E6E8EC;
  --co-border-soft:#EFF1F4;
  --co-band:#F8F9FB;             /* section band behind "General information" */
  --co-thead:#F1F5FA;            /* column header row */
  --co-check-off:#D7DAE0;
  --co-check-on:#C3C7CF;
}
html, body {
  margin:0; height:100%; overflow:hidden;
  background:var(--background); color:var(--foreground);
  font-family:var(--font-sans); font-size:14px;
}
*,*::before,*::after{ box-sizing:border-box; }
button{ font-family:inherit; border:none; background:transparent; color:inherit; cursor:pointer; padding:0; }
a{ color:inherit; text-decoration:none; }
.hidden{ display:none !important; }

/* ══ Shell ══ */
.co-shell{ display:flex; height:100vh; overflow:hidden; }

/* ── Rail: 56px, white, dark icons. Active item is a soft grey square. ── */
.co-rail{
  width:56px; flex-shrink:0; background:var(--background);
  border-right:1px solid var(--co-border-soft);
  display:flex; flex-direction:column; align-items:center;
  padding:10px 0 12px; gap:2px; overflow:visible;
}
.co-rail-logo{
  width:30px; height:30px; border-radius:8px; background:var(--co-blue);
  color:#fff; display:grid; place-items:center; font-size:13px; font-weight:700;
  flex-shrink:0; margin-bottom:4px;
}
.co-rail-i{
  width:34px; height:34px; border-radius:8px; display:grid; place-items:center;
  color:#4A5260; flex-shrink:0; position:relative;
}
.co-rail-i:hover{ background:var(--co-rail-hover); }
.co-rail-i.on{ background:var(--co-rail-hover); color:#111827; }
.co-rail-i svg{ width:19px; height:19px; }
.co-rail-sp{ flex:1; }
.co-rail-dot{
  position:absolute; top:6px; right:7px; width:7px; height:7px;
  border-radius:50%; background:#E5484D; border:1.5px solid var(--background);
}
.co-rail-badge{
  position:absolute; top:3px; right:3px; min-width:16px; height:16px; padding:0 4px;
  border-radius:8px; background:#E5484D; color:#fff; font-size:10px; font-weight:600;
  display:grid; place-items:center; border:1.5px solid var(--background);
}
.co-rail-av{
  width:30px; height:30px; border-radius:50%; background:var(--co-blue); color:#fff;
  font-size:11px; font-weight:600; display:grid; place-items:center; flex-shrink:0;
}

/* ── Settings sidebar ── */
.co-side{
  width:300px; flex-shrink:0; background:var(--background);
  border-right:1px solid var(--co-border); display:flex; flex-direction:column;
  overflow-y:auto;
}
.co-side-title{ padding:20px 20px 14px; font-size:22px; font-weight:600; letter-spacing:-0.015em; }
.co-side-search{ padding:0 20px 12px; }
.co-nav{ padding:0 12px; }
.co-nav-i{
  display:flex; align-items:center; gap:10px; width:100%;
  padding:7px 8px; border-radius:8px; font-size:14px; color:#2B313B;
  text-align:left; margin-bottom:1px; line-height:1.35;
}
.co-nav-i:hover{ background:var(--co-rail-hover); }
.co-nav-i.on{ background:var(--co-nav-active); color:#11325E; font-weight:500; }
.co-nav-i.on .co-nav-arrow{ opacity:1; }
.co-nav-ico{
  width:24px; height:24px; border-radius:6px; display:grid; place-items:center;
  flex-shrink:0; font-size:12px; line-height:1;
}
.co-nav-ico svg{ width:14px; height:14px; }
.co-nav-arrow{ margin-left:auto; opacity:0; color:#5B6472; flex-shrink:0; }
.co-nav-arrow svg{ width:14px; height:14px; }
.co-nav-label{ padding:16px 20px 6px; font-size:13px; font-weight:600; color:#6B7280; }
.co-side-div{ height:1px; background:var(--co-border-soft); margin:12px 20px; }

/* ── Content ── */
.co-main{ flex:1; min-width:0; display:flex; flex-direction:column; overflow:hidden; background:var(--background); }
.co-head{ padding:20px 28px 16px; flex-shrink:0; border-bottom:1px solid var(--co-border-soft); }
.co-crumb{ display:flex; align-items:center; gap:6px; font-size:13px; color:#6B7280; margin-bottom:8px; }
.co-crumb a{ color:var(--co-blue); cursor:pointer; }
.co-crumb a:hover{ text-decoration:underline; text-underline-offset:3px; }
.co-title{ display:flex; align-items:center; gap:10px; font-size:21px; font-weight:600; letter-spacing:-0.015em; min-width:0; }
.co-title > svg{ width:19px; height:19px; color:#5B6472; flex-shrink:0; }
.co-desc{ font-size:13.5px; color:var(--muted-foreground); line-height:1.5; margin-top:6px; max-width:860px; }
.co-scroll{ flex:1; overflow-y:auto; padding:18px 28px 48px; }
.co-actions{ display:flex; justify-content:flex-end; gap:10px; margin-bottom:16px; }

/* Tabs — the 2px underline tab from the kit */
.co-tabs{ display:flex; gap:0; margin:14px -12px -17px; }
.co-tab{
  position:relative; padding:0 12px; height:38px; font-size:14px;
  color:var(--muted-foreground); display:inline-flex; align-items:center; gap:7px; white-space:nowrap;
}
.co-tab:hover:not(:disabled){ color:var(--foreground); }
.co-tab.on{ color:var(--co-blue); font-weight:500; }
.co-tab.on::after{ content:''; position:absolute; left:10px; right:10px; bottom:0; height:2px; background:var(--co-blue); }
.co-tab:disabled{ opacity:.45; cursor:not-allowed; }

/* ══ Card + table — the "Time entry fields" pattern ══ */
.co-card{ border:1px solid var(--co-border); border-radius:10px; overflow:hidden; background:var(--background); margin-bottom:18px; }
.co-band{
  display:flex; align-items:center; gap:10px; padding:13px 20px;
  background:var(--co-band); border-bottom:1px solid var(--co-border);
}
.co-band-t{ font-size:15px; font-weight:500; }
.co-band-n{ margin-left:auto; font-size:13.5px; color:var(--muted-foreground); font-variant-numeric:tabular-nums; }
.co-band-d{ font-size:12.5px; color:var(--muted-foreground); line-height:1.55; padding:11px 20px; background:var(--co-band); border-bottom:1px solid var(--co-border); }

.co-table{ width:100%; border-collapse:separate; border-spacing:0; font-size:14px; }
.co-table thead th{
  background:var(--co-thead); border-bottom:1px solid var(--co-border);
  padding:0 12px; height:40px; text-align:left;
  font-size:13px; font-weight:600; color:#2B313B; white-space:nowrap;
}
.co-table tbody td{ padding:9px 12px; border-bottom:1px solid var(--co-border-soft); vertical-align:middle; }
.co-table tbody tr:last-child td{ border-bottom:0; }
.co-table tbody tr.is-clickable{ cursor:pointer; }
.co-table tbody tr.is-clickable:hover td{ background:#FAFBFC; }
.co-table .col-grip{ width:34px; padding-left:16px; padding-right:0; }
.co-table .col-menu{ width:44px; text-align:right; padding-right:14px; }
.co-table .num{ text-align:right; font-variant-numeric:tabular-nums; }
.co-grip{ color:#B6BAC2; font-size:13px; cursor:grab; user-select:none; }
.co-fname{ font-weight:400; }

/* Field-type cell: a line icon plus the type name, as the product shows it. */
.co-type{ display:inline-flex; align-items:center; gap:8px; color:var(--foreground); }
.co-type-ico{ width:17px; height:17px; flex-shrink:0; color:#7B818C; display:grid; place-items:center;
  font-family:var(--font-mono); font-size:10px; font-weight:600; }
.co-type-ico svg{ width:15px; height:15px; }

/* The product's settings tags are rounded rectangles, not the kit's
   999px pills — colours still come from the kit's tag palette. */
.co-tag{
  display:inline-flex; align-items:center; gap:5px;
  padding:3px 9px; border-radius:6px; font-size:12.5px; font-weight:500;
  line-height:1.35; white-space:nowrap;
  background:var(--tag-bg-gray); color:var(--tag-fg-gray);
}
.co-tag.c-blue{ background:var(--tag-bg-blue); color:var(--tag-fg-blue); }
.co-tag.c-teal{ background:var(--tag-bg-teal); color:var(--tag-fg-teal); }
.co-tag.c-green{ background:var(--tag-bg-green); color:var(--tag-fg-green); }
.co-tag.c-yellow{ background:var(--tag-bg-yellow); color:var(--tag-fg-yellow); }
.co-tag.c-orange{ background:var(--tag-bg-orange); color:var(--tag-fg-orange); }
.co-tag.c-purple{ background:var(--tag-bg-purple); color:var(--tag-fg-purple); }
.co-tag.c-pink{ background:var(--tag-bg-pink); color:var(--tag-fg-pink); }
.co-tag.c-red{ background:var(--tag-bg-red); color:var(--tag-fg-red); }
.co-tag.sm{ padding:2px 7px; font-size:11.5px; }
.co-tag.mono{ font-family:var(--font-mono); font-size:11.5px; }
button.co-tag{ cursor:pointer; }
button.co-tag:hover{ filter:brightness(0.97); }

/* Read-only mandatory indicator, matching the product's muted checkbox. */
.co-box{
  width:16px; height:16px; border-radius:4px; border:1px solid var(--co-check-off);
  background:var(--background); display:inline-grid; place-items:center;
}
.co-box.on{ background:var(--co-check-on); border-color:var(--co-check-on); }
.co-box svg{ width:11px; height:11px; color:#fff; }

/* The product's toggle is blue, where the kit's switch is near-black. */
.sc-switch--on{ background:var(--co-blue); }

.co-menu-btn{ width:28px; height:28px; border-radius:7px; display:inline-grid; place-items:center; color:#7B818C; }
.co-menu-btn:hover{ background:var(--co-rail-hover); color:var(--foreground); }
.co-menu-btn svg{ width:15px; height:15px; }

/* ══ Native controls, to the kit's FieldShell spec ══
   FieldShell starts with `all: unset`, which strips a native <input> of
   what we need, so this mirrors its visual spec — 32px, 1px border,
   --radius-md, 14px, primary focus ring. Keep the two in step. */
.co-input{
  display:block; width:100%; height:32px; padding:0 10px;
  background:var(--card); color:var(--foreground);
  border:1px solid var(--border); border-radius:var(--radius-md);
  font-family:inherit; font-size:14px; line-height:1; outline:none;
  transition:border-color 120ms ease, box-shadow 120ms ease;
}
.co-input::placeholder{ color:var(--muted-foreground); }
.co-input:hover:not(:disabled):not(:focus){ border-color:color-mix(in oklab, var(--primary) 25%, var(--border)); }
.co-input:focus{ border-color:var(--co-blue); box-shadow:0 0 0 3px color-mix(in oklab, var(--co-blue) 15%, transparent); }
.co-input:disabled{ opacity:.55; cursor:not-allowed; background:color-mix(in oklab, var(--muted) 40%, var(--card)); }
textarea.co-input{ height:auto; min-height:64px; padding:7px 10px; line-height:1.5; resize:vertical; }
select.co-input{
  cursor:pointer; appearance:none; padding-right:30px;
  background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='%23717179' stroke-width='2'><path d='M6 9l6 6 6-6'/></svg>");
  background-repeat:no-repeat; background-position:right 9px center; background-size:14px;
}
.co-search{ height:38px; border-radius:8px; font-size:14px; }
.co-mono{ font-family:var(--font-mono); }

/* ══ Bits the kit has no component for ══ */
.co-sec{ display:flex; align-items:center; gap:10px; margin:22px 0 10px; }
.co-sec:first-child{ margin-top:0; }
.co-sec-t{ font-size:11px; font-weight:600; letter-spacing:.06em; text-transform:uppercase; color:var(--muted-foreground); }
.co-sec-line{ flex:1; height:1px; background:var(--border); }

.co-empty{ border:1px dashed var(--co-border); border-radius:10px; padding:48px 28px; text-align:center; background:var(--co-band); }
.co-empty-t{ font-size:15px; font-weight:600; margin-bottom:6px; }
.co-empty-d{ font-size:14px; color:var(--muted-foreground); line-height:1.55; max-width:460px; margin:0 auto 18px; }

.co-note{
  display:flex; gap:10px; padding:11px 13px; border-radius:8px;
  font-size:13px; line-height:1.55; border:1px solid var(--co-border);
  background:var(--co-band); color:var(--muted-foreground);
  margin-bottom:16px; max-width:940px;
}
.co-note b{ color:var(--foreground); font-weight:600; }
.co-note.warn{ background:var(--tag-bg-yellow); border-color:color-mix(in oklab, var(--tag-fg-yellow) 25%, transparent); color:var(--tag-fg-yellow); }
.co-note.warn b{ color:var(--tag-fg-yellow); }
.co-note-ico{ flex-shrink:0; width:16px; height:16px; margin-top:1px; }
.co-note-ico svg{ width:16px; height:16px; display:block; }

.co-f{ margin-bottom:16px; }
.co-f-row{ display:flex; gap:12px; }
.co-f-row > .co-f{ flex:1; min-width:0; }
.rl-field-hint{ margin-top:5px; }
.co-err{ font-size:11px; color:var(--tag-fg-red); line-height:1.35; margin-top:5px; display:flex; align-items:center; gap:4px; }
.co-err svg{ width:12px; height:12px; flex-shrink:0; }

.co-cards{ display:flex; gap:10px; }
.co-card-opt{
  flex:1; text-align:left; font-family:inherit; cursor:pointer;
  border:1px solid var(--border); border-radius:var(--radius-md);
  padding:10px 12px; background:var(--card);
  transition:border-color 120ms ease, background 120ms ease, box-shadow 120ms ease;
}
.co-card-opt:hover:not(:disabled){ border-color:color-mix(in oklab, var(--co-blue) 35%, var(--border)); }
.co-card-opt.sel{ border-color:var(--co-blue); box-shadow:0 0 0 3px color-mix(in oklab, var(--co-blue) 15%, transparent); }
.co-card-opt:disabled{ cursor:not-allowed; opacity:.7; background:var(--co-band); }
.co-card-t{ font-size:14px; font-weight:500; display:flex; align-items:center; gap:6px; flex-wrap:wrap; }
.co-card-d{ font-size:12px; color:var(--muted-foreground); line-height:1.5; margin-top:4px; }

.co-seg{ display:inline-flex; align-items:center; background:var(--muted); border-radius:var(--radius-md); padding:2px; }
.co-seg button{ height:26px; padding:0 12px; border-radius:calc(var(--radius-md) - 2px); font-size:13px; font-weight:500; color:var(--muted-foreground); }
.co-seg button:hover{ color:var(--foreground); }
.co-seg button.active{ background:var(--background); color:var(--foreground); box-shadow:var(--shadow-xs); }

.co-check{ display:flex; align-items:flex-start; gap:9px; padding:9px 0; cursor:pointer; }
.co-check + .co-check, .co-sw + .co-sw, .co-check + .co-sw, .co-sw + .co-check{ border-top:1px solid var(--border); }
.co-check .sc-check{ margin-top:1px; flex-shrink:0; }
.co-sw{ display:flex; align-items:flex-start; gap:12px; padding:10px 0; }
.co-sw .sc-switch{ flex-shrink:0; margin-top:1px; }
.co-ctl-t{ font-size:14px; font-weight:500; display:flex; align-items:center; gap:6px; flex-wrap:wrap; }
.co-ctl-d{ font-size:12px; color:var(--muted-foreground); line-height:1.5; margin-top:3px; }
.co-check.locked{ cursor:default; }

.co-prev{
  display:flex; align-items:center; gap:10px; background:var(--co-band);
  border:1px solid var(--co-border); border-radius:8px; padding:9px 11px;
  font-size:12.5px; color:var(--muted-foreground);
}
.co-prev-val{
  font-family:var(--font-mono); font-size:13px; color:var(--foreground);
  background:var(--background); border:1px solid var(--co-border);
  border-radius:5px; padding:2px 7px;
}

.co-tp-grid{ display:grid; grid-template-columns:repeat(3, 1fr); gap:7px; }
.co-tp{
  display:flex; align-items:center; gap:9px; text-align:left; font-family:inherit;
  padding:7px 10px; border:1px solid var(--border); border-radius:var(--radius-md);
  background:var(--card); cursor:pointer; transition:border-color 120ms ease, background 120ms ease;
}
.co-tp:hover:not(:disabled){ border-color:color-mix(in oklab, var(--co-blue) 35%, var(--border)); background:var(--co-band); }
.co-tp:disabled{ cursor:not-allowed; opacity:.6; background:var(--co-band); }
.co-tp-t{ font-size:13.5px; font-weight:500; display:flex; align-items:center; gap:5px; min-width:0; }

.co-pl{ display:flex; align-items:center; gap:8px; margin-bottom:6px; }
.co-pl-grip{ color:#B6BAC2; font-size:13px; width:12px; text-align:center; flex-shrink:0; cursor:grab; }
.co-pl-sw{ width:28px; height:28px; border-radius:6px; border:1px solid rgba(0,0,0,.08); flex-shrink:0; cursor:pointer; }

.co-map{ display:flex; flex-direction:column; }
.co-map-row{ display:flex; align-items:center; gap:10px; padding:7px 0; flex-wrap:wrap; }
.co-node{
  display:inline-flex; align-items:center; gap:8px; border:1px solid var(--co-border);
  border-radius:8px; padding:6px 11px; background:var(--background);
  font-size:13.5px; font-weight:500; box-shadow:var(--shadow-xs);
}
.co-node.me{ border-color:color-mix(in oklab, var(--co-blue) 35%, var(--co-border)); background:var(--co-nav-active); color:#11325E; }
.co-node.sys{ background:var(--co-band); color:var(--muted-foreground); font-weight:400; box-shadow:none; }
.co-conn{ display:inline-flex; align-items:center; gap:7px; font-size:11.5px; color:var(--muted-foreground); font-family:var(--font-mono); }
.co-line{ width:26px; height:1px; background:var(--co-border); position:relative; }
.co-line::after{ content:''; position:absolute; right:0; top:-3px; border-left:5px solid var(--co-border); border-top:3.5px solid transparent; border-bottom:3.5px solid transparent; }

.co-rel-head{ display:flex; align-items:center; gap:9px; }
.co-rel-t{ flex:1; min-width:0; font-size:14px; font-weight:500; }
.co-rel-meta{ font-size:12.5px; color:var(--muted-foreground); line-height:1.65; }
.co-rel-empty{ font-size:13.5px; color:var(--muted-foreground); padding:14px 0; }
.rl-section + .rl-section{ margin-top:9px; }

.co-menu{
  position:absolute; min-width:200px; padding:6px; background:var(--popover);
  border:1px solid var(--co-border); border-radius:10px;
  box-shadow:0 10px 32px rgba(0,0,0,0.08), 0 2px 6px rgba(0,0,0,0.04); z-index:300;
}
.co-menu-i{ display:flex; align-items:center; gap:10px; width:100%; height:32px; padding:0 10px; border-radius:7px; font-size:14px; text-align:left; white-space:nowrap; }
.co-menu-i:hover:not(:disabled){ background:var(--co-rail-hover); }
.co-menu-i.danger{ color:var(--tag-fg-red); }
.co-menu-i.danger:hover{ background:var(--tag-bg-red); }
.co-menu-i:disabled{ color:var(--muted-foreground); cursor:not-allowed; }
.co-menu-sep{ height:1px; background:var(--co-border); margin:4px 2px; }

.co-toast{
  position:fixed; bottom:22px; left:50%; transform:translateX(-50%) translateY(10px);
  background:var(--foreground); color:var(--background); font-size:13.5px;
  padding:10px 16px; border-radius:8px; box-shadow:0 8px 24px rgba(0,0,0,.25);
  opacity:0; pointer-events:none; transition:opacity .16s, transform .16s; z-index:500; max-width:460px;
}
.co-toast.on{ opacity:1; transform:translateX(-50%) translateY(0); }

/* The shadcn dialog ships z-index:50, below the kit's drawer at 100. */
.sc-dialog-overlay{ z-index:400; }
.sc-dialog{ max-width:460px; }
</style>
</head>
<body>

<div class="co-shell">

  <!-- ══ Rail ══ -->
  <aside class="co-rail">
    <div class="co-rail-logo">A</div>
    <button class="co-rail-i"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 4h7v7H4zM13 4h7v7h-7zM4 13h7v7H4zM13 13h7v7h-7z"/></svg></button>

let state = load();

function load(){
  try{
    const raw = localStorage.getItem(STORE_KEY);
    if(!raw) return seed();
    const s = JSON.parse(raw);
    return (s && Array.isArray(s.objects)) ? s : seed();
  }catch(e){ return seed(); }
}
function save(){ try{ localStorage.setItem(STORE_KEY, JSON.stringify(state)); }catch(e){} }
function resetData(){ state = seed(); save(); route = {view:'list', id:null, tab:'fields'}; render(); toast('Sample data restored.'); }
function clearData(){ state = {objects:[]}; save(); route = {view:'list', id:null, tab:'fields'}; render(); toast('All custom objects removed.'); }

/* ── Helpers ──────────────────────────────────────────────────────── */
const esc = s => String(s==null?'':s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const obj = id => state.objects.find(o => o.id === id);
const uid = p => p + '_' + Math.random().toString(36).slice(2,8);

function pluralise(l){
  const s = String(l||'').trim(); if(!s) return '';
  if(/(s|x|z|ch|sh)$/i.test(s)) return s + 'es';
  if(/[^aeiou]y$/i.test(s)) return s.slice(0,-1) + 'ies';
  return s + 's';
}
/* SO-{0000000} + 1043 → SO-0001043. The token's zeros set the minimum
   width; the number is free to grow past it. */
function autoPreview(fmt, n){
  const m = String(fmt||'').match(/\{(0+)\}/);
  if(!m) return null;
  const digits = m[1].length;
  return String(fmt).replace(m[0], String(n).padStart(digits,'0'));
}
function toast(msg){
  const t = document.getElementById('toast');
  t.textContent = msg; t.classList.add('on');
  clearTimeout(toast._t); toast._t = setTimeout(()=>t.classList.remove('on'), 2600);
}

  return `<span class="co-type-ico">${g}</span>`;

/* The product's "Value Assignment" column, mapped onto what this feature
   actually defines: a formula or a roll-up computes its own value, and
   everything else is typed in. */
function valueAssignment(f){
  if(f.type === 'FORMULA') return tag('Formula', 'teal');
  if(f.type === 'ROLLUP')  return tag('Roll-up', 'pink');
  return tag('Manual input', 'blue');
}

/* Lookup targets can be another custom object or a default object. */
function targetLabel(t){
  if(t === 'ACCOUNT') return 'Account';
  if(t === 'PROJECT') return 'Project';
  const o = obj(t); return o ? o.label : t;
}
function targetPlural(t){
  if(t === 'ACCOUNT') return 'Accounts';
  if(t === 'PROJECT') return 'Projects';
  const o = obj(t); return o ? o.plural : t;
}
/* Every lookup on any object that points at `id` — i.e. the related lists
   that appear on this object, and what blocks its deletion. */
function incoming(id){
  const out = [];
  state.objects.forEach(o => o.fields.forEach(f => {
    if(f.type === 'LOOKUP' && f.settings.target === id) out.push({obj:o, field:f});
  }));
  return out;
}
/* Where a field is referenced, so a delete can say what it would break. */
function usages(o, f){
  const out = [];
  o.fields.forEach(g => {
    if(g.id === f.id) return;
    if(g.type === 'FORMULA' && g.settings.expr && g.settings.expr.includes('{' + f.label + '}')) out.push(`Formula field "${g.label}"`);
    if(g.type === 'ROLLUP' && g.settings.childLookup === f.id) out.push(`Roll-up field "${g.label}"`);
  });
  state.objects.forEach(p => p.fields.forEach(g => {
    if(g.type === 'ROLLUP' && g.settings.child === o.id && (g.settings.aggField === f.id || g.settings.filterField === f.id))
      out.push(`Roll-up "${g.label}" on ${p.label}`);
  }));
  return out;
}
function systemFields(o){
  /* `supplied` marks the two a person actually fills in. The rest are
     written by Rocketlane, so the mandatory column stays empty for them. */
  const parent = o.level === 'GLOBAL' ? null
    : {label:o.level === 'ACCOUNT' ? 'Account' : 'Project', type:'LOOKUP', supplied:true,
       note:'Required lookup, created from the object\u2019s level.'};
  const rows = [
    {label:o.recordNameLabel, type:o.recordNameType === 'AUTONUMBER' ? 'AUTONUMBER' : 'TEXT',
     supplied:o.recordNameType !== 'AUTONUMBER',
     note:'Record Name. Always present and cannot be deleted.'},
  ];
  if(parent) rows.push(parent);
  rows.push(
    {label:'Record ID', type:'TEXT', note:'System ID. Used by lookups, reports and integrations.'},
    {label:'Created by', type:'USER', note:''},
    {label:'Created at', type:'DATETIME', note:''},
    {label:'Updated by', type:'USER', note:''},
    {label:'Updated at', type:'DATETIME', note:''},
  );
  return rows;
}

  const head = `

function fieldRow(o, f){
  const m = typeMeta(f.type);
  const bits = [];
  if(f.unique) bits.push(tag('Unique'));
  if(f.extId) bits.push(tag('External ID'));
  if(f.showInReports === false) bits.push(tag('Not in reports', '', 'sm', 'Hidden from the report builder. Clutter control, not security.'));
  if(f.type === 'LOOKUP'){
    bits.push(tag('→ ' + esc(targetLabel(f.settings.target)), 'purple'));
    bits.push(f.settings.onDelete === 'BLOCK'
      ? tag('Block delete', 'orange', 'sm', 'The linked record cannot be deleted while records point at it.')
      : tag('Clear on delete', '', 'sm', 'Deleting the linked record clears this value.'));
  }
  if(f.type === 'ROLLUP'){
    const c = obj(f.settings.child);
    bits.push(tag(esc(f.settings.fn) + (f.settings.fn !== 'COUNT' && f.settings.aggField ? ' ' + esc(fieldLabel(f.settings.child, f.settings.aggField)) : ''), 'pink', 'sm'));
    bits.push(tag('of ' + esc(c ? c.plural : f.settings.child), '', 'sm'));
  }
  if(f.type === 'FORMULA'){
    const e = String(f.settings.expr || '');
    bits.push(`<span class="co-tag c-teal sm mono" title="${esc(e)}">${esc(e.slice(0,22))}${e.length>22?'…':''}</span>`);
  }
  if(f.type === 'SELECT' || f.type === 'MULTISELECT') bits.push(tag(`${(f.settings.options||[]).length} values`, '', 'sm'));
  if(f.def) bits.push(tag('Default ' + esc(f.def), '', 'sm'));

  return `<tr class="is-clickable" onclick="openFieldDrawer('${o.id}','${f.id}')">
    <td class="col-grip">${ICO_GRIP}</td>
    <td>
      <div class="co-fname">${esc(f.label)}</div>
    </td>
    <td><span class="co-type">${typeIcon(f.type)}${esc(m.label)}</span>${m.isNew ? ' ' + tag('New', 'purple', 'sm') : ''}</td>
    <td>${valueAssignment(f)}</td>
    <td>${mandatoryBox(!!f.required)}</td>
    <td><div style="display:flex;gap:5px;flex-wrap:wrap;max-width:330px">${bits.join('')}</div></td>
    <td class="col-menu"><button class="co-menu-btn" onclick="event.stopPropagation();fieldMenu(event,'${o.id}','${f.id}')" aria-label="More">${ICO.dots}</button></td>
  </tr>`;
}
function fieldLabel(objId, fieldId){
  const o = obj(objId); if(!o) return fieldId;
  const f = o.fields.find(x => x.id === fieldId);
  return f ? f.label : fieldId;
}

/* ── Tab: relationships ───────────────────────────────────────────── */
function tabRel(o){
  const out = o.fields.filter(f => f.type === 'LOOKUP');
  const inc = incoming(o.id);
  const rollups = o.fields.filter(f => f.type === 'ROLLUP');

  const card = (title, action, meta) => `
    <div class="co-card">
      <div class="co-band">
        <span class="co-band-t">${title}</span>
        <span style="margin-left:auto">${action}</span>
      </div>
      <div style="padding:14px 20px"><div class="co-rel-meta">${meta}</div></div>
    </div>`;

  const map = `
    <div class="co-card">
      <div class="co-band"><span class="co-band-t">How ${esc(o.label)} sits in the model</span></div>
      <div style="padding:14px 20px">
        <div style="font-size:12.5px;color:var(--muted-foreground);margin-bottom:6px">Arrows are lookups.</div>
        <div class="co-map">
          ${o.level !== 'GLOBAL' ? `<div class="co-map-row">
            <span class="co-node sys">${LEVELS[o.level].label}</span>
            <span class="co-conn"><span class="co-line"></span>parent · required</span>
            <span class="co-node me">${esc(o.label)}</span>
          </div>` : `<div class="co-map-row">
            <span class="co-node me">${esc(o.label)}</span>
            <span class="co-conn">no parent — </span>${openChip('Undecided.')}
          </div>`}
          ${out.map(f => `<div class="co-map-row">
            <span class="co-node me">${esc(o.label)}</span>
            <span class="co-conn"><span class="co-line"></span>${esc(f.label)}${f.required?' · required':''}</span>
            <span class="co-node">${esc(targetLabel(f.settings.target))}</span>
          </div>`).join('')}
          ${inc.map(({obj:p, field:f}) => `<div class="co-map-row">
            <span class="co-node">${esc(p.label)}</span>
            <span class="co-conn"><span class="co-line"></span>${esc(f.label)}${f.required?' · required':''}</span>
            <span class="co-node me">${esc(o.label)}</span>
          </div>`).join('')}
        </div>
      </div>
    </div>`;

  const outHtml = out.length ? out.map(f => card(
    `${esc(f.label)} <span style="color:var(--muted-foreground);font-weight:400">→ ${esc(targetLabel(f.settings.target))}</span>`,
    `<button class="rl-btn v-outline sz-sm" onclick="openFieldDrawer('${o.id}','${f.id}')"><span class="rl-btn-label">Edit</span></button>`,
    `${f.required ? '<b>Required</b>' : 'Optional'} · related list <b>${esc(f.settings.relatedListLabel)}</b> on ${esc(targetLabel(f.settings.target))} ·
     ${f.settings.onDelete === 'BLOCK' ? '<b>blocks delete</b>' : 'clears on delete'}
     ${(f.settings.pickerFields||[]).length ? `<br>Picker: ${(f.settings.pickerFields||[]).map(x => tag(esc(x), '', 'sm')).join(' ')}` : ''}`
  )).join('') : `<div class="co-rel-empty">${esc(o.label)} does not point at any other object yet.</div>`;

  const incHtml = inc.length ? inc.map(({obj:p, field:f}) => card(
    `${esc(f.settings.relatedListLabel)} <span style="color:var(--muted-foreground);font-weight:400">· ${esc(p.label)} records</span>`,
    `<button class="rl-btn v-outline sz-sm" onclick="go('object','${p.id}','fields')"><span class="rl-btn-label">Open ${esc(p.label)}</span></button>`,
    `Lists the ${esc(p.plural.toLowerCase())} whose <b>${esc(f.label)}</b> points here.
     ${f.settings.onDelete === 'BLOCK'
       ? `<b>Blocks deletion</b> of this ${esc(o.label)}.`
       : `Cleared if this ${esc(o.label)} is deleted.`}`
  )).join('') : `<div class="co-rel-empty">No other object points at ${esc(o.label)} yet.</div>`;

  const rollHtml = rollups.length ? rollups.map(f => {
    const c = obj(f.settings.child);
    return card(esc(f.label),
      `<button class="rl-btn v-outline sz-sm" onclick="openFieldDrawer('${o.id}','${f.id}')"><span class="rl-btn-label">Edit</span></button>`,
      `<b>${esc(f.settings.fn)}</b>${f.settings.fn !== 'COUNT' ? ' of <b>' + esc(fieldLabel(f.settings.child, f.settings.aggField)) + '</b>' : ''}
       across ${esc(c ? c.plural : f.settings.child)}, through
       <b>${esc(c ? fieldLabel(c.id, f.settings.childLookup) : f.settings.childLookup)}</b>.
       ${f.settings.filterField ? ` Only where <b>${esc(fieldLabel(f.settings.child, f.settings.filterField))}</b> ${f.settings.filterOp === 'neq' ? 'is not' : 'is'} <b>${esc(f.settings.filterValue)}</b>.` : ''}`);
  }).join('') : `<div class="co-rel-empty">No roll-ups on ${esc(o.label)} yet.</div>`;

  return map + `
    <div class="co-sec"><span class="co-sec-t">Points at (lookups on ${esc(o.label)})</span><span class="co-sec-line"></span></div>
    ${outHtml}
    <div class="co-sec"><span class="co-sec-t">Referenced by (related lists on ${esc(o.label)})</span><span class="co-sec-line"></span></div>
    ${incHtml}
    <div class="co-sec"><span class="co-sec-t">Roll-ups</span><span class="co-sec-line"></span>${openChip('Recommended, not decided.')}</div>
    ${rollHtml}`;
}

        ${incoming(o.id).length ? `Blocked while ${incoming(o.id).map(x=>esc(x.obj.label)).join(' and ')} point at it.` : ''}

/* ══ Drawer plumbing — the kit's right-side sheet ═══════════════════ */
let drawerKey = null;

function showDrawer(inner, width, key){
  const host = document.getElementById('drawer-host');
  const panel = host.querySelector('.rl-drawer-panel');
  /* Re-rendering the same drawer swaps only the panel's contents: the
     entrance animation stays a first-open event, and the reader keeps
     their scroll position instead of being thrown back to the top by a
     segmented control half way down the form. */
  if(key && key === drawerKey && panel){
    const prevTop = (host.querySelector('.rl-drawer-body') || {}).scrollTop || 0;
    panel.style.width = (width || 560) + 'px';
    panel.innerHTML = inner;
    const b = host.querySelector('.rl-drawer-body');
    if(b) b.scrollTop = prevTop;
    return;
  }
  drawerKey = key || null;
  host.innerHTML = `
    <div class="rl-drawer-root side-right" role="dialog" aria-modal="true">
      <div class="rl-drawer-scrim" onclick="closeDrawer()"></div>
      <div class="rl-drawer-panel" style="width:${width || 560}px">${inner}</div>
    </div>`;
}
function closeDrawer(){
  document.getElementById('drawer-host').innerHTML = '';
  od = null; fd = null; drawerKey = null;
}
document.addEventListener('keydown', e => { if(e.key === 'Escape'){ closeMenu(); closeDrawer(); } });

function drawerHead(title, desc, backFn){
  return `<div class="rl-drawer-header">
    ${backFn ? `<button class="rl-drawer-close" onclick="${backFn}" aria-label="Back" style="margin-left:-4px">${ICO.back}</button>` : ''}
    <div class="rl-drawer-titles">
      <h2 class="rl-drawer-title">${title}</h2>
      <p class="rl-drawer-description">${desc}</p>
    </div>
    <button class="rl-drawer-close" onclick="closeDrawer()" aria-label="Close">${ICO.x}</button>
  </div>`;
}
function drawerFoot(note, confirmLabel, onConfirm){
  return `<div class="rl-drawer-footer">
    <span class="rl-drawer-footer-spacer" style="font-size:11.5px;color:var(--muted-foreground);line-height:1.4;max-width:260px">${note}</span>
    <button class="rl-btn v-outline sz-md" onclick="closeDrawer()"><span class="rl-btn-label">Cancel</span></button>
    <button class="rl-btn v-primary sz-md" onclick="${onConfirm}"><span class="rl-btn-label">${confirmLabel}</span></button>
  </div>`;
}
/* Label + control + hint, using the kit's Field atom. */
function field(label, required, control, hint, err){
  return `<div class="co-f"><div class="rl-field">
    <label class="rl-field-label">${label}${required?' <span class="rl-field-required">*</span>':''}</label>
    ${control}
    ${hint ? `<div class="rl-field-hint">${hint}</div>` : ''}
    ${err || ''}
  </div></div>`;
}
function fErr(key, store){
  return store[key] ? `<div class="co-err">${ICO.warn} ${esc(store[key])}</div>` : '';
}
function secLabel(t, extra){
  return `<div class="co-sec"><span class="co-sec-t">${t}</span><span class="co-sec-line"></span>${extra||''}</div>`;
}

/* ══ Object drawer — Phase 1 ════════════════════════════════════════ */
let od = null;

function openObjectDrawer(id){
  const o = id ? obj(id) : null;
  od = {
    id: id || null, err: {},
    touchedRecName: !!o,
    d: o ? JSON.parse(JSON.stringify({
        label:o.label, plural:o.plural, level:o.level, description:o.description,
        recordNameLabel:o.recordNameLabel, recordNameType:o.recordNameType,
        autoFormat:o.autoFormat, autoStart:o.autoStart,
        reports:o.reports !== false, fieldHistory:o.fieldHistory, search:o.search !== false,
      }))
      : {label:'', plural:'', level:'ACCOUNT', description:'', recordNameLabel:'',
         recordNameType:'TEXT', autoFormat:'', autoStart:1,
         reports:true, fieldHistory:true, search:true},
  };
  odRender();
}

function odRender(){
  const editing = !!od.id;
  const o = editing ? obj(od.id) : null;
  const d = od.d;
  const hasRecords = editing && o.records > 0;
  const recNamePlaceholder = d.label ? `${d.label} Name` : 'Sales Order Name';

  const levelCard = (key, title, desc) => `
    <button class="co-card-opt${d.level===key?' sel':''}" type="button" onclick="odLevel('${key}')">
      <div class="co-card-t">${title}</div>
      <div class="co-card-d">${desc}</div>
    </button>`;

  showDrawer(
    drawerHead(
      editing ? 'Edit ' + esc(o.label) : 'New custom object',
      editing ? 'Level is fixed. Everything else can change.'
              : 'Fields come next, on the object’s page.'
    ) + `
    <div class="rl-drawer-body">
      ${field('Label', true,
        `<input class="co-input" id="od-label" value="${esc(d.label)}" placeholder="Enter label" oninput="odSet('label', this.value)">`,
        'Must be unique across all objects.', fErr('label', od.err))}

      <div class="co-f"><div class="rl-field">
        <label class="rl-field-label">Level <span class="rl-field-required">*</span>
          ${editing ? tag('Fixed after save', 'gray', 's-sm', 'Records depend on the level') : ''}</label>
        ${editing ? `
          <div class="co-prev">${tag(LEVELS[d.level].label, LEVELS[d.level].hue)}<span>Records depend on it.</span></div>
        ` : `
          <div class="co-cards">
            ${levelCard('ACCOUNT','Account','Outlives any one project. Orders, contracts, assets.')}
            ${levelCard('PROJECT','Project','Ends with the project. Change requests, risks.')}
          </div>
          <button class="co-card-opt" style="margin-top:8px;width:100%" disabled type="button">
            <div class="co-card-t">Global ${openChip('Undecided — a catalogue has no account or project parent.')}</div>
            <div class="co-card-d">A reference list with no parent, such as a product catalogue.</div>
          </button>
          <div class="rl-field-hint">This cannot be changed later.</div>
        `}
      </div></div>

      ${field('Description', false,
        `<textarea class="co-input" rows="2" placeholder="Enter description" oninput="odSet('description', this.value)">${esc(d.description)}</textarea>`)}

      ${secLabel('Record name')}
      ${field('Record Name label', true,
        `<input class="co-input" id="od-recname" value="${esc(d.recordNameLabel)}" placeholder="${esc(recNamePlaceholder)}" oninput="odSet('recordNameLabel', this.value); od.touchedRecName = true">`,
        'How people recognise a record. Always present.', fErr('recordNameLabel', od.err))}

      <div class="co-f"><div class="rl-field">
        <label class="rl-field-label">Record Name type <span class="rl-field-required">*</span>
          ${hasRecords ? tag(o.records.toLocaleString() + ' records exist', 'gray', 's-sm') : ''}</label>
        ${hasRecords ? `
          <div class="co-prev"><span class="co-prev-val">${esc(typeMeta(d.recordNameType==='AUTONUMBER'?'AUTONUMBER':'TEXT').label)}</span>
            <span>Fixed once records exist.</span></div>
        ` : `
          <div class="co-seg">
            <button class="${d.recordNameType==='TEXT'?'active':''}" onclick="odNameType('TEXT')" type="button">Text</button>
            <button class="${d.recordNameType==='AUTONUMBER'?'active':''}" onclick="odNameType('AUTONUMBER')" type="button">Auto Number</button>
          </div>
          <div class="rl-field-hint">${d.recordNameType === 'TEXT'
            ? 'Typed by the user. Up to 80 characters.'
            : 'Numbered by Rocketlane.'}</div>
        `}
      </div></div>

      ${d.recordNameType === 'AUTONUMBER' ? `
        <div class="co-f-row">
          ${field('Format', true,
            `<input class="co-input co-mono" value="${esc(d.autoFormat)}" placeholder="SO-{0000000}" oninput="odSet('autoFormat', this.value); odPreview()">`,
            'Zeros set the minimum width.', fErr('autoFormat', od.err))}
          <div class="co-f" style="max-width:150px"><div class="rl-field">
            <label class="rl-field-label">Starting number</label>
            <input class="co-input co-mono" type="number" min="1" value="${esc(d.autoStart)}"
                   oninput="odSet('autoStart', parseInt(this.value||'1',10)); odPreview()">
            <div class="rl-field-hint">${editing ? 'Can only move up.' : ''}</div>
            ${fErr('autoStart', od.err)}
          </div></div>
        </div>
        <div class="co-prev" style="margin-bottom:16px">
          <span>First record</span><span class="co-prev-val" id="od-preview">${esc(autoPreview(d.autoFormat, d.autoStart) || '—')}</span>
        </div>
      ` : ''}

      ${secLabel('Behaviour')}
      ${[['reports','Reports','Available in the report builder.'],
         ['fieldHistory','Field history','Field changes go to the audit log.'],
         ['search','Search','Found in global search by Record Name.']].map(([k,t,note]) => `
        <div class="co-sw">
          <button class="sc-switch${d[k]?' sc-switch--on':''}" onclick="odSet('${k}', !od.d.${k}); odRender()"
                  role="switch" aria-checked="${!!d[k]}"><span class="sc-switch-thumb"></span></button>
          <div style="flex:1">
            <div class="co-ctl-t">${t}</div>
            <div class="co-ctl-d">${note}</div>
          </div>
        </div>`).join('')}
    </div>` +
    drawerFoot('', editing ? 'Save changes' : 'Create object', 'odSave()'),
    560, 'obj:' + (od.id || 'new'));

  const el = document.getElementById('od-label');
  if(el && !od.id && !od.focused){ od.focused = true; setTimeout(()=>el.focus(), 60); }
}

/* ══ Field drawer — Phases 3 and 4 ══════════════════════════════════ */
let fd = null;

/* ── Step 1: pick the data type ───────────────────────────────────── */
function fdRenderType(){
  const o = obj(fd.objId);
  const q = (fd.q||'').toLowerCase();
  const groups = TYPE_GROUPS.map(g => {
    const items = Object.entries(TYPES)
      .filter(([k,t]) => t.group === g.key)
      .filter(([k,t]) => !q || t.label.toLowerCase().includes(q) || t.desc.toLowerCase().includes(q));
    if(!items.length) return '';
    const later = g.key === 'later';
    return `<div style="margin-bottom:18px">
      ${secLabel(g.title)}
      <div class="co-tp-grid">
        ${items.map(([k,t]) => `
          <button class="co-tp" type="button" ${later?'disabled title="Not in release 1"':`onclick="fdPickType('${k}')"`}>
            ${glyph(k)}
            <span class="co-tp-t">${esc(t.label)}
              ${t.isNew?tag('New','purple'):''}
              ${later?tag('Later'):''}</span>
          </button>`).join('')}
      </div>
    </div>`;
  }).join('');

  showDrawer(
    drawerHead(`Add a field to ${esc(o.label)}`, 'Start with the data type — it cannot be changed after the field is saved.') + `
    <div class="rl-drawer-body">
      <input class="co-input" placeholder="Search data types" value="${esc(fd.q)}" style="margin-bottom:16px"
             oninput="fd.q = this.value; fdRenderType()">
      ${groups || '<div class="co-rel-empty">No data type matches that.</div>'}
    </div>`,
    680, 'field:type');
}

      editing ? 'Edit field' : 'New ' + esc(m.label.toLowerCase()) + ' field',

      editing ? null : "fd.step='type';fdRender()"
    ) + `
    <div class="rl-drawer-body">
      <div class="co-prev" style="margin-bottom:16px">
        ${glyph(d.type, true)}
        <div style="flex:1;min-width:0">
          <div style="font-size:13.5px;font-weight:600;color:var(--foreground)">${esc(m.label)}</div>
          <div style="font-size:12px;margin-top:2px">${esc(m.desc)}</div>
        </div>
        ${editing ? tag('Fixed', 'gray', 's-sm', 'A field’s data type cannot change after save. Create a new field and move the data.')
                  : `<button class="rl-btn v-outline sz-sm" onclick="fd.step='type';fdRender()"><span class="rl-btn-label">Change</span></button>`}
      </div>

      ${field('Label', true,
        `<input class="co-input" id="fd-label" value="${esc(d.label)}" placeholder="Order Date" oninput="fdSetLabel(this.value)">`,
        '', fErr('label', fd.err))}

      <div class="co-f-row">
        ${field('Description', false, `<input class="co-input" value="${esc(d.description)}" placeholder="A note for admins" oninput="fd.d.description = this.value">`)}
        ${field('Help text', false, `<input class="co-input" value="${esc(d.help)}" placeholder="Shown to users on an info icon" oninput="fd.d.help = this.value">`)}
      </div>

      ${fdTypeSettings(o, d)}

      ${secLabel('Behaviour')}
      ${calculated ? `
        <div class="co-note">
          <span class="co-note-ico">${ICO.info}</span>
          <div>Read-only. Cannot be required or carry a default.</div>
        </div>
      ` : `
        <div class="co-check" onclick="fd.d.required = !fd.d.required; fdRender()">
          <span class="sc-check${d.required?' sc-check--on':''}">${d.required?ICO.check:''}</span>
          <div><div class="co-ctl-t">Required</div>
            <div class="co-ctl-d">Applies on the form, import and sync.</div></div>
        </div>
        ${canUnique ? `
          <div class="co-check" onclick="fd.d.unique = !fd.d.unique; fdRender()">
            <span class="sc-check${d.unique?' sc-check--on':''}">${d.unique?ICO.check:''}</span>
            <div><div class="co-ctl-t">Unique</div>
              <div class="co-ctl-d">No two records share a value.</div></div>
          </div>
          <div class="co-check" onclick="fd.d.extId = !fd.d.extId; fdRender()">
            <span class="sc-check${d.extId?' sc-check--on':''}">${d.extId?ICO.check:''}</span>
            <div><div class="co-ctl-t">External ID</div>
              <div class="co-ctl-d">Matches records on import and sync. Tick Unique too for a sync key.</div></div>
          </div>
        ` : `
          <div class="co-check locked">
            <span class="sc-check" style="opacity:.4"></span>
            <div><div class="co-ctl-t" style="color:var(--muted-foreground)">Unique and External ID</div>
              <div class="co-ctl-d">Text and Number only.</div></div>
          </div>
        `}
        ${fdDefaultValue(d)}
      `}
      <div class="co-sw" style="border-top:1px solid var(--border)">
        <button class="sc-switch${d.showInReports!==false?' sc-switch--on':''}"
                onclick="fd.d.showInReports = fd.d.showInReports === false; fdRender()"
                role="switch" aria-checked="${d.showInReports!==false}"><span class="sc-switch-thumb"></span></button>
        <div style="flex:1">

          <div class="co-ctl-d">Off hides it from the report builder. Not security.</div>
        </div>
      </div>
    </div>` +
    drawerFoot('', editing ? 'Save field' : 'Create field', 'fdSave()'),
    560, 'field:' + (fd.fieldId || 'new'));

  const el = document.getElementById('fd-label');
  if(el && !editing && !fd.focused){ fd.focused = true; setTimeout(()=>el.focus(), 60); }
}

/* Default value, for the types where a generic control makes sense.
   Date, checkbox and user carry theirs in the type-specific block. */
function fdDefaultValue(d){
  const t = d.type;
  if(['DATE','CHECKBOX','USER','LOOKUP','MULTISELECT'].includes(t)) return '';
  let control;
  if(t === 'SELECT'){
    const opts = (d.settings.options||[]).filter(o => o.label);
    control = `<select class="co-input" onchange="fd.d.def = this.value">
      <option value="">No default</option>
      ${opts.map(o => `<option ${d.def===o.label?'selected':''}>${esc(o.label)}</option>`).join('')}
    </select>`;
  }else if(NUMERIC.includes(t)){
    control = `<input class="co-input" type="number" value="${esc(d.def)}" placeholder="No default" oninput="fd.d.def = this.value">`;
  }else{
    control = `<input class="co-input" value="${esc(d.def)}" placeholder="No default" oninput="fd.d.def = this.value">`;
  }
  return `<div style="padding-top:14px;border-top:1px solid var(--border);margin-top:4px">
    ${field('Default value', false, control, 'New records only.')}
  </div>`;
}

/* ── Type-specific settings ───────────────────────────────────────── */

  switch(d.type){

      'Up to 32,000 characters.')}</div>`;

    case 'NUMBER': return secLabel('Number settings') + dec(6, 'Blank is not 0.');

    case 'CURRENCY': return secLabel('Currency settings', openChip('One workspace currency, a Currency field on the record, or a code per value? Proposal: a Currency field on the record.')) + dec(4);

    case 'PERCENT': return secLabel('Percent settings') + dec(4, '15% is stored as 15.');

    case 'DATE': return secLabel('Date settings') + `<div class="co-f"><div class="rl-field">
        <label class="rl-field-label">Default value</label>
        <div class="co-seg">
          <button class="${s.dateDefault!=='today'?'active':''}" type="button" onclick="fd.d.settings.dateDefault='blank';fdRender()">Blank</button>
          <button class="${s.dateDefault==='today'?'active':''}" type="button" onclick="fd.d.settings.dateDefault='today';fdRender()">Today</button>
        </div>
      </div></div>`;

    case 'CHECKBOX': return secLabel('Checkbox settings') + `<div class="co-f"><div class="rl-field">
        <label class="rl-field-label">Default value</label>
        <div class="co-seg">
          <button class="${!s.checkDefault?'active':''}" type="button" onclick="fd.d.settings.checkDefault=false;fdRender()">Unchecked</button>
          <button class="${s.checkDefault?'active':''}" type="button" onclick="fd.d.settings.checkDefault=true;fdRender()">Checked</button>

    case 'SELECT':

      </div>
      <div class="co-f-row">
        ${field('Sort order', false, `<select class="co-input" onchange="fd.d.settings.sort = this.value">
          <option value="entered" ${s.sort==='entered'?'selected':''}>As entered</option>

    case 'USER': return secLabel('User settings') + `
      <div class="co-f"><div class="rl-field">

        <div class="co-seg">

          <button class="${s.userMode==='multiple'?'active':''}" type="button" onclick="fd.d.settings.userMode='multiple';fdRender()">Several users</button>

        <label class="rl-field-label">Default value</label>

/* ── Lookup ───────────────────────────────────────────────────────── */

      ${field('Related list label', true,

    </select>`)}

      <label class="rl-field-label">Expression <span class="rl-field-required">*</span></label>
      <textarea class="co-input co-mono" rows="2" placeholder="{Quantity} * {Unit Price}" oninput="fd.d.settings.expr = this.value">${esc(s.expr)}</textarea>

/* ── Roll-up (Part C) ─────────────────────────────────────────────── */
function fdRollupSettings(o, d){
  const s = d.settings;
  /* Only objects that already point at this one can be rolled up — the
     lookup is what the roll-up walks. */
  const children = state.objects.filter(c => c.fields.some(f => f.type === 'LOOKUP' && f.settings.target === o.id));
  const child = obj(s.child);
  const lookups = child ? child.fields.filter(f => f.type === 'LOOKUP' && f.settings.target === o.id) : [];
  const numericIsh = f => NUMERIC.includes(f.type) || (f.type === 'FORMULA' && NUMERIC.includes(f.settings.returns));
  const aggCandidates = child ? child.fields.filter(f =>
      s.fn === 'MIN' || s.fn === 'MAX' ? (numericIsh(f) || f.type === 'DATE') : numericIsh(f)) : [];
  const filterCandidates = child ? child.fields.filter(f => ['SELECT','CHECKBOX','TEXT'].includes(f.type)) : [];
  const filterField = child && s.filterField ? child.fields.find(f => f.id === s.filterField) : null;

  if(!children.length){
    return secLabel('Roll-up') + `
      <div class="co-note warn">
        <span class="co-note-ico">${ICO.warn}</span>
        <div>Nothing points at ${esc(o.label)} yet. Add a lookup on the object you want to aggregate first.</div>
      </div>`;
  }

  return secLabel('What it aggregates') + `
    <div class="co-f"><div class="rl-field">
      <label class="rl-field-label">Child object <span class="rl-field-required">*</span>
        ${fd.fieldId ? tag('Fixed after save') : ''}</label>
      <select class="co-input" ${fd.fieldId?'disabled':''} onchange="fdSetRollupChild(this.value)">
        <option value="">Select an object…</option>
        ${children.map(c => `<option value="${c.id}" ${s.child===c.id?'selected':''}>${esc(c.plural)}</option>`).join('')}
      </select>
      ${fErr('child', fd.err)}
    </div></div>

    ${child ? `
      ${lookups.length > 1 ? field('Follow which lookup', true,
        `<select class="co-input" onchange="fd.d.settings.childLookup = this.value; fdRender()">
          ${lookups.map(f => `<option value="${f.id}" ${s.childLookup===f.id?'selected':''}>${esc(f.label)}</option>`).join('')}
        </select>`,
        `${esc(child.label)} points at ${esc(o.label)} ${lookups.length} ways, and they mean different things.`)
      : `<div class="co-prev" style="margin-bottom:16px">
          <span>Follows</span><span class="co-prev-val">${esc(lookups[0] ? lookups[0].label : '—')}</span>
          <span>the only lookup to ${esc(o.label)}.</span>
        </div>`}

      <div class="co-f-row">
        ${field('Function', true, `<select class="co-input" onchange="fd.d.settings.fn = this.value; fdRender()">
          ${['COUNT','SUM','MIN','MAX'].map(fn => `<option value="${fn}" ${s.fn===fn?'selected':''}>${fn}</option>`).join('')}
          <option disabled>AVERAGE — still to decide</option>
        </select>`)}
        ${field(s.fn === 'COUNT' ? 'Field' : 'Field to aggregate', s.fn !== 'COUNT',
          s.fn === 'COUNT'
            ? `<input class="co-input" value="Not needed — COUNT counts records" disabled>`
            : `<select class="co-input" onchange="fd.d.settings.aggField = this.value">
                 <option value="">Select a field…</option>
                 ${aggCandidates.map(f => `<option value="${f.id}" ${s.aggField===f.id?'selected':''}>${esc(f.label)}</option>`).join('')}
               </select>`,
          '', fErr('aggField', fd.err))}
      </div>

      <div class="co-f"><div class="rl-field">
        <label class="rl-field-label">Only include children where <span style="font-weight:400;text-transform:none">(optional)</span></label>
        <div style="display:flex;gap:8px">
          <select class="co-input" style="flex:1.2" onchange="fd.d.settings.filterField = this.value; fd.d.settings.filterValue=''; fdRender()">
            <option value="">No filter — include every child</option>
            ${filterCandidates.map(f => `<option value="${f.id}" ${s.filterField===f.id?'selected':''}>${esc(f.label)}</option>`).join('')}
          </select>
          ${s.filterField ? `
            <select class="co-input" style="flex:0 0 94px" onchange="fd.d.settings.filterOp = this.value">
              <option value="eq" ${s.filterOp==='eq'?'selected':''}>is</option>
              <option value="neq" ${s.filterOp==='neq'?'selected':''}>is not</option>
            </select>
            ${filterField && filterField.type === 'SELECT'
              ? `<select class="co-input" style="flex:1" onchange="fd.d.settings.filterValue = this.value">
                   <option value="">Select…</option>
                   ${(filterField.settings.options||[]).map(opt => `<option ${s.filterValue===opt.label?'selected':''}>${esc(opt.label)}</option>`).join('')}
                 </select>`
              : `<input class="co-input" style="flex:1" value="${esc(s.filterValue)}" placeholder="Value" oninput="fd.d.settings.filterValue = this.value">`}
          ` : ''}
        </div>
      </div></div>

      <div style="font-size:12px;color:var(--muted-foreground);margin-top:-4px">
        Counts every child, including ones the viewer cannot see. Blanks are skipped.
      </div>
    ` : ''}`;
}

/* ══ Field + object logic (unchanged from the first build) ═════════ */
function odSet(k, v){
  od.d[k] = v;
  delete od.err[k];
  if(k === 'label'){
    /* Plural is no longer a field — it is derived from the label and used
       for list views and as the default related-list title. */
    od.d.plural = pluralise(v);
    if(!od.touchedRecName) od.d.recordNameLabel = v ? v + ' Name' : '';
    const r = document.getElementById('od-recname');
    if(r && !od.touchedRecName){ r.value = od.d.recordNameLabel; r.placeholder = (v||'Sales Order') + ' Name'; }
  }
}

function odLevel(l){ od.d.level = l; odRender(); }
function odNameType(t){
  od.d.recordNameType = t;
  if(t === 'AUTONUMBER' && !od.d.autoFormat){
    const prefix = (od.d.label || 'OB').split(/\s+/).map(w => w[0]||'').join('').toUpperCase().slice(0,3) || 'OB';
    od.d.autoFormat = prefix + '-{000000}';
  }
  odRender();
}

function odPreview(){
  const el = document.getElementById('od-preview');
  if(el) el.textContent = autoPreview(od.d.autoFormat, od.d.autoStart) || '—';
}

function odSave(){
  const d = od.d; od.err = {};
  const label = (d.label||'').trim();
  if(!label) od.err.label = 'Give the object a label.';
  else if(RESERVED.includes(label.toLowerCase()))
    od.err.label = `“${label}” is a Rocketlane object. Pick a label that is not already taken.`;
  else if(state.objects.some(o => o.id !== od.id && o.label.toLowerCase() === label.toLowerCase()))
    od.err.label = `There is already a custom object called “${label}”.`;
  if(!(d.recordNameLabel||'').trim()) od.err.recordNameLabel = 'Give the Record Name a label.';
  if(d.recordNameType === 'AUTONUMBER'){
    if(!/\{0+\}/.test(d.autoFormat||'')) od.err.autoFormat = 'Include a number token, for example {000000}.';
    const o = od.id ? obj(od.id) : null;
    if(o && o.recordNameType === 'AUTONUMBER' && d.autoStart < o.autoStart)
      od.err.autoStart = `Cannot go below ${o.autoStart} — numbers already issued would repeat.`;
  }
  if(Object.keys(od.err).length){ odRender(); return; }

  if(od.id){
    const o = obj(od.id);
    Object.assign(o, {
      label, plural:(d.plural||pluralise(label)).trim(), description:d.description,
      recordNameLabel:d.recordNameLabel.trim(), recordNameType:d.recordNameType,
      autoFormat:d.autoFormat, autoStart:d.autoStart,
      reports:d.reports, fieldHistory:d.fieldHistory, search:d.search,
      updated:'Just now',
    });
    if(d.recordNameType === 'AUTONUMBER' && o.autoNext < d.autoStart) o.autoNext = d.autoStart;
    save(); closeDrawer(); render(); toast(`${label} updated.`);
  }else{
    const o = {
      id: uid('o'), label, plural:(d.plural||pluralise(label)).trim(), level:d.level,
      description:d.description, recordNameLabel:d.recordNameLabel.trim(),
      recordNameType:d.recordNameType, autoFormat:d.autoFormat, autoStart:d.autoStart,
      autoNext:d.autoStart, reports:d.reports, fieldHistory:d.fieldHistory, search:d.search,
      records:0, updated:'Just now', fields:[],
    };
    state.objects.push(o); save(); closeDrawer(); go('object', o.id, 'fields');
    toast(`${label} created. Record Name, parent and system fields are in place — add your own fields next.`);
  }
}

function fdSetLabel(v){ fd.d.label = v; delete fd.err.label; }

/* Default settings per type. These are the proposals in A4, not invented
   numbers: 255 for text, 32,000 for multi-line, 2 decimals for currency. */
function defaultSettings(type){
  switch(type){
    case 'TEXT':        return {maxLength:255};
    case 'MULTILINE':   return {maxLength:32000};
    case 'NUMBER':      return {decimals:0};
    case 'CURRENCY':    return {decimals:2};
    case 'PERCENT':     return {decimals:2};
    case 'DATE':        return {dateDefault:'blank'};
    case 'CHECKBOX':    return {checkDefault:false};
    case 'SELECT':
    case 'MULTISELECT': return {options:[{label:'',color:PALETTE[0]}], sort:'entered'};
    case 'USER':        return {userMode:'single', userDefault:'blank'};
    case 'LOOKUP':      return {target:'', relatedListLabel:'', onDelete:'CLEAR', pickerFields:[]};
    case 'FORMULA':     return {returns:'NUMBER', expr:''};
    case 'ROLLUP':      return {child:'', childLookup:'', fn:'SUM', aggField:'', filterField:'', filterOp:'eq', filterValue:''};
    default:            return {};
  }
}

function openFieldDrawer(objId, fieldId){
  const o = obj(objId);
  const f = fieldId ? o.fields.find(x => x.id === fieldId) : null;
  fd = {
    objId, fieldId: fieldId || null, q:'',
    step: f ? 'form' : 'type',
    touchedRLL: !!f,
    err:{},
    d: f ? JSON.parse(JSON.stringify(f))
         : {label:'', type:'', description:'', help:'', required:false, unique:false,
            extId:false, def:'', showInReports:true, settings:{}},
  };
  fdRender();
}

function fdRender(){ fd.step === 'type' ? fdRenderType() : fdRenderForm(); }


function fdPickType(t){
  fd.d.type = t;
  fd.d.settings = defaultSettings(t);
  if(t === 'LOOKUP') fd.d.settings.relatedListLabel = obj(fd.objId).plural;
  fd.step = 'form';
  fdRender();
}

function fdAddOption(){ fd.d.settings.options.push({label:'', color:PALETTE[fd.d.settings.options.length % PALETTE.length]}); delete fd.err.options; fdRender(); }
function fdRemoveOption(i){
  const opts = fd.d.settings.options;
  if(fd.d.def === opts[i].label) fd.d.def = '';
  opts.splice(i,1); if(!opts.length) opts.push({label:'', color:PALETTE[0]});
  fdRender();
}

function fdCycleColour(i){
  const opt = fd.d.settings.options[i];
  opt.color = PALETTE[(PALETTE.indexOf(opt.color) + 1) % PALETTE.length];
  fdRender();
}

/* ── Lookup ───────────────────────────────────────────────────────── */
function targetFieldLabels(target){
  if(target === 'ACCOUNT') return ['Account Owner','Region','Industry','Created at'];
  if(target === 'PROJECT') return ['Customer','Project Owner','Status','Start date','Created at'];
  const t = obj(target); if(!t) return [];
  const parent = t.level === 'GLOBAL' ? null : (t.level === 'ACCOUNT' ? 'Account' : 'Project');
  return [parent, ...t.fields.filter(f => f.type !== 'ROLLUP').map(f => f.label), 'Created at'].filter(Boolean);
}

function fdSetTarget(v){
  fd.d.settings.target = v;
  fd.d.settings.pickerFields = v
    ? targetFieldLabels(v).filter(x => ['Account','Project','Customer','Created at'].includes(x)).slice(0,2)
    : [];
  if(!fd.touchedRLL) fd.d.settings.relatedListLabel = obj(fd.objId).plural;
  delete fd.err.target;
  fdRender();
}

function fdTogglePicker(label){
  const arr = fd.d.settings.pickerFields || (fd.d.settings.pickerFields = []);
  const i = arr.indexOf(label);
  if(i >= 0) arr.splice(i,1); else if(arr.length < 3) arr.push(label);
  fdRender();
}

function fdInsertToken(label){
  fd.d.settings.expr = (fd.d.settings.expr ? fd.d.settings.expr.trimEnd() + ' ' : '') + '{' + label + '}';
  fdRender();
}

function fdSetRollupChild(v){
  const s = fd.d.settings;
  s.child = v; s.aggField = ''; s.filterField = ''; s.filterValue = '';
  const c = obj(v);
  const lookups = c ? c.fields.filter(f => f.type === 'LOOKUP' && f.settings.target === fd.objId) : [];
  s.childLookup = lookups.length ? lookups[0].id : '';
  delete fd.err.child;
  fdRender();
}

/* ── Save a field ─────────────────────────────────────────────────── */
function fdSave(){
  const o = obj(fd.objId), d = fd.d; fd.err = {};
  const label = (d.label||'').trim();
  if(!label) fd.err.label = 'Give the field a label.';
  else if(o.fields.some(f => f.id !== fd.fieldId && f.label.toLowerCase() === label.toLowerCase()))
    fd.err.label = `${o.label} already has a field called “${label}”.`;
  else if(label.toLowerCase() === o.recordNameLabel.toLowerCase())
    fd.err.label = `“${label}” is the Record Name field on ${o.label}.`;

  if(d.type === 'LOOKUP' && !d.settings.target) fd.err.target = 'Choose what this points at.';
  if(d.type === 'ROLLUP'){
    if(!d.settings.child) fd.err.child = 'Choose the object to aggregate.';
    else if(d.settings.fn !== 'COUNT' && !d.settings.aggField) fd.err.aggField = 'Choose the field to aggregate.';
  }
  if(d.type === 'FORMULA' && !(d.settings.expr||'').trim()) fd.err.expr = 'Write the expression.';
  if((d.type === 'SELECT' || d.type === 'MULTISELECT') && !(d.settings.options||[]).some(x => x.label.trim()))
    fd.err.options = 'Add at least one value.';

  if(Object.keys(fd.err).length){ fdRender(); return; }

  if(d.type === 'SELECT' || d.type === 'MULTISELECT')
    d.settings.options = d.settings.options.filter(x => x.label.trim());
  d.label = label;

  if(fd.fieldId){
    const i = o.fields.findIndex(f => f.id === fd.fieldId);
    o.fields[i] = Object.assign({}, o.fields[i], d);
    toast(`${label} updated.`);
  }else{
    d.id = uid('f');
    o.fields.push(d);
    toast(d.type === 'LOOKUP'
      ? `${label} created. ${targetLabel(d.settings.target)} records now show a “${d.settings.relatedListLabel}” related list.`
      : `${label} created and available in records, reports, automations and the API.`);
  }
  o.updated = 'Just now';
  save(); closeDrawer(); render();
}

/* ══ Menus ══════════════════════════════════════════════════════════ */
let menuEl = null;
function closeMenu(){ if(menuEl){ menuEl.remove(); menuEl = null; } }
document.addEventListener('click', e => { if(menuEl && !menuEl.contains(e.target)) closeMenu(); }, true);

function showMenu(ev, items){
  ev.stopPropagation(); closeMenu();
  const el = document.createElement('div');
  el.className = 'co-menu';
  el.innerHTML = items.map(i => i === '-' ? '<div class="co-menu-sep"></div>'
    : `<button class="co-menu-i${i.danger?' danger':''}" ${i.disabled?'disabled':''} ${i.title?`title="${esc(i.title)}"`:''}>${esc(i.label)}</button>`).join('');
  document.body.appendChild(el);
  const r = ev.currentTarget.getBoundingClientRect();
  el.style.top = Math.min(r.bottom + 4, window.innerHeight - el.offsetHeight - 10) + 'px';
  el.style.left = Math.max(10, r.right - el.offsetWidth) + 'px';
  let n = 0;
  items.forEach(i => { if(i === '-') return;
    const btn = el.querySelectorAll('.co-menu-i')[n++];
    if(!i.disabled) btn.onclick = () => { closeMenu(); i.fn(); };
  });
  menuEl = el;
}
function fieldMenu(ev, objId, fieldId){
  showMenu(ev, [
    {label:'Edit field', fn:()=>openFieldDrawer(objId, fieldId)},
    '-',
    {label:'Delete field', danger:true, fn:()=>confirmDeleteField(objId, fieldId)},
  ]);
}
function pageMenu(ev){
  showMenu(ev, [
    {label:'Restore sample data', fn:resetData},
    {label:'Remove every object', danger:true, fn:clearData},
  ]);
}
function objectMenu(ev, id){
  const blockers = incoming(id);
  showMenu(ev, [
    {label:'Open', fn:()=>go('object', id, 'fields')},
    {label:'Add field', fn:()=>{ go('object', id, 'fields'); openFieldDrawer(id); }},
    {label:'Edit object', fn:()=>openObjectDrawer(id)},
    '-',
    {label: blockers.length ? `Delete — blocked by ${blockers.length} lookup${blockers.length>1?'s':''}` : 'Delete object',
     danger:true, disabled:!!blockers.length,
     title: blockers.length ? blockers.map(b => `${b.obj.label}.${b.field.label}`).join(', ') : '',
     fn:()=>confirmDeleteObject(id)},
  ]);
}

/* ══ Confirm dialogs ════════════════════════════════════════════════ */
function dialog({title, body, confirm, danger, onConfirm, blocked}){
  document.getElementById('dialog-host').innerHTML = `
    <div class="sc-dialog-overlay" onclick="if(event.target===this) closeDialog()">
      <div class="sc-dialog" role="dialog" aria-modal="true">
        <div class="sc-dialog-header">
          <div class="sc-dialog-title">${title}</div>
          <div class="sc-dialog-desc">${body}</div>
        </div>
        <div class="sc-dialog-footer">
          <button class="rl-btn v-outline sz-md" onclick="closeDialog()"><span class="rl-btn-label">${blocked ? 'Close' : 'Cancel'}</span></button>
          ${blocked ? '' : `<button class="rl-btn ${danger?'v-danger':'v-primary'} sz-md" id="dlg-ok"><span class="rl-btn-label">${confirm}</span></button>`}
        </div>
      </div>
    </div>`;
  const ok = document.getElementById('dlg-ok');
  if(ok) ok.onclick = () => { closeDialog(); onConfirm(); };
}
function closeDialog(){ document.getElementById('dialog-host').innerHTML = ''; }

/* A field delete has to say what it would break first. Formulas and
   roll-ups that read the field block it outright. */
function confirmDeleteField(objId, fieldId){
  const o = obj(objId), f = o.fields.find(x => x.id === fieldId);
  const used = usages(o, f);
  if(used.length){
    dialog({
      title:`“${esc(f.label)}” is in use`,
      body:`Something is reading this field, so deleting it would break:<br><br>
        ${used.map(u => `• ${esc(u)}`).join('<br>')}<br><br>
        Remove those first, then delete the field.`,
      blocked:true,
    });
    return;
  }
  const inbound = f.type === 'LOOKUP' ? `<br><br>The <b>${esc(f.settings.relatedListLabel)}</b> related list on
    ${esc(targetLabel(f.settings.target))} records goes with it.` : '';
  dialog({
    title:`Delete “${esc(f.label)}”?`,
    body:`The field and its values on all ${o.records.toLocaleString()} ${esc(o.plural.toLowerCase())} are removed.
      Check first whether reports, automations, layouts or validation rules use it.${inbound}`,
    confirm:'Delete field', danger:true,
    onConfirm(){
      o.fields = o.fields.filter(x => x.id !== fieldId);
      o.updated = 'Just now'; save(); render(); toast(`${f.label} deleted.`);
    },
  });
}

function confirmDeleteObject(id){
  const o = obj(id), blockers = incoming(id);
  if(blockers.length){
    dialog({
      title:`${esc(o.label)} cannot be deleted yet`,
      body:`These lookups point at it:<br><br>
        ${blockers.map(b => `• <b>${esc(b.field.label)}</b> on ${esc(b.obj.label)}${b.field.required?' (required)':''}`).join('<br>')}<br><br>
        Remove them first. This is the same protection “block the delete” gives a single record, applied to the object.`,
      blocked:true,
    });
    return;
  }
  dialog({
    title:`Delete ${esc(o.label)}?`,
    body:`${o.records.toLocaleString()} records, ${o.fields.length} fields and every view, report column and
      automation that refers to them are removed. This cannot be undone.`,
    confirm:`Delete ${esc(o.label)}`, danger:true,
    onConfirm(){
      state.objects = state.objects.filter(x => x.id !== id);
      save(); go('list'); toast(`${o.label} deleted.`);
    },
  });
}

/* ══ Go ═════════════════════════════════════════════════════════════ */
render();
</script>
