<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Custom objects · Settings</title>

<!-- The design system, in the order the kit requires: tokens and the shadcn
     primitives first, then the Rocketlane product layer on top of them. -->
<link rel="stylesheet" href="ds/styles.css">
<link rel="stylesheet" href="ds/rocketlane.css">

<style>
/* ──────────────────────────────────────────────────────────────
   Custom objects — Settings › Advanced

   Built to match the real Settings screen (the "Time entry fields"
   page), not the design system's app-shell: the shipping product's
   Settings has a 56px rail, a ~300px settings sidebar and a plain
   white content area. The kit models a different shell — a 60px rail
   on a tinted canvas with the page as a floating card — and has no
   settings sidebar at all, so that part is built here.

   Everything the kit DOES cover is still the kit: tokens, .rl-btn,
   .rl-drawer-*, .rl-field, .rl-section, .sc-check, and the tag colour
   palette. Page-local names are --co-* / .co-* so they can never
   shadow a design system token.
   ────────────────────────────────────────────────────────────── */
:root{
  --co-blue:#0F62FE;             /* the product's accent — toggles, active nav, links */
  --co-nav-active:#EDF2F9;
  --co-rail-hover:#F1F3F7;
  --co-border:#E6E8EC;
  --co-border-soft:#EFF1F4;
  --co-band:#F8F9FB;             /* section band behind "General information" */
  --co-thead:#F1F5FA;            /* column header row */
  --co-check-off:#D7DAE0;
  --co-check-on:#C3C7CF;
}
html, body {
  margin:0; height:100%; overflow:hidden;
  background:var(--background); color:var(--foreground);
  font-family:var(--font-sans); font-size:14px;
}
*,*::before,*::after{ box-sizing:border-box; }
button{ font-family:inherit; border:none; background:transparent; color:inherit; cursor:pointer; padding:0; }
a{ color:inherit; text-decoration:none; }
.hidden{ display:none !important; }

/* ══ Shell ══ */
.co-shell{ display:flex; height:100vh; overflow:hidden; }

/* ── Rail: 56px, white, dark icons. Active item is a soft grey square. ── */
.co-rail{
  width:56px; flex-shrink:0; background:var(--background);
  border-right:1px solid var(--co-border-soft);
  display:flex; flex-direction:column; align-items:center;
  padding:10px 0 12px; gap:2px; overflow:visible;
}
.co-rail-logo{
  width:30px; height:30px; border-radius:8px; background:var(--co-blue);
  color:#fff; display:grid; place-items:center; font-size:13px; font-weight:700;
  flex-shrink:0; margin-bottom:4px;
}
.co-rail-i{
  width:34px; height:34px; border-radius:8px; display:grid; place-items:center;
  color:#4A5260; flex-shrink:0; position:relative;
}
.co-rail-i:hover{ background:var(--co-rail-hover); }
.co-rail-i.on{ background:var(--co-rail-hover); color:#111827; }
.co-rail-i svg{ width:19px; height:19px; }
.co-rail-sp{ flex:1; }
.co-rail-dot{
  position:absolute; top:6px; right:7px; width:7px; height:7px;
  border-radius:50%; background:#E5484D; border:1.5px solid var(--background);
}
.co-rail-badge{
  position:absolute; top:3px; right:3px; min-width:16px; height:16px; padding:0 4px;
  border-radius:8px; background:#E5484D; color:#fff; font-size:10px; font-weight:600;
  display:grid; place-items:center; border:1.5px solid var(--background);
}
.co-rail-av{
  width:30px; height:30px; border-radius:50%; background:var(--co-blue); color:#fff;
  font-size:11px; font-weight:600; display:grid; place-items:center; flex-shrink:0;
}

/* ── Settings sidebar ── */
.co-side{
  width:300px; flex-shrink:0; background:var(--background);
  border-right:1px solid var(--co-border); display:flex; flex-direction:column;
  overflow-y:auto;
}
.co-side-title{ padding:20px 20px 14px; font-size:22px; font-weight:600; letter-spacing:-0.015em; }
.co-side-search{ padding:0 20px 12px; }
.co-nav{ padding:0 12px; }
.co-nav-i{
  display:flex; align-items:center; gap:10px; width:100%;
  padding:7px 8px; border-radius:8px; font-size:14px; color:#2B313B;
  text-align:left; margin-bottom:1px; line-height:1.35;
}
.co-nav-i:hover{ background:var(--co-rail-hover); }
.co-nav-i.on{ background:var(--co-nav-active); color:#11325E; font-weight:500; }
.co-nav-i.on .co-nav-arrow{ opacity:1; }
.co-nav-ico{
  width:24px; height:24px; border-radius:6px; display:grid; place-items:center;
  flex-shrink:0; font-size:12px; line-height:1;
}
.co-nav-ico svg{ width:14px; height:14px; }
.co-nav-arrow{ margin-left:auto; opacity:0; color:#5B6472; flex-shrink:0; }
.co-nav-arrow svg{ width:14px; height:14px; }
.co-nav-label{ padding:16px 20px 6px; font-size:13px; font-weight:600; color:#6B7280; }
.co-side-div{ height:1px; background:var(--co-border-soft); margin:12px 20px; }

/* ── Content ── */
.co-main{ flex:1; min-width:0; display:flex; flex-direction:column; overflow:hidden; background:var(--background); }
.co-head{ padding:20px 28px 16px; flex-shrink:0; border-bottom:1px solid var(--co-border-soft); }
.co-crumb{ display:flex; align-items:center; gap:6px; font-size:13px; color:#6B7280; margin-bottom:8px; }
.co-crumb a{ color:var(--co-blue); cursor:pointer; }
.co-crumb a:hover{ text-decoration:underline; text-underline-offset:3px; }
.co-title{ display:flex; align-items:center; gap:10px; font-size:21px; font-weight:600; letter-spacing:-0.015em; min-width:0; }
.co-title > svg{ width:19px; height:19px; color:#5B6472; flex-shrink:0; }
.co-desc{ font-size:13.5px; color:var(--muted-foreground); line-height:1.5; margin-top:6px; max-width:860px; }
.co-scroll{ flex:1; overflow-y:auto; padding:18px 28px 48px; }
.co-actions{ display:flex; justify-content:flex-end; gap:10px; margin-bottom:16px; }

/* Tabs — the 2px underline tab from the kit */
.co-tabs{ display:flex; gap:0; margin:14px -12px -17px; }
.co-tab{
  position:relative; padding:0 12px; height:38px; font-size:14px;
  color:var(--muted-foreground); display:inline-flex; align-items:center; gap:7px; white-space:nowrap;
}
.co-tab:hover:not(:disabled){ color:var(--foreground); }
.co-tab.on{ color:var(--co-blue); font-weight:500; }
.co-tab.on::after{ content:''; position:absolute; left:10px; right:10px; bottom:0; height:2px; background:var(--co-blue); }
.co-tab:disabled{ opacity:.45; cursor:not-allowed; }

/* ══ Card + table — the "Time entry fields" pattern ══ */
.co-card{ border:1px solid var(--co-border); border-radius:10px; overflow:hidden; background:var(--background); margin-bottom:18px; }
.co-band{
  display:flex; align-items:center; gap:10px; padding:13px 20px;
  background:var(--co-band); border-bottom:1px solid var(--co-border);
}
.co-band-t{ font-size:15px; font-weight:500; }
.co-band-n{ margin-left:auto; font-size:13.5px; color:var(--muted-foreground); font-variant-numeric:tabular-nums; }
.co-band-d{ font-size:12.5px; color:var(--muted-foreground); line-height:1.55; padding:11px 20px; background:var(--co-band); border-bottom:1px solid var(--co-border); }

.co-table{ width:100%; border-collapse:separate; border-spacing:0; font-size:14px; }
.co-table thead th{
  background:var(--co-thead); border-bottom:1px solid var(--co-border);
  padding:0 12px; height:40px; text-align:left;
  font-size:13px; font-weight:600; color:#2B313B; white-space:nowrap;
}
.co-table tbody td{ padding:9px 12px; border-bottom:1px solid var(--co-border-soft); vertical-align:middle; }
.co-table tbody tr:last-child td{ border-bottom:0; }
.co-table tbody tr.is-clickable{ cursor:pointer; }
.co-table tbody tr.is-clickable:hover td{ background:#FAFBFC; }
.co-table .col-grip{ width:34px; padding-left:16px; padding-right:0; }
.co-table .col-menu{ width:44px; text-align:right; padding-right:14px; }
.co-table .num{ text-align:right; font-variant-numeric:tabular-nums; }
.co-grip{ color:#B6BAC2; font-size:13px; cursor:grab; user-select:none; }
.co-fname{ font-weight:400; }

/* Field-type cell: a line icon plus the type name, as the product shows it. */
.co-type{ display:inline-flex; align-items:center; gap:8px; color:var(--foreground); }
.co-type-ico{ width:17px; height:17px; flex-shrink:0; color:#7B818C; display:grid; place-items:center;
  font-family:var(--font-mono); font-size:10px; font-weight:600; }
.co-type-ico svg{ width:15px; height:15px; }

/* The product's settings tags are rounded rectangles, not the kit's
   999px pills — colours still come from the kit's tag palette. */
.co-tag{
  display:inline-flex; align-items:center; gap:5px;
  padding:3px 9px; border-radius:6px; font-size:12.5px; font-weight:500;
  line-height:1.35; white-space:nowrap;
  background:var(--tag-bg-gray); color:var(--tag-fg-gray);
}
.co-tag.c-blue{ background:var(--tag-bg-blue); color:var(--tag-fg-blue); }
.co-tag.c-teal{ background:var(--tag-bg-teal); color:var(--tag-fg-teal); }
.co-tag.c-green{ background:var(--tag-bg-green); color:var(--tag-fg-green); }
.co-tag.c-yellow{ background:var(--tag-bg-yellow); color:var(--tag-fg-yellow); }
.co-tag.c-orange{ background:var(--tag-bg-orange); color:var(--tag-fg-orange); }
.co-tag.c-purple{ background:var(--tag-bg-purple); color:var(--tag-fg-purple); }
.co-tag.c-pink{ background:var(--tag-bg-pink); color:var(--tag-fg-pink); }
.co-tag.c-red{ background:var(--tag-bg-red); color:var(--tag-fg-red); }
.co-tag.sm{ padding:2px 7px; font-size:11.5px; }
.co-tag.mono{ font-family:var(--font-mono); font-size:11.5px; }
button.co-tag{ cursor:pointer; }
button.co-tag:hover{ filter:brightness(0.97); }

/* Read-only mandatory indicator, matching the product's muted checkbox. */
.co-box{
  width:16px; height:16px; border-radius:4px; border:1px solid var(--co-check-off);
  background:var(--background); display:inline-grid; place-items:center;
}
.co-box.on{ background:var(--co-check-on); border-color:var(--co-check-on); }
.co-box svg{ width:11px; height:11px; color:#fff; }

/* The product's toggle is blue, where the kit's switch is near-black. */
.sc-switch--on{ background:var(--co-blue); }

.co-menu-btn{ width:28px; height:28px; border-radius:7px; display:inline-grid; place-items:center; color:#7B818C; }
.co-menu-btn:hover{ background:var(--co-rail-hover); color:var(--foreground); }
.co-menu-btn svg{ width:15px; height:15px; }

/* ══ Native controls, to the kit's FieldShell spec ══
   FieldShell starts with `all: unset`, which strips a native <input> of
   what we need, so this mirrors its visual spec — 32px, 1px border,
   --radius-md, 14px, primary focus ring. Keep the two in step. */
.co-input{
  display:block; width:100%; height:32px; padding:0 10px;
  background:var(--card); color:var(--foreground);
  border:1px solid var(--border); border-radius:var(--radius-md);
  font-family:inherit; font-size:14px; line-height:1; outline:none;
  transition:border-color 120ms ease, box-shadow 120ms ease;
}
.co-input::placeholder{ color:var(--muted-foreground); }
.co-input:hover:not(:disabled):not(:focus){ border-color:color-mix(in oklab, var(--primary) 25%, var(--border)); }
.co-input:focus{ border-color:var(--co-blue); box-shadow:0 0 0 3px color-mix(in oklab, var(--co-blue) 15%, transparent); }
.co-input:disabled{ opacity:.55; cursor:not-allowed; background:color-mix(in oklab, var(--muted) 40%, var(--card)); }
textarea.co-input{ height:auto; min-height:64px; padding:7px 10px; line-height:1.5; resize:vertical; }
select.co-input{
  cursor:pointer; appearance:none; padding-right:30px;
  background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='%23717179' stroke-width='2'><path d='M6 9l6 6 6-6'/></svg>");
  background-repeat:no-repeat; background-position:right 9px center; background-size:14px;
}
.co-search{ height:38px; border-radius:8px; font-size:14px; }

/* Field-type dropdown — a control that looks like the input beside it
   but can carry an icon, which a native select cannot. */
.co-ddt{ display:flex; align-items:center; gap:8px; text-align:left; cursor:pointer; }
.co-ddt .co-type{ flex:1; min-width:0; }
.co-ddt-chev, .co-ddt-lock{ display:inline-grid; place-items:center; color:var(--muted-foreground); flex-shrink:0; }
.co-ddt-chev svg, .co-ddt-lock svg{ width:15px; height:15px; }
.co-ddt.is-fixed{ cursor:default; background:color-mix(in oklab, var(--muted) 40%, var(--card)); color:var(--muted-foreground); }
.co-dd{
  position:fixed; z-index:430; max-height:320px; overflow-y:auto; padding:4px;
  background:var(--popover); border:1px solid var(--co-border); border-radius:10px;
  box-shadow:0 12px 36px rgba(0,0,0,.14), 0 2px 8px rgba(0,0,0,.06);
}
.co-dd-i{ display:flex; align-items:center; gap:10px; width:100%; padding:8px 10px; border-radius:7px; text-align:left; font-size:14px; }
.co-dd-i:hover{ background:var(--co-rail-hover); }
.co-dd-i.on{ background:var(--co-nav-active); color:#11325E; }
.co-dd-l{ flex:1; min-width:0; }
.co-dd-check{ display:inline-grid; place-items:center; color:var(--co-blue); }
.co-dd-check svg{ width:14px; height:14px; }
.co-mono{ font-family:var(--font-mono); }

/* ══ Bits the kit has no component for ══ */
.co-empty{ border:1px dashed var(--co-border); border-radius:10px; padding:48px 28px; text-align:center; background:var(--co-band); }
.co-empty-t{ font-size:15px; font-weight:600; margin-bottom:6px; }
.co-empty-d{ font-size:14px; color:var(--muted-foreground); line-height:1.55; max-width:460px; margin:0 auto 18px; }

.co-note{
  display:flex; gap:10px; padding:11px 13px; border-radius:8px;
  font-size:13px; line-height:1.55; border:1px solid var(--co-border);
  background:var(--co-band); color:var(--muted-foreground);
  margin-bottom:16px; max-width:940px;
}
.co-note b{ color:var(--foreground); font-weight:600; }
.co-note.warn{ background:var(--tag-bg-yellow); border-color:color-mix(in oklab, var(--tag-fg-yellow) 25%, transparent); color:var(--tag-fg-yellow); }
.co-note.warn b{ color:var(--tag-fg-yellow); }
.co-note-ico{ flex-shrink:0; width:16px; height:16px; margin-top:1px; }
.co-note-ico svg{ width:16px; height:16px; display:block; }

.co-f{ margin-bottom:16px; }
.co-f-row{ display:flex; gap:12px; }
.co-f-row > .co-f{ flex:1; min-width:0; }
.rl-field-hint{ margin-top:5px; }
.co-err{ font-size:11px; color:var(--tag-fg-red); line-height:1.35; margin-top:5px; display:flex; align-items:center; gap:4px; }
.co-err svg{ width:12px; height:12px; flex-shrink:0; }


.co-seg{ display:inline-flex; align-items:center; background:var(--muted); border-radius:var(--radius-md); padding:2px; }
.co-seg button{ height:26px; padding:0 12px; border-radius:calc(var(--radius-md) - 2px); font-size:13px; font-weight:500; color:var(--muted-foreground); }
.co-seg button:hover{ color:var(--foreground); }
.co-seg button.active{ background:var(--background); color:var(--foreground); box-shadow:var(--shadow-xs); }

.co-check{ display:flex; align-items:flex-start; gap:9px; padding:9px 0; cursor:pointer; }
.co-check + .co-check, .co-sw + .co-sw, .co-check + .co-sw, .co-sw + .co-check{ border-top:1px solid var(--border); }
.co-check .sc-check{ margin-top:1px; flex-shrink:0; }
.co-sw{ display:flex; align-items:flex-start; gap:12px; padding:10px 0; }
.co-sw .sc-switch{ flex-shrink:0; margin-top:1px; }
.co-ctl-t{ font-size:14px; font-weight:500; display:flex; align-items:center; gap:6px; flex-wrap:wrap; }
.co-ctl-d{ font-size:12px; color:var(--muted-foreground); line-height:1.5; margin-top:3px; }
.co-check.locked{ cursor:default; }

.co-prev{
  display:flex; align-items:center; gap:10px; background:var(--co-band);
  border:1px solid var(--co-border); border-radius:8px; padding:9px 11px;
  font-size:12.5px; color:var(--muted-foreground);
}
.co-prev-val{
  font-family:var(--font-mono); font-size:13px; color:var(--foreground);
  background:var(--background); border:1px solid var(--co-border);
  border-radius:5px; padding:2px 7px;
}

/* Formula palette: a labelled row per token kind. */
.co-palette{ margin-top:10px; border:1px solid var(--co-border); border-radius:8px; background:var(--co-band); padding:4px 10px; }
.co-tokrow{ display:flex; align-items:flex-start; gap:10px; padding:7px 0; }
.co-tokrow + .co-tokrow{ border-top:1px solid var(--co-border-soft); }
.co-toklabel{ width:70px; flex-shrink:0; font-size:11.5px; font-weight:600; color:var(--muted-foreground); padding-top:4px; }
.co-toks{ display:flex; flex-wrap:wrap; gap:4px; flex:1; min-width:0; }
.co-tok{
  padding:3px 8px; border-radius:6px; font-size:12.5px; line-height:1.4;
  background:var(--background); border:1px solid var(--co-border); color:var(--foreground);
  font-family:var(--font-mono); white-space:nowrap;
}
.co-tok:hover{ border-color:var(--co-blue); color:var(--co-blue); }
.co-tok.op{ min-width:30px; text-align:center; font-weight:600; }
/* An unsized SVG in a chip renders at its natural box and blows the row
   apart — pin it. */
.co-tok{ display:inline-flex; align-items:center; gap:4px; }
.co-tok svg{ width:12px; height:12px; flex-shrink:0; }
.co-tok.find{ border-style:dashed; color:var(--muted-foreground); font-family:var(--font-sans); }
.co-tok.find:hover{ border-style:solid; }

/* Field picker — the one part of the palette that has to survive a
   hundred fields. */
.co-fp{
  position:fixed; z-index:420; width:340px; max-width:92vw;
  background:var(--popover); border:1px solid var(--co-border); border-radius:10px;
  box-shadow:0 12px 36px rgba(0,0,0,.14), 0 2px 8px rgba(0,0,0,.06); overflow:hidden;
}
.co-fp-search{ padding:8px; border-bottom:1px solid var(--co-border-soft); }
.co-fp-list{ max-height:320px; overflow-y:auto; padding:4px; }
.co-fp-group{
  display:flex; align-items:center; gap:6px; width:100%;
  padding:7px 10px 6px; border-radius:7px; text-align:left;
  font-size:11px; font-weight:600; letter-spacing:.04em;
  text-transform:uppercase; color:var(--muted-foreground);
}
.co-fp-group:hover{ background:var(--co-rail-hover); color:var(--foreground); }
.co-fp-chev{ display:inline-grid; place-items:center; transition:transform 140ms ease; }
.co-fp-chev svg{ width:13px; height:13px; }
.co-fp-chev.folded{ transform:rotate(-90deg); }
.co-fp-n{ margin-left:auto; font-weight:500; letter-spacing:0; font-variant-numeric:tabular-nums; }
.co-fp-i{ display:flex; align-items:center; gap:9px; width:100%; padding:6px 10px; border-radius:7px; text-align:left; }
.co-fp-i:hover{ background:var(--co-rail-hover); }
.co-fp-l{ font-size:13.5px; min-width:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
.co-fp-empty{ padding:18px 12px; font-size:13px; color:var(--muted-foreground); text-align:center; }

.co-pl{ display:flex; align-items:center; gap:8px; margin-bottom:6px; }
.co-pl-grip{ color:#B6BAC2; font-size:13px; width:12px; text-align:center; flex-shrink:0; cursor:grab; }
.co-pl-sw{ width:28px; height:28px; border-radius:6px; border:1px solid rgba(0,0,0,.08); flex-shrink:0; cursor:pointer; }

.co-rel-head{ display:flex; align-items:center; gap:9px; }
.co-rel-t{ flex:1; min-width:0; font-size:14px; font-weight:500; }
.co-rel-meta{ font-size:12.5px; color:var(--muted-foreground); line-height:1.65; }
.co-rel-empty{ font-size:13.5px; color:var(--muted-foreground); padding:14px 0; }
.rl-section + .rl-section{ margin-top:9px; }

.co-menu{
  position:absolute; min-width:200px; padding:6px; background:var(--popover);
  border:1px solid var(--co-border); border-radius:10px;
  box-shadow:0 10px 32px rgba(0,0,0,0.08), 0 2px 6px rgba(0,0,0,0.04); z-index:300;
}
.co-menu-i{ display:flex; align-items:center; gap:10px; width:100%; height:32px; padding:0 10px; border-radius:7px; font-size:14px; text-align:left; white-space:nowrap; }
.co-menu-i:hover:not(:disabled){ background:var(--co-rail-hover); }
.co-menu-i.danger{ color:var(--tag-fg-red); }
.co-menu-i.danger:hover{ background:var(--tag-bg-red); }
.co-menu-i:disabled{ color:var(--muted-foreground); cursor:not-allowed; }
.co-menu-sep{ height:1px; background:var(--co-border); margin:4px 2px; }

.co-toast{
  position:fixed; bottom:22px; left:50%; transform:translateX(-50%) translateY(10px);
  background:var(--foreground); color:var(--background); font-size:13.5px;
  padding:10px 16px; border-radius:8px; box-shadow:0 8px 24px rgba(0,0,0,.25);
  opacity:0; pointer-events:none; transition:opacity .16s, transform .16s; z-index:500; max-width:460px;
}
.co-toast.on{ opacity:1; transform:translateX(-50%) translateY(0); }

/* Kit drawers carry a rule under the header; these are title-only, so the
   divider reads as a seam. Overridden here — ds/rl/drawer.css is a verbatim
   mirror of the design system and must not be edited. */
.rl-drawer-header{ border-bottom:0; padding-bottom:6px; }

/* Pill tabs — the product uses these on Permissions, not the 2px
   underline it uses inside an object. */
.co-ptabs{ display:inline-flex; gap:2px; padding:3px; background:var(--co-rail-hover); border-radius:9px; }
.co-ptab{ height:30px; padding:0 14px; border-radius:7px; font-size:14px; color:#4A5260; white-space:nowrap; }
.co-ptab:hover:not(:disabled):not(.on){ color:var(--foreground); }
.co-ptab.on{ background:var(--background); color:var(--co-blue); font-weight:500; box-shadow:var(--shadow-xs); }
.co-ptab:disabled{ color:var(--tdis,#B6BAC2); cursor:not-allowed; }

/* The set list is a plain list, not a bordered card. */
.co-plist thead th{ background:transparent; border-bottom:1px solid var(--co-border); color:var(--muted-foreground); }
.co-plist tbody td{ padding:12px; }

/* Module rail inside a permission set — plain text, no icons. */
.co-mod{ width:232px; flex-shrink:0; display:flex; flex-direction:column; position:sticky; top:0; }
.co-mod-i{
  display:block; width:100%; padding:7px 12px; border-radius:7px;
  font-size:14px; line-height:1.45; color:#2B313B; text-align:left;
}
.co-mod-i + .co-mod-i{ margin-top:1px; }
.co-mod-i:hover{ background:var(--co-rail-hover); }
.co-mod-i.on{ background:var(--co-nav-active); color:#11325E; font-weight:500; }
/* Modules this prototype does not cover keep the normal text colour —
   greying a dozen rows made the whole rail read as broken rather than
   as a rail with one section built. A tooltip says what is going on. */
.co-mod-i:disabled{ cursor:default; }
.co-mod-sep{ height:1px; background:var(--co-border-soft); margin:10px 12px 9px; }
.co-mod-label{ padding:0 12px 6px; font-size:12px; font-weight:600; letter-spacing:.04em;
  text-transform:uppercase; color:var(--muted-foreground); }

/* Read / Edit columns in the field grid. */
.co-fcol{ width:84px; text-align:center; }
.co-table td.co-fcol{ text-align:center; }
.co-fhead{ display:inline-flex; align-items:center; gap:7px; cursor:pointer; }

/* A permission is a checkbox and a sentence. */
.co-perm{ display:flex; align-items:flex-start; gap:11px; padding:7px 0; }
.co-perm.sub{ padding-left:30px; }
.co-perm-body{ flex:1; min-width:0; padding-top:1px; }
.co-perm-line{ display:flex; align-items:center; gap:10px; flex-wrap:wrap; font-size:14px; }
.co-perm-note{ font-size:12px; color:var(--muted-foreground); line-height:1.5; margin-top:3px; }
.co-perm-head{ font-size:14px; font-weight:600; margin:18px 0 6px; }

/* Blue checkbox with a mixed state, as the product draws it. */
.co-chk{
  width:18px; height:18px; flex-shrink:0; margin-top:1px;
  border:1.5px solid var(--co-check-off); border-radius:4px; background:var(--background);
  display:inline-grid; place-items:center; color:#fff; padding:0;
}
.co-chk:hover:not(:disabled):not(.on){ border-color:var(--co-blue); }
.co-chk.on, .co-chk.mixed{ background:var(--co-blue); border-color:var(--co-blue); }
.co-chk svg{ width:12px; height:12px; }
.co-chk:disabled{ opacity:.45; cursor:not-allowed; }
.co-chk.locked{ opacity:.45; cursor:default; }

/* Access mode rides beside the checkbox as a tag, not in a dropdown. */
.co-modetag{
  display:inline-flex; align-items:center; padding:3px 9px; border-radius:6px;
  background:var(--tag-bg-blue); color:var(--tag-fg-blue);
  font-size:12.5px; font-weight:500; line-height:1.35; white-space:nowrap;
}
.co-modetag:hover{ filter:brightness(0.97); }

/* Collapsible card header. */
.co-band-btn{ width:100%; text-align:left; cursor:pointer; }
.co-band-btn:hover{ background:color-mix(in oklab, var(--co-band) 60%, var(--co-rail-hover)); }
.co-band-chev{ display:inline-grid; place-items:center; color:var(--muted-foreground); margin-left:12px; transition:transform 140ms ease; }
.co-band-chev svg{ width:16px; height:16px; }
.co-band-chev.folded{ transform:rotate(-90deg); }

/* Sticky save bar. */
.co-savebar{
  position:absolute; left:0; right:0; bottom:0; display:flex; justify-content:flex-end; gap:10px;
  padding:14px 28px; background:var(--background); border-top:1px solid var(--co-border); z-index:20;
}
.co-main{ position:relative; }

.co-split{ display:flex; gap:20px; align-items:flex-start; }
.co-pnav{ width:210px; flex-shrink:0; display:flex; flex-direction:column; gap:1px; position:sticky; top:0; }
.co-pnav-i{
  display:flex; align-items:center; gap:8px; width:100%; padding:7px 10px;
  border-radius:8px; font-size:14px; color:#2B313B; text-align:left;
}
.co-pnav-i:hover:not(:disabled){ background:var(--co-rail-hover); }
.co-pnav-i.on{ background:var(--co-nav-active); color:#11325E; font-weight:500; }
.co-pnav-i:disabled{ color:var(--muted-foreground); cursor:not-allowed; }
.co-pnav-n{ margin-left:auto; font-size:12px; color:var(--muted-foreground); font-variant-numeric:tabular-nums; }
.co-pbody{ flex:1; min-width:0; }
.co-ptable td{ padding-top:7px; padding-bottom:7px; }
.co-psel{ height:30px; font-size:13px; }
.co-prow.is-open td{ border-bottom:0; }
.co-pfields > td{ padding:0 !important; background:var(--co-band); border-bottom:1px solid var(--co-border); }
.co-pfwrap .co-table tbody td{ border-bottom:1px solid color-mix(in oklab, var(--co-border) 55%, transparent); padding:6px 12px; }
.co-pfwrap .co-table tbody tr:last-child td{ border-bottom:0; }

/* Scope dialog. */
.sc-dialog.co-scope{ max-width:540px; gap:20px; padding:24px 26px 22px; }
.co-scope-head{ display:flex; align-items:flex-start; }
.co-scope-title{ flex:1; font-size:24px; font-weight:600; letter-spacing:-0.02em; }
.co-scope-opt{ display:flex; align-items:flex-start; gap:14px; width:100%; text-align:left; padding:11px 0; }
.co-scope-l{ display:block; font-size:16px; line-height:1.35; }
.co-scope-d{ display:block; font-size:14px; color:var(--muted-foreground); line-height:1.45; margin-top:2px; }
.co-radio{
  width:20px; height:20px; flex-shrink:0; margin-top:2px; border-radius:50%;
  border:1.5px solid var(--co-check-off); background:var(--background); position:relative;
}
.co-scope-opt:hover .co-radio{ border-color:var(--co-blue); }
.co-radio.on{ border-color:var(--co-blue); border-width:2px; box-shadow:0 0 0 3px color-mix(in oklab, var(--co-blue) 18%, transparent); }
.co-radio.on::after{ content:''; position:absolute; inset:3px; border-radius:50%; background:var(--co-blue); }

/* The shadcn dialog ships z-index:50, below the kit's drawer at 100. */
.sc-dialog-overlay{ z-index:400; }
.sc-dialog{ max-width:460px; }
</style>

/* One object permission line: view, create, edit, delete. Account sets
   store a scope ('GLOBAL'|'PARTICIPANT'|'OWNER'|'NONE'); project sets store 0/1.
   `fields` is set per field only where the admin has narrowed it. */
function P(view, create, edit, del){ return {view, create:!!create, edit, del, fields:{}}; }

/* A new object appears in every permission set the moment it is created:
   full access for the account admin, None everywhere else until an admin
   opens the set. Doing it here rather than at render time means a set
   nobody has looked at yet still holds the right answer. */
function seedObjectPermissions(objId){
  state.permSets.forEach(ps => {
    if(ps.objects[objId]) return;
    ps.objects[objId] = (ps.system && ps.scope === 'ACCOUNT')
      ? P('GLOBAL', 1, 'GLOBAL', 'GLOBAL')
      : (ps.scope === 'ACCOUNT' ? P('NONE', 0, 'NONE', 'NONE') : P(0, 0, 0, 0));
  });
}

/* ── State ────────────────────────────────────────────────────────── */
let state = load();
let route = {view:'list', id:null, tab:'fields'};

function load(){
  try{
    const raw = localStorage.getItem(STORE_KEY);
    if(!raw) return seed();
    const s = JSON.parse(raw);
    if(!s || !Array.isArray(s.objects) || !Array.isArray(s.permSets)) return seed();
    return s;
  }catch(e){ return seed(); }
}
function save(){ try{ localStorage.setItem(STORE_KEY, JSON.stringify(state)); }catch(e){} }
function resetData(){ state = seed(); save(); route = {view:'list', id:null, tab:'fields'}; render(); toast('Sample data restored.'); }
function clearData(){ state = {objects:[]}; save(); route = {view:'list', id:null, tab:'fields'}; render(); toast('All custom objects removed.'); }

function pluralise(l){
  const s = String(l||'').trim(); if(!s) return '';
  if(/(s|x|z|ch|sh)$/i.test(s)) return s + 'es';
  if(/[^aeiou]y$/i.test(s)) return s.slice(0,-1) + 'ies';
  return s + 's';
}
/* SO-{0000000} + 1043 → SO-0001043. The token's zeros set the minimum
   width; the number is free to grow past it. */
function autoPreview(fmt, n){
  const m = String(fmt||'').match(/\{(0+)\}/);
  if(!m) return null;
  const digits = m[1].length;
  return String(fmt).replace(m[0], String(n).padStart(digits,'0'));
}

function typeIcon(t){
  const g = TYPE_ICON[t] || '?';
  return `<span class="co-type-ico">${g}</span>`;
}
/* The product's "Value Assignment" column, mapped onto what this feature
   actually defines: a formula or a roll-up computes its own value, and
   everything else is typed in. */
function valueAssignment(f){
  if(f.type === 'FORMULA') return tag('Formula', 'teal');
  if(f.type === 'ROLLUP')  return tag('Roll-up', 'pink');
  if(f.type === 'LOOKUP')  return tag('Relationship', 'purple');
  return tag('Manual input', 'blue');
}

/* Lookup targets can be another custom object or a default object. */
function targetLabel(t){
  if(t === 'ACCOUNT') return 'Account';
  if(t === 'PROJECT') return 'Project';
  const o = obj(t); return o ? o.label : t;
}
function targetPlural(t){
  if(t === 'ACCOUNT') return 'Accounts';
  if(t === 'PROJECT') return 'Projects';
  const o = obj(t); return o ? o.plural : t;
}
/* Every lookup on any object that points at `id` — i.e. the related lists
   that appear on this object, and what blocks its deletion. */
function incoming(id){
  const out = [];
  state.objects.forEach(o => o.fields.forEach(f => {
    if(f.type === 'LOOKUP' && f.settings.target === id) out.push({obj:o, field:f});
  }));
  return out;
}
/* Where a field is referenced, so a delete can say what it would break. */
function usages(o, f){
  const out = [];
  o.fields.forEach(g => {
    if(g.id === f.id) return;
    if(g.type === 'FORMULA' && g.settings.expr && g.settings.expr.includes('{' + f.label + '}')) out.push(`Formula field "${g.label}"`);
    if(g.type === 'ROLLUP' && g.settings.childLookup === f.id) out.push(`Roll-up field "${g.label}"`);
  });
  state.objects.forEach(p => p.fields.forEach(g => {
    if(g.type === 'ROLLUP' && g.settings.child === o.id && (g.settings.aggField === f.id || g.settings.filterField === f.id))
      out.push(`Roll-up "${g.label}" on ${p.label}`);
    /* A formula elsewhere can reach this field through a lookup —
       {Product.Default Price} on Line Item reads a field on Product. */
    if(g.type === 'FORMULA' && g.settings.expr){
      p.fields.forEach(lk => {
        if(lk.type === 'LOOKUP' && lk.settings.target === o.id &&
           g.settings.expr.includes('{' + lk.label + '.' + f.label + '}'))
          out.push(`Formula "${g.label}" on ${p.label}`);
      });
    }
  }));
  return out;
}
function systemFields(o){
  /* `supplied` marks the two a person actually fills in. The rest are
     written by Rocketlane, so the mandatory column stays empty for them. */
  const rows = [
    {label:o.recordNameLabel, type:o.recordNameType === 'AUTONUMBER' ? 'AUTONUMBER' : 'TEXT',
     supplied:o.recordNameType !== 'AUTONUMBER',
     note:'Record Name. Always present and cannot be deleted.'},
  ];
  rows.push(
    {label:'Record ID', type:'TEXT', note:'System ID. Used by lookups, reports and integrations.'},
    {label:'Created by', type:'USER', note:''},
    {label:'Created at', type:'DATETIME', note:''},
    {label:'Updated by', type:'USER', note:''},
    {label:'Updated at', type:'DATETIME', note:''},
  );
  return rows;
}

/* ══ Views ══════════════════════════════════════════════════════════ */
function render(){
  const main = document.getElementById('main');
  main.innerHTML =
      route.view === 'perms'   ? viewPerms()
    : route.view === 'permset' ? viewPermSet()
    : route.view === 'list'    ? viewList()
    : viewObject();
  document.querySelectorAll('.co-nav-i').forEach(el => el.classList.remove('on'));

function go(view, id, tab){ route = {view, id:id||null, tab:tab||'fields', open:null}; render(); }

/* Read-only mandatory marker — the product shows a muted box in the list

/* ── Object detail ────────────────────────────────────────────────── */
function viewObject(){
  const o = obj(route.id);
  if(!o){ route.view = 'list'; return viewList(); }
  const tabs = [
    ['fields','Fields & Relationships', o.fields.length],
    ['rules','Validation rules', (o.rules || []).length],
    ['details','Details', null],
  ];
  const later = ['Record types','Page layouts','Access','Automations'];

  const head = `
    <div class="co-head">
      <div class="co-crumb"><a onclick="go('list')">Custom objects</a><span>›</span><span>${esc(o.label)}</span></div>
      <div style="display:flex;align-items:flex-start;gap:14px">
        <div style="flex:1;min-width:0">
          <div class="co-title">${ICON_CUBE} ${esc(o.label)}</div>
          <div class="co-desc">${esc(o.description) || 'No description'}</div>
        </div>
      </div>
      <div class="co-tabs">
        ${tabs.map(([k,t,n]) => `<button class="co-tab${route.tab===k?' on':''}" onclick="go('object','${o.id}','${k}')">${t}${n!==null?' <span style="color:var(--muted-foreground);font-variant-numeric:tabular-nums">'+n+'</span>':''}</button>`).join('')}
        ${later.map(t => `<button class="co-tab" disabled title="Not in this prototype yet">${t}</button>`).join('')}

  const body = route.tab === 'details' ? tabDetails(o)
             : route.tab === 'rules'   ? tabRules(o)
             : tabFields(o);
  return head + `<div class="co-scroll">${body}</div>`;
}

      <button class="rl-btn v-outline sz-lg" onclick="openFieldDrawer('${o.id}', null, 'LOOKUP')"><span class="rl-btn-label">New relationship</span></button>
      <button class="rl-btn v-primary sz-lg" onclick="openFieldDrawer('${o.id}')"><span class="rl-btn-label">New field</span>${ICO.plus}</button>
    </div>

    <div class="co-card">
      <div class="co-band"><span class="co-band-t">Fields on this object</span><span class="co-band-n">(${o.fields.length})</span></div>
      <table class="co-table">
        <thead><tr>
          <th class="col-grip"></th><th>Field name</th><th>Field type</th>
          <th>Value assignment</th><th>Is mandatory</th><th>Settings</th><th class="col-menu"></th>
        </tr></thead>
        <tbody>${custom}</tbody>
      </table>
    </div>

    <div class="co-card">
      <div class="co-band"><span class="co-band-t">Created automatically</span><span class="co-band-n">(${systemFields(o).length})</span></div>
      <div class="co-band-d">Created with the object. Only the Record Name can be relabelled.</div>
      <table class="co-table"><tbody>${sys}</tbody></table>
    </div>

    ${relationshipCards(o)}`;
}

function fieldRow(o, f){
  const m = typeMeta(f.type);
  const bits = [];
  if(f.unique) bits.push(tag('Unique'));
  if(f.extId) bits.push(tag('External ID'));
  if(f.showInReports === false) bits.push(tag('Not in reports', '', 'sm', 'Hidden from the report builder. Clutter control, not security.'));
  if(f.type === 'LOOKUP'){
    bits.push(tag('→ ' + esc(targetLabel(f.settings.target)), 'purple'));
    /* Both are constraints, not errors — the orange read as a warning. */
    bits.push(f.settings.onDelete === 'BLOCK'
      ? tag('Block delete', '', 'sm', 'The linked record cannot be deleted while records point at it.')
      : tag('Clear on delete', '', 'sm', 'Deleting the linked record clears this value.'));
  }
  if(f.type === 'ROLLUP'){
    const c = obj(f.settings.child);
    bits.push(tag(esc(f.settings.fn) + (f.settings.fn !== 'COUNT' && f.settings.aggField ? ' ' + esc(fieldLabel(f.settings.child, f.settings.aggField)) : ''), 'pink', 'sm'));
    bits.push(tag('of ' + esc(c ? c.plural : f.settings.child), '', 'sm'));
  }
  if(f.type === 'FORMULA'){
    const e = String(f.settings.expr || '');
    bits.push(`<span class="co-tag c-teal sm mono" title="${esc(e)}">${esc(e.slice(0,22))}${e.length>22?'…':''}</span>`);
  }
  if(f.type === 'SELECT' || f.type === 'MULTISELECT') bits.push(tag(`${(f.settings.options||[]).length} values`, '', 'sm'));
  if(f.def) bits.push(tag('Default ' + esc(f.def), '', 'sm'));

  return `<tr class="is-clickable" onclick="openFieldDrawer('${o.id}','${f.id}')">
    <td class="col-grip">${ICO_GRIP}</td>
    <td>
      <div class="co-fname">${esc(f.label)}</div>
    </td>
    <td><span class="co-type">${typeIcon(f.type)}${esc(m.label)}</span>${m.isNew ? ' ' + tag('New', 'purple', 'sm') : ''}</td>
    <td>${valueAssignment(f)}</td>
    <td>${mandatoryBox(!!f.required)}</td>
    <td><div style="display:flex;gap:5px;flex-wrap:wrap;max-width:330px">${bits.join('')}</div></td>
    <td class="col-menu"><button class="co-menu-btn" onclick="event.stopPropagation();fieldMenu(event,'${o.id}','${f.id}')" aria-label="More">${ICO.dots}</button></td>
  </tr>`;
}
function fieldLabel(objId, fieldId){
  const o = obj(objId); if(!o) return fieldId;
  const f = o.fields.find(x => x.id === fieldId);
  return f ? f.label : fieldId;
}

/* ── The relationship half of Fields & Relationships ──────────────
   Three tables rather than three stacks of prose. The direction of a
   link is the thing that confuses people, so each table is named for
   the direction and the columns carry the detail. ────────────────── */
function relationshipCards(o){
  const inc = incoming(o.id);
  const rollups = o.fields.filter(f => f.type === 'ROLLUP');
  const empty = (cols, msg) => `<tr><td colspan="${cols}" style="padding:18px 20px;color:var(--muted-foreground)">${msg}</td></tr>`;

  const referencedBy = `
    <div class="co-card">
      <div class="co-band"><span class="co-band-t">Referenced by</span><span class="co-band-n">(${inc.length})</span></div>
      <div class="co-band-d">Objects whose lookups point at ${esc(o.label)}. Each one shows as a related list on a ${esc(o.label)} record.</div>
      <table class="co-table">
        <thead><tr>
          <th style="padding-left:20px">Object</th><th>Through its field</th><th>Required</th><th class="col-menu"></th>
        </tr></thead>
        <tbody>
          ${inc.length ? inc.map(({obj:pr, field:f}) => `
            <tr class="is-clickable" onclick="go('object','${pr.id}','fields')">
              <td style="padding-left:20px"><div class="co-fname">${esc(pr.label)}</div></td>
              <td><span class="co-type">${typeIcon('LOOKUP')}${esc(f.label)}</span></td>
              <td>${f.required ? tag('Required') : '<span style="color:var(--muted-foreground)">Optional</span>'}</td>
              <td class="col-menu"><button class="co-menu-btn" onclick="event.stopPropagation();go('object','${pr.id}','fields')">${ICO.dots}</button></td>
            </tr>`).join('')
          : empty(4, `No other object points at ${esc(o.label)} yet.`)}
        </tbody>
      </table>
    </div>`;

  const rollHtml = `
    <div class="co-card">
      <div class="co-band"><span class="co-band-t">Roll-ups</span><span class="co-band-n">(${rollups.length})</span>
        <span style="margin-left:10px">${openChip('Recommended, not decided.')}</span></div>
      <table class="co-table">
        <thead><tr>
          <th style="padding-left:20px">Field</th><th>Function</th><th>Aggregates</th>
          <th>Across</th><th>Condition</th><th class="col-menu"></th>
        </tr></thead>
        <tbody>
          ${rollups.length ? rollups.map(f => {
            const c = obj(f.settings.child);
            return `
            <tr class="is-clickable" onclick="openFieldDrawer('${o.id}','${f.id}')">
              <td style="padding-left:20px"><span class="co-type">${typeIcon('ROLLUP')}${esc(f.label)}</span></td>
              <td>${tag(esc(f.settings.fn), 'pink')}</td>
              <td>${f.settings.fn === 'COUNT'
                    ? '<span style="color:var(--muted-foreground)">records</span>'
                    : esc(fieldLabel(f.settings.child, f.settings.aggField))}</td>
              <td style="color:var(--muted-foreground)">${esc(c ? c.plural : f.settings.child)}
                <span style="opacity:.6">via ${esc(c ? fieldLabel(c.id, f.settings.childLookup) : f.settings.childLookup)}</span></td>
              <td style="color:var(--muted-foreground)">${f.settings.filterField
                    ? `${esc(fieldLabel(f.settings.child, f.settings.filterField))} ${f.settings.filterOp === 'neq' ? 'is not' : 'is'} <b style="color:var(--foreground);font-weight:500">${esc(f.settings.filterValue)}</b>`
                    : '<span style="opacity:.6">None</span>'}</td>
              <td class="col-menu"><button class="co-menu-btn" onclick="event.stopPropagation();fieldMenu(event,'${o.id}','${f.id}')">${ICO.dots}</button></td>
            </tr>`;
          }).join('')
          : empty(6, `No roll-ups on ${esc(o.label)} yet.`)}
        </tbody>
      </table>
    </div>`;

  return `
    ${referencedBy}
    ${rollHtml}`;
}

/* ── Tab: details (the Phase 1 settings, after save) ──────────────── */
function tabDetails(o){
  const row = (k, v, note) => `
    <tr>
      <td style="width:210px;color:var(--muted-foreground);vertical-align:top;padding-left:20px;padding-top:13px">${k}</td>
      <td style="padding-right:20px">

      </td>
    </tr>`;
  const next = autoPreview(o.autoFormat, o.autoNext);

  return `
    <div class="co-actions">
      <button class="rl-btn v-outline sz-lg" onclick="openObjectDrawer('${o.id}')"><span class="rl-btn-label">Edit object</span></button>
    </div>

    <div class="co-card">
      <div class="co-band"><span class="co-band-t">Object</span></div>
      <table class="co-table"><tbody>
        ${row('Label', esc(o.label))}
        ${row('Description', esc(o.description) || '<span style="color:var(--muted-foreground)">—</span>')}
        ${row('Record Name', esc(o.recordNameLabel), 'Shown in lists, lookups and search.')}
        ${row('Record Name type', `<span class="co-type">${typeIcon(o.recordNameType === 'AUTONUMBER' ? 'AUTONUMBER' : 'TEXT')}${typeMeta(o.recordNameType === 'AUTONUMBER' ? 'AUTONUMBER' : 'TEXT').label}</span>`)}
        ${o.recordNameType === 'AUTONUMBER' ? row('Numbering',
          `<span class="co-mono">${esc(o.autoFormat)}</span> → <span class="co-mono">${esc(next||'')}</span> next`,
          'Format applies to new records only.') : ''}
      </tbody></table>
    </div>

    <div class="co-card">
      <div class="co-band"><span class="co-band-t">Behaviour</span></div>
      <table class="co-table"><tbody>
        ${row('Reports', o.reports !== false ? tag('On', 'green') : tag('Off'), 'Available in the custom report builder.')}
        ${row('Field history', o.fieldHistory ? tag('On', 'green') : tag('Off'), 'Field changes will be available in the audit logs.')}
        ${row('Search', o.search !== false ? tag('On', 'green') : tag('Off'), 'Can be searched by Record Name.')}
      </tbody></table>
    </div>

    <div class="co-card">
      <div class="co-band">
        <span class="co-band-t">Delete ${esc(o.label)}</span>
        <span style="margin-left:auto"><button class="rl-btn v-danger sz-sm" onclick="confirmDeleteObject('${o.id}')"><span class="rl-btn-label">Delete</span></button></span>
      </div>
      <div style="padding:13px 20px;font-size:12.5px;color:var(--muted-foreground);line-height:1.55">
        Removes ${o.records.toLocaleString()} records and ${o.fields.length} fields.
        ${incoming(o.id).length ? `Blocked while ${incoming(o.id).map(x=>esc(x.obj.label)).join(' and ')} point at it.` : ''}
      </div>
    </div>`;
}

/* ══ Permissions ════════════════════════════════════════════════════
   Settings › Permissions, built to the shipping screen: pill tabs over a
   plain list of sets, then a set page with a module rail on the left and
   a collapsible card per module on the right.

   The product writes a permission as a checkbox with the sentence next
   to it — "Can view projects" — and puts the access mode in a tag beside
   it rather than in a dropdown. Custom objects follow that exactly: four
   checkboxes per object, and on account sets a tag carrying the access
   scope.

   Edits go to a draft so Cancel and Save mean something, as they do in
   the product.
   ══════════════════════════════════════════════════════════════════ */
/* Access scope, in the three the product offers. "No access" is not a
   scope — it is the permission being off, which the checkbox says. */
const MODES = {
  GLOBAL:      {label:'Global access',            note:'For all records'},
  PARTICIPANT: {label:'Projects they are part of', note:'For records linked to a project they are part of'},
  OWNER:       {label:'Projects they own',         note:'For records linked to a project they own'},
  NONE:        {label:'No access',                 note:'Cannot see any records'},
};
const SCOPES = ['GLOBAL','PARTICIPANT','OWNER'];
/* A View on the object always carries these; they cannot be removed. */
const ALWAYS_VISIBLE = ['Created by','Created at','Updated by','Updated at'];

const permSet = id => state.permSets.find(p => p.id === id);
const isAccount = ps => ps.scope === 'ACCOUNT';
const has = v => !!v && v !== 'NONE';

let permDraft = null;          // the set being edited

/* ── List ─────────────────────────────────────────────────────────── */
const PERM_TABS = [
  ['ACCOUNT','Account',   true],
  ['PROJECT','Project',   true],
  ['CUSTOMER','Customer', false],
  ['P_ACCOUNT','Partner: Account', false],
  ['P_PROJECT','Partner: Project', false],
];

function viewPerms(){
  const scope = route.tab === 'PROJECT' ? 'PROJECT' : 'ACCOUNT';
  const sets = state.permSets.filter(p => p.scope === scope);

  return `
    <div class="co-head">
      <div class="co-title">${ICON_SHIELD} Permissions</div>
      <div class="co-desc">Create customized account and project level permissions that grant team members
        precise access levels to various modules in Rocketlane.</div>
    </div>
    <div class="co-scroll">
      <div class="co-actions" style="align-items:center">
        <div class="co-ptabs" style="margin-right:auto">
          ${PERM_TABS.map(([k,l,live]) => `
            <button class="co-ptab${scope===k?' on':''}" ${live?`onclick="go('perms',null,'${k}')"`:'disabled title="Not in this prototype yet"'}>${l}</button>`).join('')}
        </div>
        <button class="rl-btn v-primary sz-lg"><span class="rl-btn-label">New permission</span>${ICO.plus}</button>
      </div>

      <table class="co-table co-plist">
        <thead><tr><th style="padding-left:4px">Permissions</th><th class="col-menu"></th></tr></thead>
        <tbody>
          ${sets.map(ps => `
            <tr class="is-clickable" onclick="openPermSet('${ps.id}')">
              <td style="padding-left:4px">${esc(ps.name)}${ps.default ? ' ' + tag('Default','blue','sm') : ''}</td>
              <td class="col-menu"><button class="co-menu-btn" onclick="event.stopPropagation()" aria-label="More">${ICO.dots}</button></td>
            </tr>`).join('')}
        </tbody>
      </table>
    </div>`;
}

/* ── Set detail ───────────────────────────────────────────────────── */
const PERM_MODULES = ['Projects','Phase','Tasks','Accounts','Account fields','Spaces','Chat',
  'Files and Folders','Status updates','Form responses','Templates','Dashboards','Reports','Settings'];

let permObj = null;   // nav selection inside Custom objects: 'manage' or an object id

function openPermSet(id){
  permDraft = JSON.parse(JSON.stringify(permSet(id)));
  permObj = null;
  go('permset', id);
}
const permDirty = () => permDraft && JSON.stringify(permDraft) !== JSON.stringify(permSet(permDraft.id));
function selectPermObj(key){ permObj = key; render(); }

function viewPermSet(){
  if(!permDraft || permDraft.id !== route.id){
    const ps = permSet(route.id);
    if(!ps){ route.view = 'perms'; return viewPerms(); }
    permDraft = JSON.parse(JSON.stringify(ps));
  }
  const ps = permDraft, acct = isAccount(ps);
  /* Default to the first object, which is the common task. The manage
     permission is a different thing — configuring objects, not using
     their records — so it gets its own entry, as the spec separates it. */
  if(permObj === null) permObj = state.objects.length ? state.objects[0].id : 'manage';

  const navItem = (key, label) =>
    `<button class="co-mod-i${permObj===key?' on':''}" onclick="selectPermObj('${key}')">${label}</button>`;

  return `
    <div class="co-head">
      <div class="co-crumb"><a onclick="go('perms',null,'${ps.scope}')">Permissions</a>
        <span>/</span><span>${acct ? 'Account level' : 'Project level'}</span></div>
      <div class="co-title">${esc(ps.name)}
        <button class="co-menu-btn" aria-label="Rename" style="width:24px;height:24px">${ICO.pencil}</button>
        ${ps.default ? tag('Default','blue') : ''}</div>
      <div class="co-desc">Create customized account and project level permissions that grant team members
        precise access levels to various modules in Rocketlane.</div>
    </div>

    <div class="co-scroll" style="padding-bottom:76px">
      <div class="co-split">
        <div class="co-mod">
          ${PERM_MODULES.map(m => `<button class="co-mod-i" disabled title="Not in this prototype yet">${m}</button>`).join('')}
          <div class="co-mod-sep"></div>
          <div class="co-mod-label">Custom objects</div>
          ${acct ? navItem('manage', 'Manage objects') : ''}
          ${state.objects.map(o => navItem(o.id, esc(o.label))).join('')}
        </div>
        <div class="co-pbody">
          ${permObj === 'manage' ? managePane(ps) : objectPane(ps, obj(permObj) || state.objects[0])}
        </div>
      </div>
    </div>

    <div class="co-savebar">
      <button class="rl-btn v-outline sz-md" onclick="go('perms',null,'${ps.scope}')"><span class="rl-btn-label">Cancel</span></button>
      <button class="rl-btn v-primary sz-md" ${permDirty()?'':'disabled'} onclick="savePermSet()"><span class="rl-btn-label">Save</span></button>
    </div>`;
}


function managePane(ps){
  return `
    <div class="co-card">
      <div class="co-band"><span class="co-band-t">Manage objects</span></div>
      <div style="padding:14px 20px">
        ${permRow('Can manage custom objects', ps.manage, "togglePermManage()", null,
          'Create objects and change their fields, relationships and layouts. Grants no access to records.')}
      </div>
    </div>`;
}

function objectPane(ps, o){
  const acct = isAccount(ps);
  if(!ps.objects[o.id]) ps.objects[o.id] = P(acct?'NONE':0, 0, acct?'NONE':0, acct?'NONE':0);
  const p = ps.objects[o.id];
  const noun = o.plural.toLowerCase();
  const noView = !has(p.view), noEdit = !has(p.edit);

  const modeTag = key => {
    if(!acct || !has(p[key])) return '';
    const m = MODES[p[key]];
    /* Label only: these scope names say it, and the dialog carries the
       sentence. "Projects they are part of · For records linked to a
       project they are part of" was the tag repeating itself. */
    return `<button class="co-modetag" onclick="openScope('${o.id}','${key}')" title="${esc(m.note)}">${m.label}</button>`;
  };
  const toggle = key => `togglePerm('${o.id}','${key}')`;

  return `
    <div class="co-card">
      <div class="co-band"><span class="co-band-t">${esc(o.label)}</span></div>
      <div style="padding:14px 20px 16px">
        ${permRow(`Can view ${esc(noun)}`, has(p.view), toggle('view'), modeTag('view'))}
        ${permRow(`Can create ${esc(noun)}`, !!p.create, toggle('create'), '', '', false, noView)}
        ${permRow(`Can edit ${esc(noun)}`, has(p.edit), toggle('edit'), modeTag('edit'), '', false, noView)}
        ${permRow(`Can delete ${esc(noun)}`, has(p.del), toggle('del'), modeTag('del'), '', false, noView || noEdit)}
      </div>
    </div>

    ${fieldGrid(ps, o, p)}`;
}

/* One checkbox and a sentence, optionally with an access tag and a note
   — the form the product uses for every permission. */
function permRow(label, on, onclick, modeTag, note, sub, disabled){
  return `
    <div class="co-perm${sub?' sub':''}">
      <button class="co-chk${on===true?' on':''}${on==='mixed'?' mixed':''}" ${disabled?'disabled':''}
              onclick="${disabled?'':onclick}" role="checkbox" aria-checked="${on===true}">
        ${on === 'mixed' ? ICO.dash : on ? ICO.check : ''}
      </button>
      <div class="co-perm-body">
        <div class="co-perm-line">
          <span${disabled?' style="color:var(--muted-foreground)"':''}>${label}</span>
          ${modeTag || ''}
        </div>
        ${note ? `<div class="co-perm-note">${note}</div>` : ''}
      </div>
    </div>`;
}


/* Field access is stored only where an admin narrows it; otherwise it
   follows the object — Read where the set can view, Edit where it can
   edit, and never Edit on a calculated field. */
function fieldDefault(p, f){
  if(f && (f.type === 'FORMULA' || f.type === 'ROLLUP')) return has(p.view) ? 'READ' : 'NONE';
  return has(p.edit) ? 'EDIT' : has(p.view) ? 'READ' : 'NONE';
}
function fieldAccess(p, fid){
  if(p.fields[fid]) return p.fields[fid];
  const o = state.objects.find(x => x.fields.some(f => f.id === fid));
  return fieldDefault(p, o && o.fields.find(f => f.id === fid));
}

/* Field permissions as a Read / Edit grid.
   Salesforce gets this shape right: one row per field, two columns, and a
   tick in the header to set a whole column. It scans in a way a stack of
   checkbox sentences does not, so this is the one place the object page
   stops using Rocketlane's sentence form.

   Edit implies Read, the way it does there — and Edit additionally needs
   Edit on the object itself. */
function fieldGrid(ps, o, p){
  const noView = !has(p.view), noEdit = !has(p.edit);
  const states = o.fields.map(f => fieldAccess(p, f.id));
  const allRead = states.length && states.every(v => v !== 'NONE');
  const allEdit = states.length && states.every(v => v === 'EDIT');

  if(noView){
    return `
      <div class="co-card">
        <div class="co-band"><span class="co-band-t">Field permissions</span></div>
        <div style="padding:16px 20px;color:var(--muted-foreground);font-size:13.5px">
          Turn on view to set field permissions.
        </div>
      </div>`;
  }

  const box = (on, locked, onclick, title) => `
    <button class="co-chk${on?' on':''}${locked?' locked':''}" ${locked?'disabled':''}
            ${locked?'':`onclick="${onclick}"`} ${title?`title="${esc(title)}"`:''}
            role="checkbox" aria-checked="${!!on}">${on?ICO.check:''}</button>`;

  const row = (label, type, read, edit, readLock, editLock, fid) => `
    <tr>
      <td style="padding-left:20px">${type
        ? `<span class="co-type">${typeIcon(type)}${label}</span>`
        : `<span style="color:var(--muted-foreground)">${label}</span>`}</td>
      <td style="color:var(--muted-foreground)">${type ? esc(typeMeta(type).label) : 'System'}</td>
      <td class="co-fcol">${box(read, readLock, `setFieldCol('${o.id}','${fid}','read')`,
        readLock ? 'Always visible' : '')}</td>
      <td class="co-fcol">${box(edit, editLock, `setFieldCol('${o.id}','${fid}','edit')`,
        editLock ? (noEdit ? 'Needs edit access on the object' : 'Set by Rocketlane') : '')}</td>
    </tr>`;

  return `
    <div class="co-card">
      <div class="co-band"><span class="co-band-t">Field permissions</span>
        <span class="co-band-n">${states.filter(v => v !== 'NONE').length} of ${states.length} visible</span></div>
      <table class="co-table">
        <thead><tr>
          <th style="padding-left:20px">Field</th><th>Type</th>
          <th class="co-fcol">
            <label class="co-fhead">${box(allRead, false, `setAllCol('${o.id}','read')`)}<span>Read</span></label>
          </th>
          <th class="co-fcol">
            <label class="co-fhead">${box(allEdit, noEdit, `setAllCol('${o.id}','edit')`)}<span>Edit</span></label>
          </th>
        </tr></thead>
        <tbody>
          ${o.fields.map(f => {
            const v = fieldAccess(p, f.id);
            const calculated = f.type === 'FORMULA' || f.type === 'ROLLUP';
            return row(esc(f.label), f.type, v !== 'NONE', v === 'EDIT', false,
              noEdit || calculated, f.id);
          }).join('')}
          ${row(esc(o.recordNameLabel), o.recordNameType === 'AUTONUMBER' ? 'AUTONUMBER' : 'TEXT',
                true, !noEdit && o.recordNameType !== 'AUTONUMBER', true,
                noEdit || o.recordNameType === 'AUTONUMBER', '_name')}
          ${ALWAYS_VISIBLE.map(l => row(esc(l), null, true, false, true, true, '_sys')).join('')}
        </tbody>
      </table>
      <div class="co-band-d" style="border-bottom:0;border-top:1px solid var(--co-border)">
        Edit includes Read. Record Name and the audit fields are always visible.
        ${noEdit ? 'Edit on a field needs edit access on the object.' : ''}
      </div>
    </div>`;
}

/* ── Edits (all against the draft) ────────────────────────────────── */
function togglePerm(objId, key){
  const ps = permDraft, p = ps.objects[objId], acct = isAccount(ps);
  const off = acct ? 'NONE' : 0;
  if(key === 'create') p.create = !p.create;
  else p[key] = has(p[key]) ? off : (acct ? 'OWNER' : 1);
  /* Dependencies, applied as you edit: Create, Edit and Delete each need
     View; Delete also needs Edit. */
  if(!has(p.view)){ p.create = false; p.edit = off; p.del = off; }
  if(!has(p.edit)) p.del = off;
  render();
}
function setMode(objId, key, mode){
  const p = permDraft.objects[objId];
  p[key] = mode;
  if(!has(p.view)){ p.create = false; p.edit = 'NONE'; p.del = 'NONE'; }
  if(!has(p.edit)) p.del = 'NONE';
  render();
}
/* Scope picker — the product asks for this in a dialog with one radio
   per scope and its sentence, so a change is deliberate rather than a
   stray click in a menu. */
let scopeEdit = null;
function openScope(objId, key){
  scopeEdit = {objId, key, value: permDraft.objects[objId][key]};
  renderScope();
}
function pickScope(v){ scopeEdit.value = v; renderScope(); }
function closeScope(){ scopeEdit = null; closeDialog(); }
function saveScope(){
  const {objId, key, value} = scopeEdit;
  scopeEdit = null; closeDialog();
  setMode(objId, key, value);
}
function renderScope(){
  document.getElementById('dialog-host').innerHTML = `
    <div class="sc-dialog-overlay" onclick="if(event.target===this) closeScope()">
      <div class="sc-dialog co-scope" role="dialog" aria-modal="true">
        <div class="co-scope-head">
          <div class="co-scope-title">Permissions</div>
          <button class="co-menu-btn" onclick="closeScope()" aria-label="Close">${ICO.x}</button>
        </div>
        <div>
          ${SCOPES.map(k => `
            <button class="co-scope-opt" onclick="pickScope('${k}')">
              <span class="co-radio${scopeEdit.value===k?' on':''}"></span>
              <span>
                <span class="co-scope-l">${MODES[k].label}</span>
                <span class="co-scope-d">${MODES[k].note}</span>
              </span>
            </button>`).join('')}
        </div>
        <div class="sc-dialog-footer">
          <button class="rl-btn v-outline sz-md" onclick="closeScope()"><span class="rl-btn-label">Cancel</span></button>
          <button class="rl-btn v-primary sz-md" onclick="saveScope()"><span class="rl-btn-label">Save</span></button>
        </div>
      </div>
    </div>`;
}
/* Read and Edit as two columns: Edit implies Read, clearing Read clears
   Edit. Mirrors how Salesforce behaves, and keeps our NONE/READ/EDIT
   model intact underneath. */
function setFieldCol(objId, fid, col){
  const p = permDraft.objects[objId];
  const v = fieldAccess(p, fid);
  p.fields[fid] = col === 'read'
    ? (v === 'NONE' ? 'READ' : 'NONE')
    : (v === 'EDIT' ? 'READ' : 'EDIT');
  render();
}
function setAllCol(objId, col){
  const p = permDraft.objects[objId], o = obj(objId);
  const states = o.fields.map(f => fieldAccess(p, f.id));
  const v = col === 'read'
    ? (states.every(x => x !== 'NONE') ? 'NONE' : 'READ')
    : (states.every(x => x === 'EDIT') ? 'READ' : 'EDIT');
  o.fields.forEach(f => {
    /* A formula or roll-up is read-only, so it never takes Edit. */
    const calculated = f.type === 'FORMULA' || f.type === 'ROLLUP';
    p.fields[f.id] = (v === 'EDIT' && calculated) ? 'READ' : v;
  });
  render();
}
function togglePermManage(){ permDraft.manage = !permDraft.manage; render(); }

function savePermSet(){
  const i = state.permSets.findIndex(p => p.id === permDraft.id);
  state.permSets[i] = JSON.parse(JSON.stringify(permDraft));
  save(); render();
  toast(`${permDraft.name} saved.`);
}

/* ══ Validation rules ═══════════════════════════════════════════════
   A rule runs on save and blocks it. Salesforce calls the expression an
   "error condition" and leaves you to work out which way round it runs;
   this says it in the label — "Block the save when" — so the direction
   is never in doubt.

   The condition editor is the formula palette, with a boolean function
   set. Everything a rule needs is already there: fields on the object,
   fields one hop away through a lookup, comparison and logic.
   ══════════════════════════════════════════════════════════════════ */
/* isempty, isnotempty and contains are operators in Rocketlane, so they
   sit in the Operators row. What is left here are the ones with no
   operator form. */
const RULE_FNS = [
  {t:'ISCHANGED(',  hint:'Changed in this save'},
  {t:'PRIORVALUE(', hint:'Value before this save'},
  {t:'TODAY()',     hint:'Today’s date'},
  {t:'REGEX(',      hint:'Matches a pattern'},
  {t:'ROUND(',      hint:'Round to decimals'},
  {t:'ABS(',        hint:'Drop the minus sign'},
];

function tabRules(o){
  const rules = o.rules || (o.rules = []);
  const active = rules.filter(r => r.active).length;

  const rows = rules.length ? rules.map(r => `
    <tr class="is-clickable" onclick="openRuleDrawer('${o.id}','${r.id}')">
      <td style="padding-left:20px">
        <div class="co-fname">${esc(r.name)}</div>
      </td>
      <td><span class="co-mono" style="font-size:12px;color:var(--muted-foreground)">${esc(truncate(r.condition, 46))}</span></td>
      <td style="white-space:normal;max-width:280px">${esc(truncate(r.message, 80))}</td>
      <td>
        <button class="sc-switch${r.active ? ' sc-switch--on' : ''}" role="switch" aria-checked="${!!r.active}"
                onclick="event.stopPropagation();toggleRule('${o.id}','${r.id}')"><span class="sc-switch-thumb"></span></button>
      </td>
      <td class="col-menu"><button class="co-menu-btn" onclick="event.stopPropagation();ruleMenu(event,'${o.id}','${r.id}')">${ICO.dots}</button></td>
    </tr>`).join('')
  : `<tr><td colspan="5" style="padding:22px 20px;color:var(--muted-foreground)">
      No validation rules on ${esc(o.label)} yet. A rule checks a record when someone saves it, and
      stops the save when the check fails.</td></tr>`;

  return `
    <div class="co-actions">
      <button class="rl-btn v-primary sz-lg" onclick="openRuleDrawer('${o.id}')"><span class="rl-btn-label">New rule</span>${ICO.plus}</button>
    </div>
    <div class="co-card">
      <div class="co-band"><span class="co-band-t">Validation rules</span>
        <span class="co-band-n">${rules.length ? `${active} of ${rules.length} active` : '(0)'}</span></div>
      <table class="co-table">
        <thead><tr>
          <th style="padding-left:20px">Rule</th><th>Blocks the save when</th><th>Message</th>
          <th style="width:70px">Active</th><th class="col-menu"></th>
        </tr></thead>
        <tbody>${rows}</tbody>
      </table>
    </div>
    <div class="co-note">
      <span class="co-note-ico">${ICO.info}</span>
      <div>Rules run on every path a record is written — the form, import, the API and sync.
      A bulk import saves the rows that pass and reports the rest.</div>
    </div>`;
}

const truncate = (t, n) => { t = String(t || ''); return t.length > n ? t.slice(0, n) + '…' : t; };

function toggleRule(objId, ruleId){
  const r = obj(objId).rules.find(x => x.id === ruleId);
  r.active = !r.active;
  save(); render();
  toast(`${r.name} ${r.active ? 'is now active' : 'is no longer active'}.`);
}
function ruleMenu(ev, objId, ruleId){
  showMenu(ev, [
    {label:'Edit rule', fn:() => openRuleDrawer(objId, ruleId)},
    '-',
    {label:'Delete rule', danger:true, fn:() => confirmDeleteRule(objId, ruleId)},
  ]);
}
function confirmDeleteRule(objId, ruleId){
  const o = obj(objId), r = o.rules.find(x => x.id === ruleId);
  dialog({
    title:`Delete “${esc(r.name)}”?`,
    body:`Records that this rule would have blocked will save from now on. Existing records are not rechecked.`,
    confirm:'Delete rule', danger:true,
    onConfirm(){
      o.rules = o.rules.filter(x => x.id !== ruleId);
      save(); render(); toast(`${r.name} deleted.`);
    },
  });
}

/* ── Rule editor ──────────────────────────────────────────────────── */
let vr = null;

function openRuleDrawer(objId, ruleId){
  const o = obj(objId);
  const r = ruleId ? o.rules.find(x => x.id === ruleId) : null;
  vr = {
    objId, ruleId: ruleId || null, err:{},
    d: r ? JSON.parse(JSON.stringify(r))
         : {name:'', description:'', condition:'', message:'', active:true},
  };
  vrRender();
}

function vrRender(){
  const o = obj(vr.objId), d = vr.d, editing = !!vr.ruleId;

  showDrawer(
    drawerHead(editing ? 'Edit rule' : 'New validation rule') + `
    <div class="rl-drawer-body">
      ${field('Rule name', true,
        `<input class="co-input" id="vr-name" value="${esc(d.name)}" placeholder="eg. Quantity must be more than 0"
                oninput="vr.d.name = this.value; delete vr.err.name">`,
        '', fErr('name', vr.err))}

      ${field('Description', false,
        `<input class="co-input" value="${esc(d.description)}" placeholder="A note for admins"
                oninput="vr.d.description = this.value">`)}

      <div class="co-f"><div class="rl-field">
        <label class="rl-field-label">Block the save when <span class="rl-field-required">*</span></label>
        <textarea class="co-input co-mono" id="vr-expr" rows="3"
                  placeholder="{Quantity} isempty OR {Quantity} <= 0"
                  oninput="vr.d.condition = this.value; exprCheck(this.value)">${esc(d.condition)}</textarea>
        ${fErr('condition', vr.err)}
        <div id="vr-expr-warn">${exprWarning(d.condition)}</div>
        ${exprPalette('vr-expr', o.id, {bool:true, fns:RULE_FNS, onChange: v => { vr.d.condition = v; }})}
        <div class="rl-field-hint">The rule runs on save. When this is true the save is stopped and your
          message is shown — so it describes the records you want to reject, not the ones you want to allow.</div>
      </div></div>

      ${field('Message', true,
        `<textarea class="co-input" rows="2" placeholder="eg. Quantity must be more than 0."
                   oninput="vr.d.message = this.value; delete vr.err.message">${esc(d.message)}</textarea>`,
        'What the person saving the record sees.', fErr('message', vr.err))}

      <div class="co-sw" style="border-top:1px solid var(--border);margin-top:4px">
        <button class="sc-switch${d.active ? ' sc-switch--on' : ''}" role="switch" aria-checked="${!!d.active}"
                onclick="vr.d.active = !vr.d.active; vrRender()"><span class="sc-switch-thumb"></span></button>
        <div style="flex:1">
          <div class="co-ctl-t">Active</div>
          <div class="co-ctl-d">Turn off to keep the rule without enforcing it.</div>
        </div>
      </div>
    </div>` +
    drawerFoot('', editing ? 'Save rule' : 'Create rule', 'vrSave()'),
    560, 'rule:' + (vr.ruleId || 'new'));

  const el = document.getElementById('vr-name');
  if(el && !editing && !vr.focused){ vr.focused = true; setTimeout(() => el.focus(), 60); }
}

function vrSave(){
  const o = obj(vr.objId), d = vr.d; vr.err = {};
  const name = (d.name || '').trim();
  if(!name) vr.err.name = 'Give the rule a name.';
  else if((o.rules || []).some(r => r.id !== vr.ruleId && r.name.toLowerCase() === name.toLowerCase()))
    vr.err.name = `${o.label} already has a rule called “${name}”.`;
  if(!(d.condition || '').trim()) vr.err.condition = 'Write the condition that blocks the save.';
  if(!(d.message || '').trim()) vr.err.message = 'Write the message the person will see.';
  if(Object.keys(vr.err).length){ vrRender(); return; }

  d.name = name;
  if(vr.ruleId){
    const i = o.rules.findIndex(r => r.id === vr.ruleId);
    o.rules[i] = Object.assign({}, o.rules[i], d);
    toast(`${name} updated.`);
  }else{
    d.id = uid('r');
    (o.rules || (o.rules = [])).push(d);
    toast(d.active ? `${name} created and active.` : `${name} created, not yet active.`);
  }
  o.updated = 'Just now';
  save(); closeDrawer(); render();
}

/* ══ Drawer plumbing — the kit's right-side sheet ═══════════════════ */
let drawerKey = null;

function showDrawer(inner, width, key){
  const host = document.getElementById('drawer-host');
  const panel = host.querySelector('.rl-drawer-panel');
  /* Re-rendering the same drawer swaps only the panel's contents: the
     entrance animation stays a first-open event, and the reader keeps
     their scroll position instead of being thrown back to the top by a
     segmented control half way down the form. */
  if(key && key === drawerKey && panel){
    const prevTop = (host.querySelector('.rl-drawer-body') || {}).scrollTop || 0;
    panel.style.width = (width || 560) + 'px';
    panel.innerHTML = inner;
    const b = host.querySelector('.rl-drawer-body');
    if(b) b.scrollTop = prevTop;
    return;
  }
  drawerKey = key || null;
  host.innerHTML = `
    <div class="rl-drawer-root side-right" role="dialog" aria-modal="true">
      <div class="rl-drawer-scrim" onclick="closeDrawer()"></div>
      <div class="rl-drawer-panel" style="width:${width || 560}px">${inner}</div>
    </div>`;
}
function closeDrawer(){
  document.getElementById('drawer-host').innerHTML = '';
  od = null; fd = null; drawerKey = null;
}
document.addEventListener('keydown', e => { if(e.key === 'Escape'){ closeMenu(); closeDrawer(); } });

function drawerHead(title, desc, backFn){
  return `<div class="rl-drawer-header">
    ${backFn ? `<button class="rl-drawer-close" onclick="${backFn}" aria-label="Back" style="margin-left:-4px">${ICO.back}</button>` : ''}
    <div class="rl-drawer-titles">
      <h2 class="rl-drawer-title">${title}</h2>
      ${desc ? `<p class="rl-drawer-description">${desc}</p>` : ''}
    </div>
    <button class="rl-drawer-close" onclick="closeDrawer()" aria-label="Close">${ICO.x}</button>
  </div>`;
}
function drawerFoot(note, confirmLabel, onConfirm){
  return `<div class="rl-drawer-footer">
    <span class="rl-drawer-footer-spacer" style="font-size:11.5px;color:var(--muted-foreground);line-height:1.4;max-width:260px">${note}</span>
    <button class="rl-btn v-outline sz-md" onclick="closeDrawer()"><span class="rl-btn-label">Cancel</span></button>
    <button class="rl-btn v-primary sz-md" onclick="${onConfirm}"><span class="rl-btn-label">${confirmLabel}</span></button>
  </div>`;
}
/* Label + control + hint, using the kit's Field atom. */
function field(label, required, control, hint, err){
  return `<div class="co-f"><div class="rl-field">
    <label class="rl-field-label">${label}${required?' <span class="rl-field-required">*</span>':''}</label>
    ${control}
    ${hint ? `<div class="rl-field-hint">${hint}</div>` : ''}
    ${err || ''}
  </div></div>`;
}
function fErr(key, store){
  return store[key] ? `<div class="co-err">${ICO.warn} ${esc(store[key])}</div>` : '';
}

      ${[['reports','Reports','Available in the custom report builder.'],
